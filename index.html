/* ---- Измеряемые упражнения (time / time_goal / breakaway) ---- */
function startMeasure(st){
  const e=EX[st.ex];
  // Только игроки ЭТОГО блока: в смешанном занятии второй брат в это время
  // делает своё упражнение того же номера.
  const mine=blockPlayers(st.ex);
  const plan=repsFor(st.ex,S.spec);
  PLAYERS.forEach(pl=>{ if(mine.indexOf(pl)<0)plan[pl]=[]; });
  const order=[]; const mx=Math.max(plan.DANIIL.length,plan.ADRIAN.length);
  for(let i=0;i<mx;i++){ if(plan.DANIIL[i])order.push(plan.DANIIL[i]);
    if(plan.ADRIAN[i])order.push(plan.ADRIAN[i]); }
  // best и stopped — ПО СЕРИЯМ, а серия это игрок+вариант: старт сидя
  // всегда медленнее старта стоя, 20 м медленнее 15 м, и общий лучший
  // результат обрывал бы серию на ровном месте (dupl. bot/rules.py).
  S.measure={ex:st.ex,type:e.type,order,pos:0,
    stopped:{}, best:{},
    readyAt:{DANIIL:0,ADRIAN:0},firstDone:{DANIIL:false,ADRIAN:false}};
  saveSession(); measureAdvance();
}
// Ключ серии: свой вариант у каждого игрока.
function seriesKey(cur){ return cur.player+"|"+(cur.variant||""); }
function measureAdvance(){
  const m=S.measure;
  // Пропущенный игрок выпадает из очереди, второй доигрывает своё.
  while(m.pos<m.order.length&&(m.stopped[seriesKey(m.order[m.pos])]
        ||isSkipped(m.order[m.pos].player)))m.pos++;
  if(m.pos>=m.order.length)return afterMeasure();
  const cur=m.order[m.pos];
  if(cur.firstRest&&!m.firstDone[cur.player]) return screenFullRest(cur);
  const remain=m.readyAt[cur.player]-Date.now();
  if(remain<=10000) return screenStopwatch(cur, remain>0);
  return screenRestWait(cur);
}
function afterMeasure(){
  const m=S.measure;
  /* «Отрыв»: три забега подряд, потом экран дельты 1-3. Деления на части
     нет с 19.08, ударов Адриана с места тоже — он бежит наравне. Дельту
     показываем каждому, у кого набралось хотя бы два зачётных забега. */
  if(m.ex==="E15"&&!m.deltaShown){ m.deltaShown=true; return screenBreakawayDelta(); }
  // Упражнение закрыто: снимаем состояние, иначе оно висит в сохранённой
  // сессии и при возврате в приложение мешает продолжить следующее.
  delete S.measure; saveSession();
  nextStep();
}
// Приложение само считает дельту 1-3 — тренер не считает руками.
function breakawayTimes(player){
  return S.attempts.filter(a=>a.player===player&&a.exercise_id==="E15"
      &&a.time_sec!==null&&!a.lost)
    .sort((a,b)=>a.attempt_no-b.attempt_no).map(a=>a.time_sec);
}
function screenBreakawayDelta(){
  const cards=PLAYERS.map(pl=>{
    const times=breakawayTimes(pl);
    const d=times.length>=2?Math.round((times[times.length-1]-times[0])*100)/100:null;
    let verdict="";
    if(d!==null) verdict = oldBreakawayTiming()
      ? "Старый формат замера: дельта не оценивается."
      : d<0.3?"Способен повторить отрыв."
      : d<=0.6?"На границе." : "Не способен, ноги не восстанавливаются между всплесками.";
    if(!times.length) return "";
    return `<div class="card center"><div class="name">${RU[pl]}</div>
      <div class="big" style="font-size:30px">${times.map(t=>t.toFixed(2)).join(" → ")}</div>
      <div class="title">Дельта 1-3: ${d!==null?d.toFixed(2):"—"}</div>
      <div class="note">${verdict}</div></div>`;
  }).join("");
  h(`<h1>Отрыв · дельта</h1>${cards||`<div class="card center"><div class="note">Замеров нет.</div></div>`}
    <div class="row"><button class="go" onclick="afterMeasure()">Дальше</button></div>`);
}
function screenFullRest(cur){
  // exOf, а не EX[...]: в контрольный день коды слотов E08_D/E08_A.
  const e=exOf(cur.ex), target=Date.now()+FULL_REST_SEC*1000;
  h(`<h1>Полный отдых ${FULL_REST_SEC} сек</h1>
    <div class="card center"><div class="sub">${RU[cur.player]} · до</div>
      <div class="big">${hhmmss(new Date(target))}</div>
      <div class="big" id="rc"></div></div>
    ${e.firstRestText?`<div class="reps" style="white-space:pre-line">${e.firstRestText}</div>`:""}
    <div class="row"><button class="go" onclick="finishFullRest()">Готово, на старт</button></div>
    ${smallActions()}`);

}
function finishFullRest(){ stopCountdown();
  const m=S.measure; m.firstDone[m.order[m.pos].player]=true; measureAdvance(); }

function screenRestWait(cur){
  const m=S.measure, other=cur.player==="DANIIL"?"ADRIAN":"DANIIL";
  const readyDt=new Date(m.readyAt[cur.player]);
  h(`<h1>Отдых</h1>
    ${(m.redo&&m.pos===m.redo.slot)?`<div class="warnbox center">Переписываем попытку ${cur.attempt_no}.</div>`:""}
    <div class="card center"><div class="sub">следующий</div>
      <div class="name">${RU[cur.player]}</div>
      <div class="note">готов в ${hhmmss(readyDt)}</div>
      <div class="big" id="rc"></div></div>
    ${(m.order.slice(m.pos).some(o=>o.player===other&&!m.stopped[seriesKey(o)])
       &&m.readyAt[other]>Date.now())?
      `<div class="note center">${RU[other]} готов в ${hhmmss(new Date(m.readyAt[other]))}</div>`:""}
    <div class="row"><button class="ghost" onclick="skipRest()">Пропустить отдых</button>
      <button class="ghost" onclick="measureBack()">Назад</button></div>
    ${smallActions()}`);
  // За 10 секунд уходим на секундомер — отсчёт продолжается уже там,
  // чтобы можно было дать старт в любой момент последних секунд.
  countdownTo(m.readyAt[cur.player],"rc");
  if(S._restTimer)clearInterval(S._restTimer);
  const tick=()=>{
    if(!document.getElementById("rc")){clearInterval(S._restTimer);return;}
    if(m.readyAt[cur.player]-Date.now()<=10000){
      clearInterval(S._restTimer);S._restTimer=null;
      screenStopwatch(cur,true);}
  };
  tick(); S._restTimer=setInterval(tick,250);
}
function skipRest(){ if(S._restTimer){clearInterval(S._restTimer);S._restTimer=null;}
  stopCountdown();
  const m=S.measure; m.readyAt[m.order[m.pos].player]=Date.now(); measureAdvance(); }

function screenStopwatch(cur,ready10){
  const m=S.measure, e=exOf(cur.ex);
  const other=cur.player==="DANIIL"?"ADRIAN":"DANIIL";
  const forPlayer=m.order.filter(o=>o.player===cur.player);
  const idx=m.order.slice(0,m.pos+1).filter(o=>o.player===cur.player).length;
  const total=forPlayer.length;
  const variantLine=variantLabel(cur);
  let nextInfo="";
  for(let k=m.pos+1;k<m.order.length;k++){ if(!m.stopped[seriesKey(m.order[k])]){

  const redo=(m.redo&&m.pos===m.redo.slot)?

    `${m.redo.prev!==null&&m.redo.prev!==undefined?Number(m.redo.prev).toFixed(2):"не засечено"}`+
    ` будет заменён.</div>`:"";
  const prev=prevToday(cur.player,cur.ex,cur.variant), rec=recordFor(cur.player,cur.ex,cur.variant);
  const recLine=(prev!==null||rec!==null)?`Пред. ${prev!==null?prev.toFixed(2):"—"} · рекорд ${rec!==null?rec.toFixed(2):"—"}`:"";
  h(`${redo}${ready10?`<div class="warnbox center">ГОТОВНОСТЬ<div id="rc10"></div></div>`:""}
    <div class="title">${e.name}</div><div class="hr"></div>
    ${e.watchNote?`<div class="note center">${e.watchNote}</div>`:""}
    ${ballTimed(cur.ex)?`<div class="warnbox center">${BALL_WATCH_RULE}</div>`:""}
    <div class="tap" id="tap" onclick="tapWatch()">
      <div class="name">${RU[cur.player]}</div>
      <div class="note">попытка ${idx} из ${total}${variantLine?" · "+variantLine:""}</div>
      <div class="num" id="num">0.00</div>
      <div class="note" id="hint">тап = старт</div></div>
    <div class="note">${recLine}</div>
    <div class="note">${nextInfo}</div>
    ${otherRestHtml()}
    <div class="row">
      <button class="ghost small" onclick="notMeasured()">Не засёк</button>
      ${LOST_EXERCISES.has(cur.ex)?`<button class="warn small" onclick="lostBall()">Потерял мяч</button>`:""}
      <button class="ghost small" onclick="measureBack()">Назад</button></div>
    <div class="row"><button class="ghost small" onclick="manualEntry()">Ручной ввод</button></div>
    ${smallActions()}`);
  // Последние секунды отдыха отсчитываются вслух и цифрами на весь экран.
  if(ready10) countdownTo(m.readyAt[cur.player],"rc10");
  // Пока этот работает, второй отдыхает — видно, сколько ему осталось.
  if(m.readyAt[other]>Date.now()) restBadge("rest-other",other,m.readyAt[other]);
  else stopRestBadge();
  S.watch={running:false,t0:0,cur};
}
function variantLabel(cur){
  const V={stance:"стойка",sit_face:"сидя лицом",sit_back:"сидя спиной",lie:"лёжа",
    spin:"спиной",side:"боком",
    "20m":`${DIST.E02["20m"]} м`,"15m":`${DIST.E02["15m"]} м`,
    "25m_fly":`замер ${E02_MEASURE["25m_fly"]} м с ходу`,"30m_fly":`замер ${E02_MEASURE["30m_fly"]} м с ходу`};
  if(cur.variant&&V[cur.variant])return V[cur.variant];
  if(cur.dist)return cur.dist+" м";
  return "";
}
function tapWatch(){
  const w=S.watch;
  if(!w.running){w.running=true;w.t0=performance.now();
    document.getElementById("tap").classList.add("run");
    document.getElementById("hint").textContent="тап = стоп";
    const loop=()=>{const el=document.getElementById("num");if(!el||!w.running)return;
      el.textContent=((performance.now()-w.t0)/1000).toFixed(2);w.raf=requestAnimationFrame(loop);};
    w.raf=requestAnimationFrame(loop);
  } else {
    w.running=false; if(w.raf)cancelAnimationFrame(w.raf);
    recordTime((performance.now()-w.t0)/1000);
  }
}
function notMeasured(){recordTime(null,true);}
function manualEntry(){overlay(`<div class="card"><div class="title">Ручной ввод (2.06 / 2,06 / 206)</div>
  <input type="text" id="mv" inputmode="decimal">
  <div class="row"><button class="go" onclick="applyManual()">Ок</button>
   <button class="ghost" onclick="closeOverlay()">Отмена</button></div></div>`);}
function parseTime(s){s=(s||"").trim().replace(",",".");if(!s)return null;
  let v=parseFloat(s); if(s.indexOf(".")<0&&v>=100)v=v/100; return isNaN(v)?null:v;}
function applyManual(){const v=parseTime(document.getElementById("mv").value);closeOverlay();recordTime(v);}
// Запись слота: обычным ходом создаём новую попытку, при возврате «Назад» —
// переписываем ту же самую.
function writeAttempt(cur,fields){
  const m=S.measure;
  const o=Object.assign({player:cur.player,ex:cur.ex,variant:cur.variant,
    attempt_no:cur.attempt_no},fields);
  const rec=(m.redo&&m.pos===m.redo.slot)?rewriteAttempt(m.redo.uuid,o):pushAttempt(o);
  m.writing=rec?rec.uuid:null;
  return rec;
}
// Запись, соответствующая слоту: тот же игрок, упражнение, вариант и номер.
function attemptOf(slot){
  for(let i=S.attempts.length-1;i>=0;i--){ const a=S.attempts[i];
    if(a.player===slot.player&&a.exercise_id===slot.ex
       &&(a.variant||"")===(slot.variant||"")&&a.attempt_no===slot.attempt_no) return a; }
  return null;
}
/* «Назад» — вернуться к предыдущей записанной попытке и ПЕРЕПИСАТЬ её.
   Новой записи не появляется, номера не сдвигаются; после перезаписи цикл
   возвращается туда, где был. Раньше кнопка удаляла последнюю запись и
   сдвигала позицию — из-за этого сбивалась нумерация. */
function measureBack(){
  const m=S.measure;
  if(m.redo) return measureAdvance();            // уже переписываем
  let k=m.pos-1;
  while(k>=0&&!attemptOf(m.order[k])) k--;
  if(k<0) return measureAdvance();               // переписывать нечего
  const rec=attemptOf(m.order[k]);
  m.redo={slot:k,uuid:rec.uuid,prev:rec.time_sec,returnPos:m.pos};
  m.pos=k; saveSession(); measureAdvance();
}
// После записи попытки: при перезаписи возвращаемся туда, где были.
function advanceAfterAttempt(){
  const m=S.measure;
  if(m.redo){ m.pos=m.redo.returnPos; m.redo=null; recomputeBest(); }
  else m.pos++;
  saveSession(); measureAdvance();
}
// Лучшее в каждой серии заново по записям: перезапись могла его изменить.
function recomputeBest(){
  const m=S.measure; m.best={};
  m.order.slice(0,m.pos).forEach(sl=>{
    const a=attemptOf(sl); if(!a||a.time_sec===null||a.lost)return;
    const k=seriesKey(sl);
    m.best[k]=(m.best[k]===undefined)?a.time_sec:Math.min(m.best[k],a.time_sec);
  });
}

function recordTime(t,nm){
  const m=S.measure, cur=m.order[m.pos];
  writeAttempt(cur,{time_sec:t,dist:cur.dist,note:nm?"не засечено":""});
  // Гол за попытку спрашиваем по флагу слота, а не по типу упражнения:
  // «Отрыв» — свой тип (breakaway), но гол в нём тоже пишется.
  if(cur.goal && t!==null){ return screenGoalAsk(cur,t); }
  finalizeTime(cur,t);
}
// Потеря мяча: если секундомер идёт — фиксируем текущее время, иначе без времени.
// Попытка помечается lost=true и не влияет на лучшее/среднее/стоп-правило.
function lostBall(){
  const w=S.watch, m=S.measure, cur=m.order[m.pos];
  let t=null;
  if(w&&w.running){ w.running=false; if(w.raf)cancelAnimationFrame(w.raf);
    t=(performance.now()-w.t0)/1000; }
  writeAttempt(cur,{time_sec:t,dist:cur.dist,lost:true,note:"потеря мяча"});
  // Ни стоп-правила, ни экрана гола: потеря — это отсутствие завершения.
  m.readyAt[cur.player]=Date.now()+(cur.rest||60)*1000;
  advanceAfterAttempt();
}
function screenGoalAsk(cur,t){
  h(`<h1>Гол?</h1>
    <div class="card center">
      <div style="font-size:24px;font-weight:800">${RU[cur.player]} · ${t.toFixed(2)} · Гол?</div></div>
    <div class="row"><button class="go" onclick="setGoal(true)">⚽ ДА</button>
      <button class="warn" onclick="setGoal(false)">✕ НЕТ</button></div>`);
}
function setGoal(g){
  const m=S.measure, cur=m.order[m.pos];
  const a=S.attempts.find(x=>x.uuid===m.writing)||S.attempts[S.attempts.length-1];
  a.goals=g?1:0; a.shots=1;
  const all=loadAttempts(); const ix=all.findIndex(x=>x.uuid===a.uuid);
  if(ix>=0){all[ix].goals=a.goals;all[ix].shots=a.shots;saveAttempts(all);}
  saveSession();
  finalizeTime(cur, a.time_sec);
}
function finalizeTime(cur,t){
  const m=S.measure, key=seriesKey(cur);
  // Стоп-правило: только там, где задан порог, и не в части 2 «Отрыва»
  // (slot с noStop). Лучшее берётся ВНУТРИ своей серии (игрок+вариант).
  // При перезаписи попытки серию не обрываем: тренер правит замер, а не
  // бежит заново.
  const th=(cur.noStop||m.redo)?null:exOf(cur.ex).stopT;
  const b=(m.best[key]===undefined)?null:m.best[key];
  if(t!==null && th && b!==null && Math.round((t-b)*100)/100>=th)
    return screenStopRule(cur,b,t);
  if(t!==null) m.best[key]=(b===null)?t:Math.min(b,t);
  m.readyAt[cur.player]=Date.now()+ (cur.rest||60)*1000;
  advanceAfterAttempt();
}
function screenStopRule(cur,best,t){
  h(`<h1>Стоп-правило</h1>
    <div class="card center"><div class="name">${RU[cur.player]}</div>
      <div class="title">Серия окончена</div>
      <div class="big">Лучшее: ${best.toFixed(2)}</div>
      <div class="note">Последняя ${t.toFixed(2)} — падение ${(t-best).toFixed(2)}.</div></div>
    <div class="row"><button class="go" onclick="stopSeries()">Завершить</button>
      <button class="ghost" onclick="continueSeries()">Ещё один</button></div>`);
}
// Обрывается только эта серия (игрок+вариант) — другие варианты идут дальше.
function stopSeries(){const m=S.measure,cur=m.order[m.pos];
  m.stopped[seriesKey(cur)]=true;m.pos++;saveSession();measureAdvance();}
function continueSeries(){const m=S.measure,cur=m.order[m.pos],k=seriesKey(cur);
  const a=S.attempts.find(x=>x.uuid===m.writing), t=a?a.time_sec:null;
  if(t!==null) m.best[k]=Math.min(m.best[k]??Infinity,t);
  m.readyAt[cur.player]=Date.now()+(cur.rest||60)*1000; advanceAfterAttempt();}

/* ---- shots: «забил из N» — общий экран счёта (сейчас только E07) ---- */
/* «Разворот» идёт ДВУМЯ подсериями: пять приёмов подряд, пока ты стоишь
   справа за спиной, потом пять слева. Раньше сторона менялась каждую
   попытку — счёт по сторонам не разделялся и слабая сторона тонула
   в общем проценте. Учёт голов отдельно по каждой подсерии. */
const E07_SUBS=[{v:"turn_right",side:"справа",label:"ты справа за спиной"},
                {v:"turn_left", side:"слева", label:"ты слева за спиной"}];
function shotsDist(ex){ return ex==="E07"?{DANIIL:20,ADRIAN:15}:{DANIIL:15,ADRIAN:12}; }
function workShots(st){ // подсерия за подсерией, внутри — оба игрока
  const ex=st.ex;
  S.shots={ex,player:"DANIIL",sub:0,dist:shotsDist(ex),
    word:EX[ex].shotsWord||"ударов", verb:EX[ex].shotsVerb||"попал"};
  if(isSkipped("DANIIL")||blockPlayers(ex).indexOf("DANIIL")<0)
    return shotsSkipPlayer();
  shotsRender();
}
function shotsRender(){
  const s=S.shots, sub=E07_SUBS[s.sub], N=e07Shots(s.player);
  h(`${countHeader(s.player,EX[s.ex].name+" · "+sub.side+lightTag(s.player),N,s.word)}
    <div class="title">Сколько ${s.verb} из ${N}?</div>
    <div class="note">Подсерия ${s.sub+1} из ${E07_SUBS.length}: ${sub.label},
    ${N} ${plural(N,"приём","приёма","приёмов")} подряд с одной стороны.</div>
    <div class="gridN">${Array.from({length:N+1},(_,i)=>`<button onclick="shotsSave(${i})">${i}</button>`).join("")}</div>
    ${smallActions()}`);
}
function shotsSave(g){const s=S.shots, sub=E07_SUBS[s.sub];
  pushAttempt({player:s.player,ex:s.ex,variant:sub.v,attempt_no:s.sub+1,
    goals:g,shots:e07Shots(s.player),dist:s.dist[s.player]});
  return shotsSkipPlayer();
}
// Следующий, кто ещё в упражнении: пропустившего перешагиваем.
function shotsSkipPlayer(){
  const s=S.shots;
  if(s.player==="DANIIL"){s.player="ADRIAN";}
  else { s.player="DANIIL"; s.sub++; }
  if(s.sub>=E07_SUBS.length){ delete S.shots; saveSession(); return nextStep(); }
  if(isSkipped(s.player)||blockPlayers(s.ex).indexOf(s.player)<0)
    return shotsSkipPlayer();
  return shotsRender();
}
/* ---- control: контроль 1-5 + голы из N (E13) ---- */
/* Приём под опекой: сначала сами приёмы с отдыхом, потом ввод результата.
   Отдых между СВОИМИ приёмами — минута. Братья чередуются, поэтому часть
   минуты набегает сама, пока принимает второй: ждём только остаток до
   готовности, лишнего экрана на полную минуту не появляется. */
const E13_REST_SEC=60;
// Отдых между своими подходами в «Ты догоняешь» (dupl. bot/catalog.py).
const E12_REST_SEC=90;
/* Отдых между своими подходами в «Обыгрыше лицом»: 0 → 40 с (18.08).
   Обыгрыш идёт на рывке в упор, шесть подходов подряд без паузы шли на
   падающей свежести. Братья чередуются, поэтому подход второго закрывает
   почти всю паузу — ждём только остаток (dupl. bot/catalog.py). */
const E14_REST_SEC=40;
/* Игроки идут НЕЗАВИСИМО: у каждого своё число приёмов (в облегчённом их
   меньше). Кто закончил — выпадает из очереди, второй доделывает своё;
   упражнение не обрывается раньше времени из-за первого. */
function workControl(st){
  const mine=blockPlayers(st.ex);
  const N={DANIIL:0,ADRIAN:0};
  mine.forEach(pl=>{N[pl]=receptionsFor(S.spec,pl);});
  const order=[];
  for(let i=1;i<=Math.max(N.DANIIL,N.ADRIAN);i++)
    for(const pl of PLAYERS) if(i<=N[pl]) order.push({player:pl,no:i,N:N[pl]});
  S.ctrl={ex:st.ex,player:"DANIIL",N:Math.max(N.DANIIL,N.ADRIAN),byPlayer:N,
          stage:"reps",pos:0,order,readyAt:{DANIIL:0,ADRIAN:0}};
  ctrlAdvance();
}
function ctrlAdvance(){
  const c=S.ctrl;
  while(c.pos<c.order.length&&isSkipped(c.order[c.pos].player))c.pos++;
  if(c.pos>=c.order.length){        // всё записано по ходу — ввода не нужно
    delete S.ctrl; saveSession(); return nextStep();
  }
  const cur=c.order[c.pos];
  return (c.readyAt[cur.player]-Date.now()>0)?ctrlRest(cur):ctrlRep(cur);
}
/* Учёт по КАЖДОМУ приёму, тремя кнопками. Контроль тренер не вводит:
   он считается из доли удержанных мячей (dupl. bot/rules.control_from_losses). */
function ctrlRep(cur){
  const c=S.ctrl, other=cur.player==="DANIIL"?"ADRIAN":"DANIIL";
  const done=c.order.slice(0,c.pos).filter(o=>o.player===cur.player).length;
  h(`${countHeader(cur.player,"Приём под опекой"+lightTag(cur.player),cur.N,"приёмов",done)}
    <div class="title">${RU[cur.player]} · приём ${cur.no} из ${cur.N}</div>
    <div class="note">Вариант объявляешь вслух до паса. Между своими приёмами
    ${E13_REST_SEC} секунд отдыха — приложение следит.</div>
    <div class="row"><button class="go" onclick="ctrlRepDone('goal')">⚽ ГОЛ</button></div>
    <div class="row"><button onclick="ctrlRepDone('hold')">✓ УДЕРЖАЛ</button>
      <button class="warn" onclick="ctrlRepDone('lost')">✕ ПОТЕРЯЛ</button></div>
    <div class="note">ГОЛ — удержал и забил · УДЕРЖАЛ — удержал, не забил ·
    ПОТЕРЯЛ — потерял мяч под давлением.</div>
    ${otherRestHtml()}
    ${smallActions()}`);
  if(c.readyAt[other]>Date.now()) restBadge("rest-other",other,c.readyAt[other]);
  else stopRestBadge();
}
function ctrlRepDone(kind){
  const c=S.ctrl, cur=c.order[c.pos];
  pushAttempt({player:cur.player,ex:c.ex,attempt_no:cur.no,shots:1,
    goals:kind==="goal"?1:0,lost:kind==="lost",
    note:kind==="lost"?"потеря мяча":""});
  c.readyAt[cur.player]=Date.now()+E13_REST_SEC*1000;
  c.pos++; saveSession(); ctrlAdvance();
}
function ctrlRest(cur){
  const c=S.ctrl, target=c.readyAt[cur.player];
  h(`<h1>Отдых</h1>
    <div class="card center"><div class="sub">следующий</div>
      <div class="name">${RU[cur.player]}</div>
      <div class="note">приём ${cur.no} из ${cur.N} · готов в ${hhmmss(new Date(target))}</div>
      <div class="big" id="rc"></div></div>
    <div class="row"><button class="ghost" onclick="ctrlSkipRest()">Пропустить отдых</button></div>
    ${smallActions()}`);
  countdownTo(target,"rc",()=>ctrlAdvance());
}
function ctrlSkipRest(){ stopCountdown();
  const c=S.ctrl; c.readyAt[c.order[c.pos].player]=Date.now(); ctrlAdvance(); }
/* ---- Удары (E10): 4 серии по подсериям, 45 ударов на игрока ---- */
const E10_SERIES_NAME={1:"Удары с места",2:"Удары после приёма",3:"Удары с фланга",4:"Рывок на пас"};
function e10subs(series){return E10_SUB.filter(s=>s.series===series);}
function e10Total(){return E10_SUB.reduce((a,s)=>a+s.shots,0);}
// Дистанция удара конкретной подсерии — чтобы тексты не собирали её строкой.
function e10dist(series,kind,player){
  const sub=e10subs(series).find(s=>s.kind===kind)||e10subs(series)[0];
  return sub.dist[player];
}
function e10SeriesShots(series){return e10subs(series).reduce((a,s)=>a+s.shots,0);}
function workFour(st){ S.four={series:1,player:"DANIIL",queue:null,pos:0}; fourEnter(); }
// Серия 4 (рывок на пас) в облегчённом режиме убрана: это беговая работа,
// а не удары. Серии 1-3 остаются, в подсерии три удара вместо пяти.
function fourHasWork(series,player){
  return !isSkipped(player)&&blockPlayers("E10").indexOf(player)>=0
    &&!(series===4&&isLight(player)); }
// Вход в (серия, игрок): экран выбора первой подсерии.
function fourEnter(){
  const f=S.four, subs=e10subs(f.series);
  if(!fourHasWork(f.series,f.player)) return fourNextPlayer();
  h(`<h1>${E10_SERIES_NAME[f.series]} · ${RU[f.player]}${lightTag(f.player)}</h1>
    <div class="reps">Серия ${f.series}/4. Выбери подсерию — дальше приложение ведёт само.</div>
    <div class="row">${subs.map(s=>`<button class="go" onclick="fourPick('${s.v}')">${s.kind} ${s.dist[f.player]} м</button>`).join("")}</div>
    ${smallActions()}`);
}
// Игрок закончил серию: дальше второй, потом следующая серия. Серию, где
// работы нет ни у кого (четвёртая при двух облегчённых), пропускаем молча.
function fourNextPlayer(){
  const f=S.four;
  if(f.player==="DANIIL"){f.player="ADRIAN";f.queue=null;f.pos=0;return fourEnter();}
  while(f.series<4){
    f.series++; f.player="DANIIL"; f.queue=null; f.pos=0;
    if(PLAYERS.some(pl=>fourHasWork(f.series,pl))) return fourSeriesBreak();
  }
  delete S.four; saveSession(); return nextStep();
}
function fourPick(v){
  const f=S.four, subs=e10subs(f.series).map(s=>s.v);
  f.queue=[v,...subs.filter(x=>x!==v)]; f.pos=0; fourRunSub();
}
function fourRunSub(){
  const f=S.four;
  if(f.pos>=f.queue.length) return fourNextPlayer();   // игрок закончил серию
  const sub=E10_SUB.find(s=>s.v===f.queue[f.pos]);
  if(sub.timed){ f.rush={sub,shot:1}; fourRushWatch(); }
  else fourAggShot(sub);
}
function fourSeriesBreak(){
  h(`<h1>Смена постановки</h1>
    <div class="card center"><div class="title">Серия ${S.four.series}/4</div>
      <div style="font-size:20px;margin-top:8px">${E10_SERIES_NAME[S.four.series]}. Переставь фишки.</div></div>
    <div class="row"><button class="go" onclick="fourEnter()">Готово</button></div>`);
}
// Подсерия без замера (серии 1-3): экран удара → учёт голов из 5.
function fourAggShot(sub){
  const f=S.four, d=sub.dist[f.player], n=e10SubShots(sub,f.player);
  h(`${countHeader(f.player,E10_SERIES_NAME[f.series]+lightTag(f.player),n,"ударов")}
    <div class="title">${sub.kind} · ${d} м</div>
    <div class="note">${n} ударов подряд, затем введи, сколько забил.</div>
    <div class="row"><button class="go" onclick="fourAggGoals('${sub.v}')">Ввести голы</button></div>
    ${smallActions()}`);
}
function fourAggGoals(v){
  const f=S.four, sub=E10_SUB.find(s=>s.v===v), d=sub.dist[f.player];
  const n=e10SubShots(sub,f.player);
  h(`${countHeader(f.player,E10_SERIES_NAME[f.series]+" · "+sub.kind+" "+d+" м",n,"ударов")}
    <div class="title">Сколько забил из ${n}?</div>
    <div class="gridN">${Array.from({length:n+1},(_,i)=>`<button onclick="fourAggSave('${v}',${i})">${i}</button>`).join("")}</div>
    ${smallActions()}`);
}
function fourAggSave(v,goals){
  const f=S.four, sub=E10_SUB.find(s=>s.v===v);
  pushAttempt({player:f.player,ex:"E10",variant:v,attempt_no:f.pos+1,
    goals,shots:e10SubShots(sub,f.player),dist:sub.dist[f.player]});
  f.pos++; fourRunSub();
}
// Серия 4: 5 рывков, каждый с секундомером, гол и отдыхом 25 сек.
function fourRushWatch(){
  const f=S.four, sub=f.rush.sub, d=sub.dist[f.player];
  h(`${countHeader(f.player,"Рывок · "+sub.kind,sub.shots,"рывков")}
    <div class="note">Удар ${f.rush.shot} из ${sub.shots} · старт с ${E10_RUSH_START[f.player]} м · удар с ${d} м · угол называешь в момент паса</div>
    <div class="tap" id="tap" onclick="fourRushTap()">
      <div class="num" id="num">0.00</div><div class="note" id="hint">тап = старт (пас)</div></div>
    ${smallActions()}`);
  S.watch={running:false,t0:0};
}
function fourRushTap(){
  const w=S.watch;
  if(!w.running){w.running=true;w.t0=performance.now();
    document.getElementById("tap").classList.add("run");
    document.getElementById("hint").textContent="тап = стоп (удар)";
    const loop=()=>{const el=document.getElementById("num");if(!el||!w.running)return;
      el.textContent=((performance.now()-w.t0)/1000).toFixed(2);w.raf=requestAnimationFrame(loop);};
    w.raf=requestAnimationFrame(loop);
  } else { w.running=false; if(w.raf)cancelAnimationFrame(w.raf);
    S.four.rush.t=(performance.now()-w.t0)/1000; fourRushGoal(); }
}
function fourRushGoal(){
  const f=S.four;
  h(`<h1>Гол в названный угол?</h1>
    <div class="card center"><div class="name">${RU[f.player]}</div>
      <div class="big">${f.rush.t.toFixed(2)}</div></div>
    <div class="row"><button class="go" onclick="fourRushSave(true)">⚽ ДА</button>
      <button class="warn" onclick="fourRushSave(false)">✕ НЕТ</button></div>`);
}
function fourRushSave(g){
  const f=S.four, sub=f.rush.sub;
  pushAttempt({player:f.player,ex:"E10",variant:sub.v,attempt_no:f.rush.shot,
    time_sec:f.rush.t,goals:g?1:0,shots:1,dist:sub.dist[f.player]});
  if(f.rush.shot<sub.shots){ f.rush.shot++; return fourRest(); }
  f.pos++; fourRunSub();
}
function fourRest(){
  const target=Date.now()+E10_RUSH_REST*1000;
  h(`<h1>Отдых ${E10_RUSH_REST} сек</h1>
    <div class="card center"><div class="sub">до</div><div class="big">${hhmmss(new Date(target))}</div>
      <div class="big" id="rc"></div></div>
    <div class="note">Обязательный отдых между рывками.</div>
    <div class="row"><button class="go" onclick="stopCountdown();fourRushWatch()">Готово, на старт</button></div>
    ${smallActions()}`);
  countdownTo(target,"rc",()=>{});
}

/* ---- Итог занятия: формат тот же, что у бота и в md-журнале ----
   Время и голы — РАЗНЫЕ строки; процент после каждого «N из M»;
   лучшее и среднее в два знака, затем рекорд за всё время; побит рекорд —
   отдельной строкой с пустыми строками вокруг; попытки с потерей мяча
   не входят в лучшее/среднее. */
const SEG_LABELS={E02:{"20m":`${DIST.E02["20m"]} м`,"15m":`${DIST.E02["15m"]} м`,
  "25m_fly":`${E02_MEASURE["25m_fly"]} м с ходу`,"30m_fly":`${E02_MEASURE["30m_fly"]} м с ходу`},
  // Режим 2: у «Летящих» и «Стартов» в один день оба отрезка — свои подписи.
  E17:{"":"Прыжки и старт, 10 м"},
  E18:{"":"Летящие ускорения, замер с ходу"},
  E24:{turn_right:"через правое плечо",turn_left:"через левое плечо"}};
const TIME_QUALITY={E01:"Скорость",E02:"Скорость",E06:"Смена направления",
  E17:"Скорость",E18:"Скорость",E24:"Смена направления"};
const E10_SERIES=[["С места",[["s1_near","ближняя"],["s1_far","дальняя"]]],
  ["После приёма",[["s2_near","ближняя"],["s2_far","дальняя"]]],
  ["С фланга",[["s3_right","справа"],["s3_left","слева"]]],
  ["Рывок на пас",[["s4_left","слева"],["s4_center","центр"],["s4_right","справа"]]]];
function exOf(ex){ return EX[ex]||EX[ex.replace(/_[DA]$/,"")]||null; }
/* Поля описаний могут быть функциями дня: число повторов зависит от дня,
   поэтому текст считает его, а не помнит. */
function txt(v,spec){ return (typeof v==="function")?v(spec||(S&&S.spec)):(v||""); }
function stepsOf(e,spec){ return txt(e.steps,spec); }
function pctTxt(g,s){ return s?`${g} из ${s} (${Math.round(100*g/s)}%)`:"—"; }
// Время идёт в расчёт, если попытка не потеряна и замер не сбит: «сбой
// замера» означает, что секунды есть, но они не про то (dupl. bot/rules.py).
function scoringTimes(list){ return list.filter(a=>a.time_sec!==null&&!a.lost
  &&String(a.note||"").indexOf(BROKEN_NOTE)<0).map(a=>a.time_sec); }
/* Строка времени: лучшее, среднее и РЕКОРД за всё время (разброса нет —
   на поле по нему решений не принимают). Рекорд берётся из слепка
   «Импорт рекордов»; слепка нет — про рекорд молчим, бот всё равно
   покажет: у него полная история. */
const NEW_RECORD="🏆 НОВЫЙ РЕКОРД!";
/* Истории ДО этого занятия нет — сравнивать не с чем: рекорд считается строго
   по прошлым занятиям. Прежнее «рекорд не установлен» было верно по смыслу,
   но тренеру бесполезно — пишем прямо, что этот результат и есть рекорд
   для следующего раза (dupl. bot/insights.FIRST_MEASURE). */
const FIRST_MEASURE=" — первый замер, это рекорд";
function statsTxt(list,cap,record){
  const t=scoringTimes(list); if(!t.length)return null;
  const best=Math.min(...t), avg=t.reduce((x,y)=>x+y,0)/t.length;
  const parts=[`${cap?"Лучшее":"лучшее"} ${best.toFixed(2)}`,`среднее ${avg.toFixed(2)}`];
  // Истории нет — так и пишем, строку не прячем.
  return parts.join(", ")+((record===undefined||record===null)?FIRST_MEASURE
                                             :`, рекорд ${record.toFixed(2)}`);
}
// Строка нового рекорда — с пустой строкой сверху и снизу.
function recordLines(list,record){
  const t=scoringTimes(list);
  if(!t.length||record===undefined||record===null)return [];
  const best=Math.min(...t);
  if(best>=record)return [];
  return ["",`${NEW_RECORD} Прежний ${record.toFixed(2)}, улучшение ${(record-best).toFixed(2)}`,""];
}
function pctTail(record){return (record===null||record===undefined)
  ?FIRST_MEASURE:`, рекорд ${Math.round(record)}%`;}
function pctRecordLines(g,s,record){
  if(!s||record===null||record===undefined)return [];
  const pct=Math.round(100*g/s), prev=Math.round(record);
  if(pct<=prev)return [];
  return ["",`${NEW_RECORD} Прежний ${prev}%, улучшение ${nOf(pct-prev,"пункт","пункта","пунктов")}`,""];
}
// Упражнения, где потеря мяча — результат попытки, а не брак замера:
// в единоборствах не ушёл и не обыграл — это неудачная попытка, она входит
// в знаменатель, иначе «4 из 5» превратилось бы в «4 из 4» (dupl. bot/rules.py).
const LOST_IS_RESULT=new Set(["E13","E12","E14"]);
// Контроль мяча считается по потерям только там, где он вообще выводится.
const CONTROL_FROM_LOSSES=new Set(["E13"]);
// Как называется неудачная попытка в строке итога (dupl. bot/insights.py).
const LOST_LABEL={E12:"Не ушёл",E14:"Не обыграл"};
function lostLabel(ex){ return LOST_LABEL[ex]||"Потерь мяча"; }
/* Разбивка «Разворота» по сторонам — ради неё подсерии и разделены:
   в общем проценте слабая сторона не видна (dupl. bot/insights.py). */
function sidesLine(ex,list,player){
  if(ex!=="E07")return [];
  const parts=E07_SUBS.map(sub=>{
    const t=goalsOf(list.filter(a=>(a.variant||"")===sub.v));
    if(!t.s)return null;
    return `${sub.side} ${pctTxt(t.g,t.s)}${pctTail(ratioRecord(player,ex,S.spec.iso,sub.v))}`;
  }).filter(Boolean);
  return parts.length>1?[parts.join(", ")]:[];
}
// Контроль мяча: записанная оценка (старые записи) или расчёт по потерям.
function controlOf(ex,list){
  const c=list.filter(a=>a.control!==null&&a.control!==undefined).map(a=>a.control);
  if(c.length) return +(c.reduce((x,y)=>x+y,0)/c.length).toFixed(1);
  if(!CONTROL_FROM_LOSSES.has(ex)||!list.length) return null;
  const lost=list.filter(a=>a.lost).length;
  return Math.round(1+4*(list.length-lost)/list.length);
}
function goalsOf(list){ const l=list.filter(a=>(!a.lost||LOST_IS_RESULT.has(a.exercise_id))&&a.shots);
  return {g:l.reduce((s,a)=>s+(a.goals||0),0), s:l.reduce((s,a)=>s+(a.shots||0),0)}; }
function segLabel(ex,a){ const m=SEG_LABELS[ex];
  if(m&&m[a.variant])return m[a.variant];
  if(TIME_QUALITY[ex]==="Скорость"&&a.distance_m)return Math.round(a.distance_m)+" м";
  return (exOf(ex)||{name:ex}).name; }
function pureTimeLines(ex,list,player){
  const groups=[], seen={};
  list.forEach(a=>{const l=segLabel(ex,a);
    if(seen[l]===undefined){seen[l]=groups.length;groups.push([l,[]]);}
    groups[seen[l]][1].push(a);});
  const out=[];
  groups.forEach(([l,g])=>{
    const rec=timeRecord(player,ex,g[0].variant,S.spec.iso);
    const s=statsTxt(g,false,rec);
    if(!s)return;
    out.push(`${l}: ${s}`);
    recordLines(g,rec).forEach(x=>out.push(x));
  });
  return out;
}
function timeGoalChunk(e,list,player){
  const rec=timeRecord(player,list[0].exercise_id,list[0].variant,S.spec.iso);
  const pctRec=ratioRecord(player,list[0].exercise_id,S.spec.iso);
  const lines=[], s=statsTxt(list,true,rec), t=goalsOf(list);
  if(s){ lines.push(s); recordLines(list,rec).forEach(x=>lines.push(x)); }
  // «Повторные рывки»: главное здесь не лучшее время, а падение от первого
  // рывка к последнему — приложение считает его само (dupl. bot/insights.py).
  if(e.fade)fadeLines(list).forEach(x=>lines.push(x));
  if(t.s){ lines.push(`Голы: ${pctTxt(t.g,t.s)}${pctTail(pctRec)}`);
    pctRecordLines(t.g,t.s,pctRec).forEach(x=>lines.push(x)); }
  const lost=list.filter(a=>a.lost).length;
  if(lost>0)lines.push(`Потерь мяча: ${lost}`);
  return {h:e.name,lines};
}
/* Интервальные упражнения: мерится ДИСТАНЦИЯ за отрезок. Показатель —
   падение первого интервала к последнему; рекорд — лучшее СРЕДНЕЕ
   за занятие, больше лучше (dupl. bot/insights._interval_chunk). */
function intervalDists(list){
  return list.slice().sort((a,b)=>a.attempt_no-b.attempt_no)
    .filter(a=>a.distance_m!==null&&a.distance_m!==undefined)
    .map(a=>a.distance_m);
}
function intervalFade(dists){
  if(dists.length<2)return null;
  const drop=dists[0]-dists[dists.length-1];
  // Округление ВНИЗ: 12.5% показываем как 12 — падение не приукрашиваем
  // в большую сторону (dupl. bot/insights.interval_fade).
  const pct=dists[0]?Math.floor(100*drop/dists[0]):0;
  const key=pct<=INTERVAL_FADE_GOOD?"hold":pct<=INTERVAL_FADE_BAD?"edge":"fade";
  return {drop:Math.round(drop*10)/10,pct,key};
}
// Рекорд дистанции — лучшее среднее за занятие из локальной истории.
function distRecord(player,ex,day){
  const byDay={};
  historyBefore(player,ex,day).forEach(a=>{
    if(a.distance_m===null||a.distance_m===undefined||a.is_warmup)return;
    const d=byDay[a.date]=byDay[a.date]||{sum:0,n:0};
    d.sum+=a.distance_m; d.n++;});
  const avgs=Object.values(byDay).filter(d=>d.n).map(d=>d.sum/d.n);
  const snap=snapRecord(distRecords()[player],ex,undefined,modeOf(player));
  if(snap!==undefined&&snap!==null)avgs.push(snap);
  return avgs.length?Math.max(...avgs):null;
}
function mTxt(v){ return (v===null||v===undefined)?"—":`${Math.round(v)} м`; }
function intervalChunk(e,list,player){
  const lines=[], dists=intervalDists(list);
  if(dists.length){
    const avg=dists.reduce((a,b)=>a+b,0)/dists.length;
    const rec=distRecord(player,list[0].exercise_id,S.spec.iso);
    lines.push(`Первый ${mTxt(dists[0])}, последний ${mTxt(dists[dists.length-1])}, `
      +`среднее ${mTxt(avg)}`+(rec===null?FIRST_MEASURE:`, рекорд ${mTxt(rec)}`));
    if(rec!==null&&Math.round(avg)>Math.round(rec))
      lines.push("",`${NEW_RECORD} Прежнее среднее ${mTxt(rec)}, прибавка ${Math.round(avg)-Math.round(rec)} м`,"");
    const f=intervalFade(dists);
    if(f)lines.push(`Падение ${f.pct}% — ${INTERVAL_FADE_VERDICTS[f.key]}`);
  }
  const t=goalsOf(list);
  if(t.s){ const pctRec=ratioRecord(player,list[0].exercise_id,S.spec.iso);
    lines.push(`Голы на финише серий: ${pctTxt(t.g,t.s)}${pctTail(pctRec)}`);
    pctRecordLines(t.g,t.s,pctRec).forEach(x=>lines.push(x)); }
  return lines.length?{h:e.name,lines}:null;
}
// Падение времени в серии: первый рывок против последнего, с трактовкой.
function fadeOf(list){
  const t=list.slice().sort((a,b)=>a.attempt_no-b.attempt_no)
    .filter(a=>a.time_sec!==null&&!a.lost).map(a=>a.time_sec);
  if(t.length<2)return null;
  return Math.round((t[t.length-1]-t[0])*100)/100;
}
function fadeLines(list){
  const d=fadeOf(list);
  if(d===null)return [];
  const v=d<E19_FADE_GOOD?E19_FADE_VERDICTS.hold
    :d<=E19_FADE_BAD?E19_FADE_VERDICTS.edge:E19_FADE_VERDICTS.fade;
  return [`  падение 1-${list.length}: ${d.toFixed(2)} — ${v}`];
}
// Чистые удары по воротам: только они идут в «Всего ударов». Единоборства
// тоже кончаются ударом, но упражнение там про обыгрыш и отбор — их процент
// считается своим блоком (dupl. bot/insights.py SHOT_EXERCISES).
const SHOT_EXERCISES=["E10","E10S","E07","E15","E19","E27"];
function shotsTotal(byEx){
  let g=0,s=0;
  SHOT_EXERCISES.forEach(ex=>{ const t=goalsOf(byEx[ex]||[]); g+=t.g; s+=t.s; });
  return {g,s};
}
function shotsChunk(list,total,player){
  const by={}; list.filter(a=>!a.lost).forEach(a=>{const v=a.variant||"";
    by[v]=by[v]||{g:0,s:0,t:[]}; by[v].g+=a.goals||0; by[v].s+=a.shots||0;
    if(a.time_sec!==null)by[v].t.push(a.time_sec);});
  const lines=[];
  E10_SERIES.forEach(([title,subs])=>{
    const parts=subs.filter(([v])=>by[v]).map(([v,cap])=>
      `${cap} ${pctTxt(by[v].g,by[v].s)}${pctTail(ratioRecord(player,"E10",S.spec.iso,v))}`);
    if(!parts.length)return;
    lines.push(`${title}: ${parts.join(", ")}`);
    const t=[].concat(...subs.map(([v])=>(by[v]||{t:[]}).t));
    if(t.length){
      const tr=subs.map(([v])=>timeRecord(player,"E10",v,S.spec.iso)).filter(x=>x!==null);
      const recTxt=tr.length?`, рекорд ${Math.min(...tr).toFixed(2)}`:FIRST_MEASURE;
      lines.push(" ".repeat(title.length+2)+
        `лучшее ${Math.min(...t).toFixed(2)}, среднее ${(t.reduce((x,y)=>x+y,0)/t.length).toFixed(2)}${recTxt}`);
    }
  });
  const rec=ratioRecord(player,"E10",S.spec.iso);
  lines.push(`Всего ударов: ${pctTxt(total.g,total.s)}${pctTail(rec)}`);
  pctRecordLines(total.g,total.s,rec).forEach(x=>lines.push(x));
  return {h:"Удары",lines};
}
/* «Отрыв» в итоге занятия: три забега подряд, дельта 1-3 и голы.
   Деления на части нет с 19.08, отдельного блока ударов Адриана с места
   тоже: он бежит наравне (dupl. bot/insights._breakaway_chunks). */
function breakawayChunks(list,player){
  const lines=[];
  const rec=timeRecord(player,"E15","",S.spec.iso), pctRec=ratioRecord(player,"E15",S.spec.iso);
  const tt=list.slice().sort((a,b)=>a.attempt_no-b.attempt_no)
    .filter(a=>a.time_sec!==null&&!a.lost).map(a=>a.time_sec);
  if(tt.length){
    lines.push(tt.map(x=>x.toFixed(2)).join(" → ")+
      (rec===null?FIRST_MEASURE:`, рекорд ${rec.toFixed(2)}`));
    recordLines(list,rec).forEach(x=>lines.push(x));
  }
  if(tt.length>=2){ const d=Math.round((tt[tt.length-1]-tt[0])*100)/100;
    // По старому отрезку дельту не трактуем — ставим пометку.
    const v=oldBreakawayTiming()?E15_OLD_TIMING
      :d<0.3?"способен повторить отрыв":d<=0.6?"на границе"
      :"не способен, ноги не восстанавливаются между всплесками";
    lines.push(`  дельта 1-3: ${d.toFixed(2)} — ${v}`); }
  const t=goalsOf(list);
  if(t.s){ lines.push(`Голы: ${pctTxt(t.g,t.s)}${pctTail(pctRec)}`);
    pctRecordLines(t.g,t.s,pctRec).forEach(x=>lines.push(x)); }
  const lost=list.filter(a=>a.lost).length;
  if(lost>0)lines.push(`Потерь мяча: ${lost}`);
  return lines.length?[{h:"Отрыв",lines}]:[];
}
function summaryChunks(pl){
  const att=S.attempts.filter(a=>a.player===pl), byEx={};
  att.forEach(a=>{(byEx[a.exercise_id]=byEx[a.exercise_id]||[]).push(a);});
  // Порядок вывода — порядок блоков ЕГО режима.
  const order=[]; (planFor(modeOf(pl)).blocks||[]).forEach(b=>{
    if(byEx[b[0]]&&order.indexOf(b[0])<0)order.push(b[0]);});
  Object.keys(byEx).forEach(k=>{if(order.indexOf(k)<0)order.push(k);});
  const chunks=[]; let scores=[], q="";
  const flush=()=>{ if(scores.length){chunks.push({lines:scores});scores=[];} };
  for(const ex of order){
    const e=exOf(ex); if(!e)continue;                    // E00, NOTE — не показываем
    const list=byEx[ex];
    if(ex==="E10"){ flush(); q=""; chunks.push(shotsChunk(list,shotsTotal(byEx),pl)); continue; }
    if(ex==="E15"){ flush(); q=""; breakawayChunks(list,pl).forEach(c=>chunks.push(c)); continue; }
    if(INTERVAL_MARKS[ex]){ flush(); q="";
      const c=intervalChunk(e,list,pl); if(c)chunks.push(c); continue; }
    const hasTime=scoringTimes(list).length>0;
    const hasGoals=list.some(a=>a.goals!==null&&a.goals!==undefined&&a.shots);
    if(hasTime&&hasGoals){ flush(); q=""; chunks.push(timeGoalChunk(e,list,pl)); continue; }
    if(hasTime){ flush();
      const lines=pureTimeLines(ex,list,pl); if(!lines.length)continue;
      const qq=TIME_QUALITY[ex]||e.name;
      if(qq===q&&chunks.length) chunks[chunks.length-1].lines.push(...lines);
      else { q=qq; chunks.push({h:qq,lines}); }
      continue; }
    if(hasGoals){ q=""; const t=goalsOf(list), pctRec=ratioRecord(pl,ex,S.spec.iso);
      let line=`${e.name}: ${pctTxt(t.g,t.s)}`;
      const c=controlOf(ex,list);
      if(c!==null)line+=`, контроль ${c}`;
      line+=pctTail(pctRec);
      scores.push(line);
      sidesLine(ex,list,pl).forEach(x=>scores.push(x));
      pctRecordLines(t.g,t.s,pctRec).forEach(x=>scores.push(x));
      const lost=list.filter(a=>a.lost).length;
      if(lost>0)scores.push(`${lostLabel(ex)}: ${lost}`); }
  }
  flush();
  return chunks;
}
function summaryCard(pl){
  // Режим программы — в заголовке карточки: цифры двух режимов не смешиваются.
  const mode=modeOf(pl);
  const tags=(mode===MODE_SPEED?`<div class="badge">Режим 2</div>`:"")
    +(isLight(pl)?`<div class="badge">Облегчённая нагрузка</div>`:"");
  const body=summaryChunks(pl).map(c=>
    `<div style="margin:8px 0">${c.h?`<div class="title" style="font-size:18px">${c.h}</div>`:""}
     ${c.lines.map(l=>`<div style="white-space:pre-wrap">${l}</div>`).join("")}</div>`).join("");
  return `<div class="card"><div class="name">${RU[pl]}${mode===MODE_SPEED?" · режим 2":""}</div>${tags}
    ${body||'<div class="note">Замеров нет.</div>'}</div>`;
}

/* Выгрузка — только записи. Блока context (клубные дни и матчи) больше нет:
   он существовал ради выбора типа занятия Фазы 2, а Фазы 2 нет. */
function buildPayload(){
  const pending=loadAttempts().filter(a=>!a.uploaded);
  return {records:pending.map(a=>{const{uploaded,...r}=a;return r;})};
}
// Пометить всё выгруженным (после подтверждения приёма ботом) и снять флаг.
function markUploaded(){ const all=loadAttempts();
  all.forEach(a=>{if(!a.uploaded)a.uploaded=true;}); saveAttempts(all);
  localStorage.removeItem("trening_copied"); }

}

}
// Показать текст с автовыделением — последний резерв, если копирование недоступно.
function screenCopyManual(text){
  h(`<h1>Скопируй вручную</h1>
    <div class="note">Выдели весь текст и скопируй, затем вставь боту в чат.</div>
    <textarea id="cptext" readonly style="min-height:180px"></textarea>
    <div class="row"><button class="go" onclick="screenHome()">Готово</button></div>`);
  const ta=document.getElementById("cptext"); if(ta){ta.value=text; ta.focus(); ta.select();}
}
function copyText(text,onOk,onFail){
  // 1) современный API
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(onOk,()=>legacyCopy(text,onOk,onFail));
  } else { legacyCopy(text,onOk,onFail); }
}
function legacyCopy(text,onOk,onFail){
  // 2) скрытый textarea + execCommand
  try{
    const ta=document.createElement("textarea");
    ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.focus(); ta.select();
    const ok=document.execCommand("copy"); ta.remove();
    if(ok) onOk(); else onFail();
  }catch(e){ onFail(); }
}
function uploadAll(){
  const pending=loadAttempts().filter(a=>!a.uploaded);
  if(!pending.length){toast("Нет несинхронизированных записей.");return;}
  const body=JSON.stringify(buildPayload());
  // Тихий резерв: sendData, если он есть и payload помещается в лимит Telegram.
  if(tg&&tg.sendData&&body.length<3800){
    try{ tg.sendData(body); markUploaded(); screenSent(pending.length); return; }catch(_){}
  }
  // Основной путь: копируем весь JSON в буфер. Выгруженным НЕ помечаем —
  // только после подтверждения кнопкой «Отметить выгруженным».
  localStorage.setItem("trening_copied","1");
  copyText(body, screenCopied, ()=>screenCopyManual(body));
}

function screenImport(){
  h(`<h1>Импорт рекордов</h1>
    <div class="note">Вставьте слепок из ответа бота (по игроку). Он показывается на поле в строке «Пред. · рекорд».</div>
    <textarea id="imp" placeholder='{"player":"DANIIL","records":{...}}'></textarea>
    <div class="row"><button class="go" onclick="applyImport()">Сохранить</button>
      <button class="ghost" onclick="screenHome()">Назад</button></div>`);
}
// Вытащить JSON из вставленного текста: всё между первой { и последней }.
// Обёртка ```, строка «Рекорды …» и прочий текст вокруг игнорируются.
function extractJsonBlock(text){
  if(!text) return null;
  const i=text.indexOf("{"), j=text.lastIndexOf("}");
  if(i<0||j<0||j<i) return null;
  return text.slice(i,j+1);
}
function applyImport(){
  try{ const block=extractJsonBlock(document.getElementById("imp").value);
    const o=JSON.parse(block);
    if(!o.player||!o.records)throw 0;
    const r=records(); r[o.player]=o.records;
    localStorage.setItem("trening_records",JSON.stringify(r));
    // Рекорды по проценту попадания приходят тем же слепком (могут и не прийти).
    const p=pctRecords(); p[o.player]=o.pct||{};
    localStorage.setItem("trening_pct",JSON.stringify(p));
    // И рекорды дистанции интервальных упражнений — среднее за занятие.
    const dr=distRecords(); dr[o.player]=o.dist||{};
    localStorage.setItem("trening_dist",JSON.stringify(dr));
    toast("Рекорды "+o.player+" сохранены.");
  }catch(e){toast("Не удалось прочитать слепок.");}
}
function screenLast(){
  const a=loadAttempts(), dates=[...new Set(a.map(x=>x.date))].sort(), last=dates[dates.length-1];
  if(!last){h(`<h1>Последнее занятие</h1><div class="note">Данных нет.</div>
    <div class="row"><button class="go" onclick="screenHome()">Назад</button></div>`);return;}
  const cards=PLAYERS.map(pl=>{
    const list=a.filter(x=>x.date===last&&x.player===pl&&x.time_sec!==null&&!x.lost);
    const byEx={};list.forEach(x=>{(byEx[x.exercise_id]=byEx[x.exercise_id]||[]).push(x.time_sec);});
    const rows=Object.keys(byEx).map(ex=>{const nm=(EX[ex]||{name:ex}).name;
      return `<div>${nm}: ${Math.min(...byEx[ex]).toFixed(2)}</div>`;}).join("");
    return `<div class="card"><div class="name">${RU[pl]}</div>${rows||'<div class="note">—</div>'}</div>`;
  }).join("");
  h(`<h1>Последнее занятие · ${last}</h1>${cards}
    <div class="row"><button class="go" onclick="screenHome()">Назад</button></div>`);
}

  } else screenHome();
}
function resume(){closeOverlay();S=JSON.parse(localStorage.getItem("trening_session"));
  if(S&&S.steps){S.startMs=performance.now();startSessionClock();resumeStep();}else screenHome();}
/* Возврат в занятие: если упражнение уже шло, продолжаем с той же попытки.
   runStep() запустил бы его заново — тренер переделывал бы серию, а записи
   задвоились бы. */
function resumeStep(){
  const st=S.steps&&S.steps[S.stepIndex];
  if(st&&st.kind==="work"){
    if(S.measure&&S.measure.ex===st.ex&&S.measure.pos<S.measure.order.length)
      return measureAdvance();
    if(S.ctrl&&S.ctrl.ex===st.ex) return ctrlAdvance();
    if(S.duelrun&&S.duelrun.ex===st.ex) return duelRunAdvance();
    if(S.shots&&S.shots.ex===st.ex) return shotsRender();
    if(S.four&&st.ex==="E10") return fourEnter();
  }
  runStep();
}
function dropSession(){closeOverlay();clearSession();screenHome();}

if('serviceWorker' in navigator){
  // Адрес регистрации версионный (./sw.js?v=BUILD): при деплое меняется сам
  // URL скрипта, поэтому браузер обязан сходить за ним на сервер, даже если
  // старый sw.js ещё лежит у него в HTTP-кэше. updateViaCache:'none' — то же
  // самое для последующих проверок обновления.
  const hadController=!!navigator.serviceWorker.controller;
  let reloadedForUpdate=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    // Управление перехватила новая сборка. Перезагружаем страницу, иначе на
    // экране осталась бы старая оболочка. НИКОГДА посреди занятия: там идёт
    // секундомер — незаконченное занятие обновится при следующем открытии.
    if(!hadController||reloadedForUpdate)return;
    if(localStorage.getItem("trening_session"))return;
    reloadedForUpdate=true; location.reload();
  });
  window.addEventListener('load',()=>navigator.serviceWorker
    .register('./sw.js?v='+BUILD,{updateViaCache:'none'})
    .then(r=>r.update().catch(()=>{})).catch(()=>{}));
}
boot();
</script>
