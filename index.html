<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Тренировка</title>
<style>
/* Высокий контраст: тёмный текст на светлом фоне, читается на солнце. */
:root{
  --bg:#f7f3e8; --fg:#141414; --muted:#555; --line:#c9c2ad;
  --btn:#141414; --btn-fg:#fff; --accent:#0a6b2e; --warn:#a11; --card:#fff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);
  font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;
  font-size:19px;line-height:1.35;-webkit-user-select:none;user-select:none}
#app{max-width:540px;margin:0 auto;padding:14px 14px 24px;min-height:100vh;
  display:flex;flex-direction:column}
h1{font-size:23px;margin:.2em 0}
.title{font-weight:800;font-size:21px}
.sub{color:var(--muted);font-size:16px}
.hr{border:0;border-top:2px solid var(--line);margin:9px 0}
.big{font-size:46px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums}
button{font-size:19px;min-height:52px;border:2px solid var(--btn);
  background:var(--btn);color:var(--btn-fg);border-radius:12px;padding:10px 14px;
  font-weight:700;cursor:pointer;flex:1}
button.ghost{background:transparent;color:var(--fg)}
button.warn{background:var(--warn);border-color:var(--warn)}
button.go{background:var(--accent);border-color:var(--accent)}
button.small{min-height:46px;font-size:16px}
button:disabled{opacity:.4}

.card{background:var(--card);border:2px solid var(--line);border-radius:12px;

.center{text-align:center}
.name{font-size:30px;font-weight:800;letter-spacing:1px}
.tap{display:flex;flex-direction:column;align-items:center;justify-content:center;
  border:3px solid var(--btn);border-radius:16px;margin:10px 0;min-height:40vh;
  background:#fffef8;cursor:pointer}
.tap .num{font-size:60px;font-weight:800;font-variant-numeric:tabular-nums}
.tap.run{background:#eaf6ec;border-color:var(--accent)}
.grid5{display:flex;gap:6px}

.note{color:var(--muted);font-size:15px}

  padding:2px 9px;font-size:14px;font-weight:700}
.warnbox{background:#fff2f0;border:2px solid var(--warn);color:var(--warn);
  border-radius:10px;padding:8px;font-weight:700}
.blk{margin:8px 0}
.blk .h{font-weight:800;font-size:15px;text-transform:uppercase;letter-spacing:.5px}
.blk.look .h{color:#0a4f6b}.blk.err .h{color:var(--warn)}
.blk.ok .h{color:var(--accent)}.blk.match .h{color:#7a4b00}
ol{margin:6px 0 6px 22px;padding:0}li{margin:3px 0}
svg.svg{width:100%;height:auto;background:#fffef8;border:2px solid var(--line);
  border-radius:10px;display:block;margin:6px 0}

input[type=text]{font-size:24px;width:100%;padding:10px;border:2px solid var(--btn);
  border-radius:10px;text-align:center}

  border:2px solid var(--btn);border-radius:10px}
.foot{margin-top:auto}
.sw{display:flex;align-items:center;justify-content:space-between;gap:8px}

.small-actions button{min-height:44px;font-size:14px}

<body>
<div id="app"></div>
<script>
"use strict";
/* ================================================================
   ТРЕНИРОВКА БРАТЬЕВ — автономное Mini App (v2).
   Приложение ведёт человека, который видит упражнение впервые:
   сколько фишек, на каком расстоянии, где стоит тренер, что делать
   по шагам. Коды упражнений тренеру НЕ показываются — только в данных.

   Перед каждым упражнением — ТРИ экрана: Расстановка → Что делать →
   Работа. Пробных попыток нет. Занятие идёт офлайн, копится в
   localStorage, вечером — [Выгрузить] боту (файлом).

   ГЛАВНОЕ ПРАВИЛО: братья не сравниваются. Один выполняет → тренер
   записал → потом второй. Итоги — отдельными карточками. Имена рядом
   только на экране самочувствия (это ввод, не вывод).
   ================================================================ */
const tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
if (tg) { try { tg.ready(); tg.expand(); } catch(e){} }

const PLAYERS = ["DANIIL","ADRIAN"];
const RU = {DANIIL:"ДАНИИЛ", ADRIAN:"АДРИАН"};

/* ---------- Звук и вибрация ---------- */
function soundOn(){ return localStorage.getItem("trening_sound")!=="off"; }
function toggleSound(){ localStorage.setItem("trening_sound", soundOn()?"off":"on"); screenHome(); }
function beep(){
  if(!soundOn()) return;
  try{
    const A=window.AudioContext||window.webkitAudioContext; const a=new A();
    const o=a.createOscillator(), g=a.createGain();
    o.connect(g); g.connect(a.destination);
    o.type="sine"; o.frequency.value=880; g.gain.value=0.25;
    o.start(); setTimeout(()=>{o.stop(); a.close();},180);
  }catch(e){}
}
function signal(){ beep(); if(navigator.vibrate) navigator.vibrate(200); }

/* ---------- Часы и абсолютное время ---------- */
function hhmm(dt){ return String(dt.getHours()).padStart(2,"0")+":"+String(dt.getMinutes()).padStart(2,"0"); }
function hhmmss(dt){ return hhmm(dt)+":"+String(dt.getSeconds()).padStart(2,"0"); }

/* ================================================================
   КАЛЕНДАРЬ (зеркалит bot/schedule.py)
   ================================================================ */
const P1_START="2026-08-03", P1_END="2026-08-19";
const P2_START="2026-08-20", P2_END="2026-09-10";
const CONTROL_DAYS={"2026-08-03":1,"2026-08-14":2,"2026-09-09":3};
const TAPER_SHORT="2026-08-19", TAPER_WEEK_START="2026-08-17";
const WD=["MON","TUE","WED","THU","FRI","SAT","SUN"];
const WD_RU=["понедельник","вторник","среда","четверг","пятница","суббота","воскресенье"];
// Матрица Фазы 1: [цель, минут, [[код, минут-блока]...]]
const P1_MATRIX={
  MON:["Скорость и первый шаг",85,[["E01",14],["E02",15],["E13",14],["E12",9],["E10S",9]]],
  TUE:["Дриблинг и быстрые ноги",80,[["E04",14],["E05",15],["E14",14],["E10S",9]]],
  WED:["Смена направления",80,[["E06",12],["E13",18],["E14",14],["E12",9]]],
  THU:["Контроль и завершение",80,[["E07",14],["E10",32],["E13",9]]],
  FRI:["Отрыв и повторный рывок",80,[["E15",20],["E16",14],["E13",12]]],
};
const P2_TYPES={
  S:["Скорость",[["E01",12],["E02",12],["E13",10]]],
  B:["Мяч",[["E04",12],["E10S",10],["E14",12]]],
  D:["Единоборство",[["E13",14],["E12",10]]],
};
function isoToDate(s){const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);}
function dateToIso(dt){return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");}
function addDays(iso,n){const dt=isoToDate(iso);dt.setDate(dt.getDate()+n);return dateToIso(dt);}
function wdOf(iso){return (isoToDate(iso).getDay()+6)%7;}
function weekOfP1(iso){return Math.floor((isoToDate(iso)-isoToDate(P1_START))/86400000/7)+1;}
function ctx(){const raw=localStorage.getItem("trening_ctx");
  const o=raw?JSON.parse(raw):{club_days:[],match_days:[]};
  return {club:new Set(o.club_days||[]),match:new Set(o.match_days||[])};}
function rule5(iso,c){
  if(c.club.has(iso)||c.match.has(iso))return false;
  if(c.match.has(addDays(iso,1)))return false;
  if(c.match.has(addDays(iso,-1)))return false;
  if(c.club.has(addDays(iso,-1))&&c.club.has(addDays(iso,-2)))return false;
  return true;}
function phase2Type(iso,c){
  let alt=0,cur=P2_START; while(cur<iso){if(rule5(cur,c))alt++;cur=addDays(cur,1);}
  if(c.club.has(iso))return[null,"Сегодня клубная тренировка. Утреннего занятия нет."];
  if(c.match.has(iso))return[null,"Сегодня матч. Занятия нет."];
  if(c.match.has(addDays(iso,1)))return[null,"Завтра матч. Занятия нет."];
  if(c.match.has(addDays(iso,-1)))return["B","Вчера был матч — тип Мяч."];
  if(c.club.has(addDays(iso,-1))&&c.club.has(addDays(iso,-2)))return["B","Два клубных дня подряд — тип Мяч."];
  return[(alt%2===0)?"S":"D","Чередование скорость/единоборство."];
}
function noDay(iso,phase,reason){return {iso,phase,week:null,code:WD[wdOf(iso)],day_code:"",
  goal:"",minutes:0,has:false,control:false,type:null,blocks:[],shortened:false,reason};}
function determineDay(iso){
  const wd=wdOf(iso),code=WD[wd];
  if(CONTROL_DAYS[iso]!==undefined){
    return {iso,phase:iso<=P1_END?1:2,week:iso<=P1_END?weekOfP1(iso):null,code,
      day_code:"CTRL_"+CONTROL_DAYS[iso],goal:"Контрольный замер",minutes:60,has:true,
      control:true,type:null,blocks:[["E01",12],["E02",12],["E08",20]],shortened:false,
      reason:"Контрольный день: тест, не тренировка."};
  }
  if(iso>=P1_START&&iso<=P1_END){
    if(!P1_MATRIX[code])return noDay(iso,1,"Выходной. В Фазе 1 занятия только Пн-Пт.");
    const w=weekOfP1(iso),[goal,min,blocks]=P1_MATRIX[code];
    if(iso===TAPER_SHORT)return {iso,phase:1,week:w,code,day_code:"P1_W"+w+"_"+code,
      goal:"Подводка: старты + удары",minutes:40,has:true,control:false,type:null,
      blocks:[["E01",14],["E10S",12]],shortened:true,reason:"Подводка перед Фазой 2."};
    const short=iso>=TAPER_WEEK_START;
    return {iso,phase:1,week:w,code,day_code:"P1_W"+w+"_"+code,goal,minutes:min,has:true,
      control:false,type:null,blocks:blocks.map(b=>b.slice()),shortened:short,
      reason:short?"Подводка: объём -50%.":""};
  }
  if(iso>=P2_START&&iso<=P2_END){
    const c=ctx(),[t,reason]=phase2Type(iso,c);
    if(!t)return noDay(iso,2,reason);
    const[name,blocks]=P2_TYPES[t];
    return {iso,phase:2,week:null,code,day_code:"P2_"+t,goal:name,minutes:38,has:true,
      control:false,type:t,blocks:blocks.map(b=>b.slice()),shortened:false,reason};
  }
  return noDay(iso,null,"Дата вне программы лагеря.");
}
// Число приёмов E13 по дню (контроль под опекой).
function e13N(code){return {MON:6,WED:8,THU:4,FRI:5}[code]||5;}
// Раз в две недели удлинённый третий длинный забег Даниила (E02).
function e02Biweekly(iso){const diff=Math.round((isoToDate(iso)-isoToDate("2026-08-10"))/86400000);
  return diff>=0 && diff%14===0;}

/* ================================================================
   РАЗМЕТКА НА ДЕНЬ
   ================================================================ */
const MARKUP=
`Коридор Даниила:  0 — 10 — 20 — 35 м
Коридор Адриана:  0 — 10 — 15 — 20 м
Между коридорами 3 метра.
Ты стоишь на общем финише и не перемещаешься.`;

/* ================================================================
   РАЗМИНКА (полный текст, показывается в каждом дне)

function warmupSteps(code){
  const s=[
    {t:"Лёгкий бег",min:3,body:"Свободный бег по кругу или вдоль поля.\nМогут разговаривать — значит темп верный."},
    {t:"Суставная на месте",min:3,body:"По 10 повторов каждое:\nвращения голеностопа, полуприседы, вращения таза,\nнаклоны корпуса вбок, вращения плеч, повороты головы."},
    {t:"Динамическая в движении",min:4,body:"По 20 м, обратно шагом:\n• Высокое бедро • Захлёст голени\n• Выпады с поворотом корпуса\n• Приставной правым боком • Приставной левым боком\n• «Открой калитку» — колено вперёд и в сторону\n• На носках, затем на пятках"},
    {t:"Ускорения",min:3,body:"4 отрезка по 30 м: 60%, 70%, 80%, 90%.\nОбратно шагом."},
    {t:"Мяч",min:2,body:"Перепасовка братьев в движении, 10 м между ними."},
  ];
  if(code==="MON") s.push({t:"Прыжки в длину с места",min:1,
    body:"3 прыжка каждому, 30 секунд.\nНе тренировка — взбадривание нервной системы\nперед скоростным блоком."});
  if(code==="TUE") s.push({t:"Координационная лестница",min:4,
    body:"4 варианта по 60 сек, после каждого ускорение 15 м:\n• два шага в ячейку • один шаг, максимально часто\n• боком приставным • внутрь-наружу\nДаниилу хватит 2-3 вариантов, Адриану все четыре.\nЛестница не делает быстрее — задаёт ритм стопы."});
  return s;
}
function cooldownStep(code){
  return {t:"Заминка",min:5,body:
    (code==="FRI"?"Лёгкий бег 3 минуты.":"Лёгкий бег 2 минуты.")+
    "\nРастяжка по 20 сек: задняя поверхность бедра,\nикры, пах, квадрицепс."};
}

/* ================================================================
   SVG-помощники
   ================================================================ */
function svg(inner){
  return `<svg class="svg" viewBox="0 0 300 170">
   <defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
     <path d="M0,0 L6,3 L0,6 Z" fill="#141414"/></marker></defs>${inner}</svg>`;
}
function cone(x,y){return `<circle cx="${x}" cy="${y}" r="5" fill="none" stroke="#141414" stroke-width="2"/>`;}
function ball(x,y){return `<circle cx="${x}" cy="${y}" r="4" fill="#141414"/>`;}
function lbl(x,y,t){return `<text x="${x}" y="${y}" font-size="12" fill="#141414">${t}</text>`;}
function mark(x,y,t){return `<text x="${x}" y="${y}" font-size="15" font-weight="700" fill="#141414">${t}</text>`;}
function goal(x,y){return `<rect x="${x}" y="${y}" width="7" height="40" fill="none" stroke="#141414" stroke-width="2"/>`;}
function arrow(x1,y1,x2,y2){return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#141414" stroke-width="2" marker-end="url(#ar)"/>`;}
function dim(x1,y,x2,t){return `<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="#888" stroke-width="1"/>`+lbl((x1+x2)/2-10,y-4,t);}

/* ================================================================

function slot(player,ex,variant,dist,no,rest,extra){
  return Object.assign({player,ex,variant,dist,attempt_no:no,rest,goal:false,firstRest:false},extra||{});
}
function repsFor(code,spec){
  const R={DANIIL:[],ADRIAN:[]}, hot=(localStorage.getItem("trening_hot")==="1");
  const push=(pl,arr)=>{R[pl]=arr;};
  if(code==="E01"){
    push("DANIIL",[["stance",1],["stance",2],["sit_face",3],["sit_face",4],["lie",5],["sit_back",6]]
      .map(([v,n])=>slot("DANIIL","E01",v,10,n,80)));
    push("ADRIAN",[["stance",1],["stance",2],["sit_back",3],["sit_back",4],["sit_back",5]]
      .map(([v,n])=>slot("ADRIAN","E01",v,10,n,80)));
    R.DANIIL[0].firstRest=true; R.ADRIAN[0].firstRest=true;
  } else if(code==="E02"){
    const bw=e02Biweekly(spec.iso);
    const d=[slot("DANIIL","E02","20m",20,1,90),slot("DANIIL","E02","20m",20,2,90),slot("DANIIL","E02","20m",20,3,90),
      slot("DANIIL","E02","25m_fly",35,4,150),slot("DANIIL","E02","25m_fly",35,5,150),
      slot("DANIIL","E02", bw?"30m_fly":"25m_fly", bw?40:35,6,150)];
    push("DANIIL",d);
    push("ADRIAN",[slot("ADRIAN","E02","15m",15,1,80),slot("ADRIAN","E02","15m",15,2,80),slot("ADRIAN","E02","15m",15,3,80),
      slot("ADRIAN","E02","20m",20,4,90),slot("ADRIAN","E02","20m",20,5,90)]);
  } else if(code==="E06"){
    push("DANIIL",[1,2,3].map(n=>slot("DANIIL","E06","",5,n,75)));
    push("ADRIAN",[1,2,3].map(n=>slot("ADRIAN","E06","",4,n,75)));
  } else if(code==="E07"){
    const mk=(pl,d)=>[...[1,2,3,4,5].map(n=>slot(pl,"E07","spin",d,n,70)),
      ...[6,7,8,9,10].map(n=>slot(pl,"E07","side",d,n,70))];
    push("DANIIL",mk("DANIIL",20)); push("ADRIAN",mk("ADRIAN",15));
  } else if(code==="E04"){
    push("DANIIL",[1,2,3,4,5,6].map(n=>slot("DANIIL","E04","",15,n,70,{goal:true})));
    push("ADRIAN",[1,2,3,4,5,6,7,8].map(n=>slot("ADRIAN","E04","",10,n,60,{goal:true})));
  } else if(code==="E05"){
    push("DANIIL",[1,2,3,4,5,6].map(n=>slot("DANIIL","E05","",5,n,70,{goal:true})));
    push("ADRIAN",[1,2,3,4,5,6].map(n=>slot("ADRIAN","E05","",4,n,60,{goal:true})));
  } else if(code==="E15"){
    push("DANIIL",[1,2,3,4,5].map(n=>slot("DANIIL","E15","",35,n,180,{goal:true})));
    push("ADRIAN",[1,2,3,4,5].map(n=>slot("ADRIAN","E15","",20,n,180,{goal:true})));
  } else if(code==="E16"){
    push("DANIIL",[1,2,3].map(n=>slot("DANIIL","E16","",35,n,90)));
    push("ADRIAN",[]); // Адриан идёт отдельным потоком (удары с места)
  } else if(code==="E08"){
    push("DANIIL",[1,2,3,4,5].map(n=>slot("DANIIL","E08_D","",34,n,90,{goal:true})));
    push("ADRIAN",[1,2,3,4,5].map(n=>slot("ADRIAN","E08_A","",27,n,90,{goal:true})));
  }
  return R;
}

function loadAttempts(){return JSON.parse(localStorage.getItem("trening_attempts")||"[]");}
function saveAttempts(a){localStorage.setItem("trening_attempts",JSON.stringify(a));}
function records(){return JSON.parse(localStorage.getItem("trening_records")||"{}");}
function unsynced(){return loadAttempts().filter(a=>!a.uploaded).length;}
function uuid(){return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{
  const r=Math.random()*16|0,v=c==='x'?r:(r&0x3|0x8);return v.toString(16);});}
function nowIso(){return new Date().toISOString();}
let S=null, sessionTimer=null, lastDrink=0;
function saveSession(){ if(S) localStorage.setItem("trening_session",JSON.stringify(S)); }
function clearSession(){ localStorage.removeItem("trening_session"); S=null;
  if(sessionTimer){clearInterval(sessionTimer);sessionTimer=null;} }
function pushAttempt(o){
  const a=loadAttempts();
  const rec={uuid:uuid(),timestamp:nowIso(),date:S.spec.iso,player:o.player,
    day_code:S.spec.day_code,exercise_id:o.ex||o.exercise_id,variant:o.variant||"",
    attempt_no:o.attempt_no||0,is_warmup:false, // пробных больше нет
    time_sec:(o.time_sec!==undefined&&o.time_sec!==null)?Number(Number(o.time_sec).toFixed(2)):null,
    distance_m:o.dist||o.distance_m||null,control:o.control??null,goals:o.goals??null,
    shots:o.shots??null,wellbeing:o.wellbeing??null,
    shortened:(S.spec.shortened||S.shortened||false),note:o.note||"",uploaded:false};
  a.push(rec); saveAttempts(a); S.attempts.push(rec); saveSession(); return rec;
}
function writeWellbeing(){ for(const pl of PLAYERS){ if(S.wellbeing[pl]!==undefined)
  pushAttempt({player:pl,ex:"E00",wellbeing:S.wellbeing[pl],note:"самочувствие",time_sec:null}); } }
function recordFor(player,ex,variant){const r=records()[player]; if(!r)return null;
  return r[ex+"|"+(variant||"")]??null;}
function prevToday(player,ex,variant){
  const l=S.attempts.filter(a=>a.player===player&&a.exercise_id===ex&&(a.variant||"")===(variant||"")&&a.time_sec!==null);
  return l.length?l[l.length-1].time_sec:null;}

/* ================================================================
   ПОСТРОЕНИЕ ПОСЛЕДОВАТЕЛЬНОСТИ И ПОТОК
   ================================================================ */
function buildSteps(){
  const steps=[];
  for(const w of warmupSteps(S.spec.code)) steps.push({kind:"timer",title:w.t,mins:w.min,body:w.body});
  steps.push({kind:"pause"});
  S.spec.blocks.forEach((b,i)=>{
    steps.push({kind:"setup",ex:b[0],mins:b[1]});
    steps.push({kind:"what",ex:b[0]});
    steps.push({kind:"work",ex:b[0],mins:b[1]});
    steps.push({kind:"pause"});
  });
  const cd=cooldownStep(S.spec.code);
  steps.push({kind:"timer",title:cd.t,mins:cd.min,body:cd.body});
  steps.push({kind:"summary"});
  S.steps=steps; S.stepIndex=0; S.startMs=performance.now();
  startSessionClock(); saveSession(); runStep();
}
function nextStep(){S.stepIndex++;runStep();}
function runStep(){
  saveSession();
  if(S.stepIndex>=S.steps.length)return screenSummary();
  const st=S.steps[S.stepIndex];
  S.block = (st.ex?{ex:st.ex}:S.block);
  if(st.kind==="timer")return screenTimer(st);
  if(st.kind==="pause")return screenPause();
  if(st.kind==="setup")return screenSetup(st);
  if(st.kind==="what")return screenWhat(st);
  if(st.kind==="work")return startWork(st);
  if(st.kind==="summary")return screenSummary();
}

  lastDrink=0; if(sessionTimer)clearInterval(sessionTimer);

    if(min>=lastDrink+15){lastDrink=Math.floor(min/15)*15;showDrink();}
  },5000);
}

function startWork(st){
  const e=EX[st.ex]; S.block={ex:st.ex};
  if(e.type==="duel")return workDuel(st);
  if(e.type==="shots")return workShots(st);
  if(e.type==="control")return workControl(st);
  if(e.type==="four")return workFour(st);
  return startMeasure(st); // time, time_goal, repeat
}
function workDuel(st){
  const e=EX[st.ex];
  h(`<h1>${e.name}</h1>

/* ---- Измеряемые упражнения (time / time_goal / repeat) ---- */
function startMeasure(st){
  const e=EX[st.ex], plan=repsFor(st.ex,S.spec);
  const order=[]; const mx=Math.max(plan.DANIIL.length,plan.ADRIAN.length);
  for(let i=0;i<mx;i++){ if(plan.DANIIL[i])order.push(plan.DANIIL[i]);
    if(plan.ADRIAN[i])order.push(plan.ADRIAN[i]); }
  S.measure={ex:st.ex,type:e.type,order,pos:0,stopped:{DANIIL:false,ADRIAN:false},
    best:{DANIIL:null,ADRIAN:null},readyAt:{DANIIL:0,ADRIAN:0},firstDone:{DANIIL:false,ADRIAN:false}};
  saveSession(); measureAdvance();
}
function measureAdvance(){
  const m=S.measure;
  while(m.pos<m.order.length&&m.stopped[m.order[m.pos].player])m.pos++;
  if(m.pos>=m.order.length)return afterMeasure();
  const cur=m.order[m.pos];
  if(cur.firstRest&&!m.firstDone[cur.player]) return screenFullRest(cur);
  const remain=m.readyAt[cur.player]-Date.now();
  if(remain<=10000) return screenStopwatch(cur, remain>0);
  return screenRestWait(cur);
}
function afterMeasure(){
  // Адриан отдельным потоком в «Повторном рывке»: удары с места.
  if(S.measure.ex==="E16" && !S.measure.adrianDone){
    S.measure.adrianDone=true;
    return workShotsSingle("ADRIAN","E10S",12,"place","Адриан · 10 ударов с места (ближняя)",()=>nextStep());
  }
  nextStep();
}
function screenFullRest(cur){
  const e=EX[cur.ex], target=new Date(Date.now()+90000);
  h(`<h1>Полный отдых 90 сек</h1>
    <div class="card center"><div class="sub">${RU[cur.player]} · до</div>
      <div class="big">${hhmmss(target)}</div></div>
    ${e.firstRestText?`<div class="reps" style="white-space:pre-line">${e.firstRestText}</div>`:""}
    <div class="row"><button class="go" onclick="finishFullRest()">Готово, на старт</button></div>`);
}
function finishFullRest(){ const m=S.measure; m.firstDone[m.order[m.pos].player]=true; measureAdvance(); }

function screenRestWait(cur){
  const m=S.measure, other=cur.player==="DANIIL"?"ADRIAN":"DANIIL";
  const readyDt=new Date(m.readyAt[cur.player]);
  h(`<h1>Отдых</h1>
    <div class="card center"><div class="sub">следующий</div>
      <div class="name">${RU[cur.player]}</div>
      <div class="note">готов в ${hhmmss(readyDt)}</div>
      <div class="big" id="rc"></div></div>
    ${(!m.stopped[other]&&m.readyAt[other]>Date.now())?
      `<div class="note center">${RU[other]} готов в ${hhmmss(new Date(m.readyAt[other]))}</div>`:""}
    <div class="row"><button class="ghost" onclick="skipRest()">Пропустить отдых</button></div>
    ${smallActions()}`);
  if(S._restTimer)clearInterval(S._restTimer);
  const tick=()=>{
    const remain=m.readyAt[cur.player]-Date.now();
    const el=document.getElementById("rc");
    if(!el){clearInterval(S._restTimer);return;}
    el.textContent=Math.max(0,Math.ceil(remain/1000))+" сек";
    if(remain<=10000){clearInterval(S._restTimer);S._restTimer=null;
      signal(); screenStopwatch(cur,true);}
  };
  tick(); S._restTimer=setInterval(tick,250);
}
function skipRest(){ if(S._restTimer){clearInterval(S._restTimer);S._restTimer=null;}
  const m=S.measure; m.readyAt[m.order[m.pos].player]=Date.now(); measureAdvance(); }

function screenStopwatch(cur,ready10){
  const m=S.measure, e=EX[cur.ex];
  const forPlayer=m.order.filter(o=>o.player===cur.player);
  const idx=m.order.slice(0,m.pos+1).filter(o=>o.player===cur.player).length;
  const total=forPlayer.length;
  const variantLine=variantLabel(cur);
  let nextInfo="";
  for(let k=m.pos+1;k<m.order.length;k++){ if(!m.stopped[m.order[k].player]){
    nextInfo="Далее: "+RU[m.order[k].player]; break; } }
  const prev=prevToday(cur.player,cur.ex,cur.variant), rec=recordFor(cur.player,cur.ex,cur.variant);
  const recLine=(prev!==null||rec!==null)?`Пред. ${prev!==null?prev.toFixed(2):"—"} · рекорд ${rec!==null?rec.toFixed(2):"—"}`:"";
  h(`${ready10?`<div class="warnbox center">ГОТОВНОСТЬ 10 СЕК</div>`:""}
    <div class="title">${e.name}</div><div class="hr"></div>
    <div class="tap" id="tap" onclick="tapWatch()">
      <div class="name">${RU[cur.player]}</div>
      <div class="note">попытка ${idx} из ${total}${variantLine?" · "+variantLine:""}</div>
      <div class="num" id="num">0.00</div>
      <div class="note" id="hint">тап = старт</div></div>
    <div class="note">${recLine}</div>
    <div class="note">${nextInfo}</div>
    <div class="row">
      <button class="ghost small" onclick="notMeasured()">Не засёк</button>
      <button class="ghost small" onclick="manualEntry()">Ручной ввод</button>
      <button class="ghost small" onclick="measureBack()">Назад</button></div>
    ${smallActions()}`);
  S.watch={running:false,t0:0,cur};
}
function variantLabel(cur){
  const V={stance:"стойка",sit_face:"сидя лицом",sit_back:"сидя спиной",lie:"лёжа",
    spin:"спиной",side:"боком","20m":"20 м","15m":"15 м","25m_fly":"замер 25 м с ходу","30m_fly":"замер 30 м с ходу"};
  if(cur.variant&&V[cur.variant])return V[cur.variant];
  if(cur.dist)return cur.dist+" м";
  return "";
}
function tapWatch(){
  const w=S.watch;
  if(!w.running){w.running=true;w.t0=performance.now();
    document.getElementById("tap").classList.add("run");
    document.getElementById("hint").textContent="тап = стоп";
    const loop=()=>{const el=document.getElementById("num");if(!el||!w.running)return;
      el.textContent=((performance.now()-w.t0)/1000).toFixed(2);w.raf=requestAnimationFrame(loop);};
    w.raf=requestAnimationFrame(loop);
  } else {
    w.running=false; if(w.raf)cancelAnimationFrame(w.raf);
    recordTime((performance.now()-w.t0)/1000);
  }
}
function notMeasured(){recordTime(null,true);}
function manualEntry(){overlay(`<div class="card"><div class="title">Ручной ввод (2.06 / 2,06 / 206)</div>
  <input type="text" id="mv" inputmode="decimal">
  <div class="row"><button class="go" onclick="applyManual()">Ок</button>
   <button class="ghost" onclick="closeOverlay()">Отмена</button></div></div>`);}
function parseTime(s){s=(s||"").trim().replace(",",".");if(!s)return null;
  let v=parseFloat(s); if(s.indexOf(".")<0&&v>=100)v=v/100; return isNaN(v)?null:v;}
function applyManual(){const v=parseTime(document.getElementById("mv").value);closeOverlay();recordTime(v);}
function measureBack(){const m=S.measure;
  if(m.pos>0){ const last=S.attempts[S.attempts.length-1];
    if(last){const a=loadAttempts();a.pop();saveAttempts(a);S.attempts.pop();}
    m.pos--; }
  measureAdvance();}

function recordTime(t,nm){
  const m=S.measure, cur=m.order[m.pos];
  pushAttempt({player:cur.player,ex:cur.ex,variant:cur.variant,attempt_no:cur.attempt_no,
    time_sec:t,dist:cur.dist,note:nm?"не засечено":""});
  // time_goal: после секундомера — экран гола.
  if(m.type==="time_goal" && t!==null){ return screenGoalAsk(cur,t); }
  finalizeTime(cur,t);
}
function screenGoalAsk(cur,t){
  h(`<h1>Гол?</h1>
    <div class="card center"><div class="name">${RU[cur.player]}</div>
      <div class="big">${t.toFixed(2)}</div></div>
    <div class="row"><button class="go" onclick="setGoal(true)">⚽ ДА</button>
      <button class="warn" onclick="setGoal(false)">✕ НЕТ</button></div>`);
}
function setGoal(g){
  const m=S.measure, cur=m.order[m.pos];
  const a=S.attempts[S.attempts.length-1]; a.goals=g?1:0; a.shots=1;
  const all=loadAttempts(); const ix=all.findIndex(x=>x.uuid===a.uuid);
  if(ix>=0){all[ix].goals=a.goals;all[ix].shots=a.shots;saveAttempts(all);}
  saveSession();
  finalizeTime(cur, a.time_sec);
}
function finalizeTime(cur,t){
  const m=S.measure;
  // Стоп-правило (не для E16, только для stop-упражнений, время задано).
  if(t!==null && EX[cur.ex].stop){
    const b=m.best[cur.player];
    if(b!==null && Math.round((t-b)*100)/100>=0.15) return screenStopRule(cur,b,t);
    m.best[cur.player]=(b===null)?t:Math.min(b,t);
  } else if(t!==null){
    const b=m.best[cur.player]; m.best[cur.player]=(b===null)?t:Math.min(b,t);
  }
  m.readyAt[cur.player]=Date.now()+ (cur.rest||60)*1000;
  m.pos++; saveSession(); measureAdvance();
}
function screenStopRule(cur,best,t){
  h(`<h1>Стоп-правило</h1>
    <div class="card center"><div class="name">${RU[cur.player]}</div>
      <div class="title">Серия окончена</div>
      <div class="big">Лучшее: ${best.toFixed(2)}</div>
      <div class="note">Последняя ${t.toFixed(2)} — падение ${(t-best).toFixed(2)}.</div></div>
    <div class="row"><button class="go" onclick="stopSeries('${cur.player}')">Завершить</button>
      <button class="ghost" onclick="continueSeries()">Ещё один</button></div>`);
}
function stopSeries(pl){const m=S.measure;m.stopped[pl]=true;m.pos++;measureAdvance();}
function continueSeries(){const m=S.measure,cur=m.order[m.pos];
  const t=S.attempts[S.attempts.length-1].time_sec;
  m.best[cur.player]=Math.min(m.best[cur.player]??Infinity,t);
  m.readyAt[cur.player]=Date.now()+(cur.rest||60)*1000; m.pos++; measureAdvance();}

/* ---- shots: попал из N (E10S, поток Адриана в E16) ---- */
function workShots(st){ // оба игрока по очереди
  S.shots={ex:st.ex,player:"DANIIL",distByPlayer:{DANIIL:15,ADRIAN:12}};
  shotsRender();
}
function shotsRender(){
  const s=S.shots;
  h(`<h1>${EX[s.ex].name} · ${RU[s.player]}</h1>
    <div class="note">Сколько попал из 10</div>
    <div class="gridN">${Array.from({length:11},(_,i)=>`<button onclick="shotsSave(${i})">${i}</button>`).join("")}</div>
    ${smallActions()}`);
}
function shotsSave(g){const s=S.shots;
  pushAttempt({player:s.player,ex:s.ex,variant:"",goals:g,shots:10,dist:s.distByPlayer[s.player]});
  if(s.player==="DANIIL"){s.player="ADRIAN";return shotsRender();}
  delete S.shots; nextStep();
}
// Одиночный поток ударов (Адриан внутри «Повторного рывка»).
function workShotsSingle(player,ex,dist,variant,title,done){
  S._single={player,ex,dist,variant,done};
  h(`<h1>${title}</h1>
    <div class="note">Сколько попал из 10</div>
    <div class="gridN">${Array.from({length:11},(_,i)=>`<button onclick="singleSave(${i})">${i}</button>`).join("")}</div>
    ${smallActions()}`);
}
function singleSave(g){const s=S._single;
  pushAttempt({player:s.player,ex:s.ex,variant:s.variant,goals:g,shots:10,dist:s.dist});
  const d=s.done; delete S._single; d();
}

/* ---- control: контроль 1-5 + голы из N (E13) ---- */
function workControl(st){
  const N=e13N(S.spec.code);
  S.ctrl={ex:st.ex,player:"DANIIL",N,stage:"c"};
  ctrlRender();
}
function ctrlRender(){
  const c=S.ctrl;
  if(c.stage==="c"){
    h(`<h1>${EX[c.ex].name} · ${RU[c.player]}</h1>
      <div class="note">Контроль мяча (1-5)</div>
      <div class="grid5">${[1,2,3,4,5].map(v=>`<button onclick="ctrlC(${v})">${v}</button>`).join("")}</div>
      ${smallActions()}`);
  } else {
    h(`<h1>${EX[c.ex].name} · ${RU[c.player]}</h1>
      <div class="note">Голов из ${c.N}</div>
      <div class="gridN">${Array.from({length:c.N+1},(_,i)=>`<button onclick="ctrlG(${i})">${i}</button>`).join("")}</div>
      ${smallActions()}`);
  }
}
function ctrlC(v){S.ctrl._c=v;S.ctrl.stage="g";ctrlRender();}
function ctrlG(g){const c=S.ctrl;
  pushAttempt({player:c.player,ex:c.ex,control:c._c,goals:g,shots:c.N});
  if(c.player==="DANIIL"){c.player="ADRIAN";c.stage="c";delete c._c;return ctrlRender();}
  delete S.ctrl; nextStep();
}

/* ---- four: удары четыре серии (E10) ---- */
function workFour(st){ S.four={player:"DANIIL",series:1}; fourDist(); }
function fourDist(){
  const f=S.four, near=f.player==="DANIIL"?"14-15 м":"11-14 м", far=f.player==="DANIIL"?"20-25 м":"15-18 м";
  const onlyNear=(f.series===1||f.series===3); // 1 с места ближняя; 3 с фланга — ближняя зона
  const names=["с места","после приёма","в одно касание с фланга","после рывка, выбор угла"];
  h(`<h1>Удары · ${RU[f.player]} · серия ${f.series}/4</h1>
    <div class="reps">${names[f.series-1]}.</div>
    <div class="title">Дистанция серии</div>
    <div class="row"><button class="go" onclick="fourSet('near')">Ближняя ${near}</button>
      ${onlyNear?"":`<button onclick="fourSet('far')">Дальняя ${far}</button>`}</div>
    ${smallActions()}`);
}
function fourSet(kind){
  const f=S.four; f.kind=kind;
  const distM=f.player==="DANIIL"?(kind==="near"?15:22):(kind==="near"?13:16);
  const max=[8,10,10,12][f.series-1]; f.distM=distM; f.max=max;
  h(`<h1>Голы · ${RU[f.player]} · серия ${f.series}/4</h1>
    <div class="note">${kind==="near"?"ближняя":"дальняя"} · из ${max}</div>
    <div class="gridN">${Array.from({length:max+1},(_,i)=>`<button onclick="fourSave(${i})">${i}</button>`).join("")}</div>
    ${smallActions()}`);
}
function fourSave(goals){
  const f=S.four;
  pushAttempt({player:f.player,ex:"E10",variant:"s"+f.series,attempt_no:f.series,
    goals,shots:f.max,dist:f.distM});
  if(f.series<4){f.series++;return fourDist();}
  if(f.player==="DANIIL"){f.player="ADRIAN";f.series=1;return fourDist();}
  delete S.four; nextStep();
}

/* ================================================================
   ОТМЕНА, ИТОГ, ВЫГРУЗКА
   ================================================================ */
function screenCancel(){
  closeOverlay();
  h(`<h1>Отмена занятия</h1>
    <div class="warnbox">Критерии остановки:
    выше 32 °C в тени · озноб · гусиная кожа ·
    прекратилось потоотделение · головная боль.</div>
    <div class="row"><button class="warn" onclick="screenHome()">Остановить занятие</button></div>
    <div class="row"><button class="ghost" onclick="runStep()">Назад к занятию</button></div>`);
}
function screenSummary(){
  if(sessionTimer){clearInterval(sessionTimer);sessionTimer=null;}
  // Отдельная карточка на игрока. Никаких сравнений.
  const cards=PLAYERS.map(pl=>summaryCard(pl)).join("");
  h(`<h1>Итог занятия</h1>${cards}
    <div class="row"><button class="go" onclick="uploadAll()">Выгрузить сейчас</button>
      <button class="ghost" onclick="finishLater()">Позже</button></div>`);
}
function summaryCard(pl){
  // Карточка одного игрока: лучшее время по упражнениям + суммы голов.
  const times=S.attempts.filter(a=>a.player===pl&&a.time_sec!==null);
  const byExT={}; for(const a of times){(byExT[a.exercise_id]=byExT[a.exercise_id]||[]).push(a.time_sec);}
  const nameOf=ex=>(EX[ex]||EX[ex.replace(/_[DA]$/,"")]||{name:ex}).name;
  let rows=Object.keys(byExT).map(ex=>`<div>${nameOf(ex)}: лучшее ${Math.min(...byExT[ex]).toFixed(2)}</div>`).join("");
  // Голы: суммируем по упражнению (E10 по сериям — суммарно как ориентир не считаем).
  const goalsAtt=S.attempts.filter(a=>a.player===pl&&a.goals!==null&&a.shots&&a.exercise_id!=="E10");
  const byExG={}; for(const a of goalsAtt){const k=a.exercise_id;
    byExG[k]=byExG[k]||{g:0,s:0}; byExG[k].g+=a.goals; byExG[k].s+=a.shots;}
  rows+=Object.keys(byExG).map(ex=>`<div>${nameOf(ex)}: голы ${byExG[ex].g} из ${byExG[ex].s}</div>`).join("");
  if(!rows)rows='<div class="note">Замеров нет.</div>';
  return `<div class="card"><div class="name">${RU[pl]}</div>${rows}</div>`;
}
function finishLater(){clearSession();screenHome();}
function buildPayload(){
  const pending=loadAttempts().filter(a=>!a.uploaded), c=ctx();
  return {records:pending.map(a=>{const{uploaded,...r}=a;return r;}),
    context:{club_days:[...c.club],match_days:[...c.match]}};
}
// Пометить всё выгруженным (после подтверждения приёма ботом) и снять флаг файла.
function markUploaded(){ const all=loadAttempts();
  all.forEach(a=>{if(!a.uploaded)a.uploaded=true;}); saveAttempts(all);
  localStorage.removeItem("trening_downloaded"); }
function screenSent(n){
  h(`<h1>Отправлено</h1><div class="card center">
    <div class="big">${n}</div><div style="font-size:22px">записей отправлено</div></div>
    <div class="row"><button class="go" onclick="screenHome()">Готово</button></div>`);
}
function uploadFilename(pending){
  const dates=[...new Set(pending.map(a=>a.date))].sort();
  const earliest=dates[0]||dateToIso(new Date());
  return dates.length>1 ? `trening-${earliest}-${pending.length}.json`
                        : `trening-${earliest}.json`;
}
function downloadFile(name,text){
  const blob=new Blob([text],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
}
function screenFileSaved(){
  h(`<h1>Файл сохранён</h1>
    <div class="card"><div style="font-size:21px">Открой чат с ботом, нажми скрепку
      и отправь этот файл.</div></div>
    <div class="row"><button class="go" onclick="screenHome()">Понятно</button></div>`);
}
function uploadAll(){
  const pending=loadAttempts().filter(a=>!a.uploaded);
  if(!pending.length){toast("Нет несинхронизированных записей.");return;}
  const body=JSON.stringify(buildPayload());
  // Тихий резерв: sendData, если он есть и payload помещается в лимит Telegram.
  if(tg&&tg.sendData&&body.length<3800){
    try{ tg.sendData(body); markUploaded(); screenSent(pending.length); return; }catch(_){}
  }
  // Основной путь: скачать файл. Выгруженным НЕ помечаем — только после
  // того, как тренер подтвердит приём кнопкой «Отметить выгруженным».
  downloadFile(uploadFilename(pending), body);
  localStorage.setItem("trening_downloaded","1");
  screenFileSaved();
}
// Ручная отметка после подтверждения ботом.
function confirmMark(){
  overlay(`<div class="card"><div class="title">Бот подтвердил приём?</div>
    <div class="note">Записи будут помечены как выгруженные.</div>
    <div class="row"><button class="go" onclick="doMark()">Да</button>
      <button class="ghost" onclick="closeOverlay()">Отмена</button></div></div>`);
}
function doMark(){ markUploaded(); closeOverlay(); screenHome(); }

/* ================================================================
   РАСПИСАНИЕ, ИМПОРТ, ПОСЛЕДНЕЕ, СБРОС
   ================================================================ */
function screenWeek(){
  const c=ctx();
  h(`<h1>Расписание на неделю</h1>
    <div class="card"><div class="title">Клубные дни (через запятую)</div>
      <input type="text" id="club" value="${[...c.club].join(", ")}"></div>
    <div class="card"><div class="title">Даты матчей</div>
      <input type="text" id="match" value="${[...c.match].join(", ")}"></div>
    <div class="note">Формат: 2026-08-21, 2026-08-24</div>
    <div class="row"><button class="go" onclick="saveWeek()">Сохранить</button>
      <button class="ghost" onclick="screenHome()">Назад</button></div>`);
}
function saveWeek(){
  const p=id=>document.getElementById(id).value.split(",").map(s=>s.trim()).filter(s=>/^\d{4}-\d{2}-\d{2}$/.test(s));
  localStorage.setItem("trening_ctx",JSON.stringify({club_days:p("club"),match_days:p("match")}));
  screenHome();
}
function screenImport(){
  h(`<h1>Импорт рекордов</h1>
    <div class="note">Вставьте слепок из ответа бота (по игроку). Он показывается на поле в строке «Пред. · рекорд».</div>
    <textarea id="imp" placeholder='{"player":"DANIIL","records":{...}}'></textarea>
    <div class="row"><button class="go" onclick="applyImport()">Сохранить</button>
      <button class="ghost" onclick="screenHome()">Назад</button></div>`);
}
function applyImport(){
  try{ const o=JSON.parse(document.getElementById("imp").value.trim());
    if(!o.player||!o.records)throw 0;
    const r=records(); r[o.player]=o.records;
    localStorage.setItem("trening_records",JSON.stringify(r));
    toast("Рекорды "+o.player+" сохранены.");
  }catch(e){toast("Не удалось прочитать слепок.");}
}
function screenLast(){
  const a=loadAttempts(), dates=[...new Set(a.map(x=>x.date))].sort(), last=dates[dates.length-1];
  if(!last){h(`<h1>Последнее занятие</h1><div class="note">Данных нет.</div>
    <div class="row"><button class="go" onclick="screenHome()">Назад</button></div>`);return;}
  const cards=PLAYERS.map(pl=>{
    const list=a.filter(x=>x.date===last&&x.player===pl&&x.time_sec!==null);
    const byEx={};list.forEach(x=>{(byEx[x.exercise_id]=byEx[x.exercise_id]||[]).push(x.time_sec);});
    const rows=Object.keys(byEx).map(ex=>{const nm=(EX[ex]||{name:ex}).name;
      return `<div>${nm}: ${Math.min(...byEx[ex]).toFixed(2)}</div>`;}).join("");
    return `<div class="card"><div class="name">${RU[pl]}</div>${rows||'<div class="note">—</div>'}</div>`;
  }).join("");
  h(`<h1>Последнее занятие · ${last}</h1>${cards}
    <div class="row"><button class="go" onclick="screenHome()">Назад</button></div>`);
}
function confirmReset(){
  const n=unsynced();
  overlay(`<div class="card"><div class="title">Сбросить все данные?</div>
    <div class="note">Будут удалены все попытки${n>0?` (в т.ч. ${n} невыгруженных)`:""}, рекорды, расписание и незавершённое занятие. Отменить нельзя.</div>
    <div class="row"><button class="warn" onclick="resetData()">Да, стереть</button>
      <button class="ghost" onclick="closeOverlay()">Отмена</button></div></div>`);
}
function resetData(){
  ["trening_attempts","trening_records","trening_ctx","trening_session","trening_hot"].forEach(k=>localStorage.removeItem(k));
  if(sessionTimer){clearInterval(sessionTimer);sessionTimer=null;} S=null;
  closeOverlay(); screenHome();
}

/* ================================================================
   ВОССТАНОВЛЕНИЕ И ЗАПУСК
   ================================================================ */
function boot(){
  if(localStorage.getItem("trening_session")){
    overlay(`<div class="card"><div class="title">Есть незавершённое занятие</div>
      <div class="row"><button class="go" onclick="resume()">Продолжить</button>
        <button class="ghost" onclick="dropSession()">Закрыть</button></div></div>`);
  } else screenHome();
}
function resume(){closeOverlay();S=JSON.parse(localStorage.getItem("trening_session"));
  if(S&&S.steps){S.startMs=performance.now();startSessionClock();runStep();}else screenHome();}
function dropSession(){closeOverlay();clearSession();screenHome();}

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
boot();
</script>
</body>
