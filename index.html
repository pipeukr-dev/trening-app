/* ---- Итог занятия: формат тот же, что у бота и в md-журнале ----
   Время и голы — РАЗНЫЕ строки; процент после каждого «N из M»;
   лучшее и среднее в два знака, затем рекорд за всё время; побит рекорд —
   отдельной строкой с пустыми строками вокруг; попытки с потерей мяча
   не входят в лучшее/среднее. */
const SEG_LABELS={E02:{"20m":`${DIST.E02["20m"]} м`,"15m":`${DIST.E02["15m"]} м`,
  "25m_fly":`${E02_MEASURE["25m_fly"]} м с ходу`,"30m_fly":`${E02_MEASURE["30m_fly"]} м с ходу`}};
const TIME_QUALITY={E01:"Скорость",E02:"Скорость",E06:"Смена направления"};
const E10_SERIES=[["С места",[["s1_near","ближняя"],["s1_far","дальняя"]]],
  ["После приёма",[["s2_near","ближняя"],["s2_far","дальняя"]]],
  ["С фланга",[["s3_right","справа"],["s3_left","слева"]]],
  ["Рывок на пас",[["s4_left","слева"],["s4_center","центр"],["s4_right","справа"]]]];
function exOf(ex){ return EX[ex]||EX[ex.replace(/_[DA]$/,"")]||null; }
/* Поля описаний могут быть функциями дня: число повторов зависит от фазы,
   поэтому текст считает его, а не помнит. */
function txt(v,spec){ return (typeof v==="function")?v(spec||(S&&S.spec)):(v||""); }
function stepsOf(e,spec){ return txt(e.steps,spec); }
function pctTxt(g,s){ return s?`${g} из ${s} (${Math.round(100*g/s)}%)`:"—"; }
// Время идёт в расчёт, если попытка не потеряна и замер не сбит: «сбой
// замера» означает, что секунды есть, но они не про то (dupl. bot/rules.py).
function scoringTimes(list){ return list.filter(a=>a.time_sec!==null&&!a.lost
  &&String(a.note||"").indexOf(BROKEN_NOTE)<0).map(a=>a.time_sec); }
/* Строка времени: лучшее, среднее и РЕКОРД за всё время (разброса нет —
   на поле по нему решений не принимают). Рекорд берётся из слепка
   «Импорт рекордов»; слепка нет — про рекорд молчим, бот всё равно
   покажет: у него полная история. */
const NEW_RECORD="🏆 НОВЫЙ РЕКОРД!";
/* Истории ДО этого занятия нет — сравнивать не с чем: рекорд считается строго
   по прошлым занятиям. Прежнее «рекорд не установлен» было верно по смыслу,
   но тренеру бесполезно — пишем прямо, что этот результат и есть рекорд
   для следующего раза (dupl. bot/insights.FIRST_MEASURE). */
const FIRST_MEASURE=" — первый замер, это рекорд";
function statsTxt(list,cap,record){
  const t=scoringTimes(list); if(!t.length)return null;
  const best=Math.min(...t), avg=t.reduce((x,y)=>x+y,0)/t.length;
  const parts=[`${cap?"Лучшее":"лучшее"} ${best.toFixed(2)}`,`среднее ${avg.toFixed(2)}`];
  // Истории нет — так и пишем, строку не прячем.
  return parts.join(", ")+((record===undefined||record===null)?FIRST_MEASURE
                                             :`, рекорд ${record.toFixed(2)}`);
}
// Строка нового рекорда — с пустой строкой сверху и снизу.
function recordLines(list,record){
  const t=scoringTimes(list);
  if(!t.length||record===undefined||record===null)return [];
  const best=Math.min(...t);
  if(best>=record)return [];
  return ["",`${NEW_RECORD} Прежний ${record.toFixed(2)}, улучшение ${(record-best).toFixed(2)}`,""];
}
function pctTail(record){return (record===null||record===undefined)
  ?FIRST_MEASURE:`, рекорд ${Math.round(record)}%`;}
function pctRecordLines(g,s,record){
  if(!s||record===null||record===undefined)return [];
  const pct=Math.round(100*g/s), prev=Math.round(record);
  if(pct<=prev)return [];
  return ["",`${NEW_RECORD} Прежний ${prev}%, улучшение ${nOf(pct-prev,"пункт","пункта","пунктов")}`,""];
}
// Упражнения, где потеря мяча — результат попытки, а не брак замера:
// в единоборствах не ушёл и не обыграл — это неудачная попытка, она входит
// в знаменатель, иначе «4 из 5» превратилось бы в «4 из 4» (dupl. bot/rules.py).
const LOST_IS_RESULT=new Set(["E13","E12","E14"]);
// Контроль мяча считается по потерям только там, где он вообще выводится.
const CONTROL_FROM_LOSSES=new Set(["E13"]);
// Как называется неудачная попытка в строке итога (dupl. bot/insights.py).
const LOST_LABEL={E12:"Не ушёл",E14:"Не обыграл"};
function lostLabel(ex){ return LOST_LABEL[ex]||"Потерь мяча"; }
/* Разбивка «Разворота» по сторонам — ради неё подсерии и разделены:
   в общем проценте слабая сторона не видна (dupl. bot/insights.py). */
function sidesLine(ex,list,player){
  if(ex!=="E07")return [];
  const parts=E07_SUBS.map(sub=>{
    const t=goalsOf(list.filter(a=>(a.variant||"")===sub.v));
    if(!t.s)return null;
    return `${sub.side} ${pctTxt(t.g,t.s)}${pctTail(ratioRecord(player,ex,S.spec.iso,sub.v))}`;
  }).filter(Boolean);
  return parts.length>1?[parts.join(", ")]:[];
}
// Контроль мяча: записанная оценка (старые записи) или расчёт по потерям.
function controlOf(ex,list){
  const c=list.filter(a=>a.control!==null&&a.control!==undefined).map(a=>a.control);
  if(c.length) return +(c.reduce((x,y)=>x+y,0)/c.length).toFixed(1);
  if(!CONTROL_FROM_LOSSES.has(ex)||!list.length) return null;
  const lost=list.filter(a=>a.lost).length;
  return Math.round(1+4*(list.length-lost)/list.length);
}
function goalsOf(list){ const l=list.filter(a=>(!a.lost||LOST_IS_RESULT.has(a.exercise_id))&&a.shots);
  return {g:l.reduce((s,a)=>s+(a.goals||0),0), s:l.reduce((s,a)=>s+(a.shots||0),0)}; }
function segLabel(ex,a){ const m=SEG_LABELS[ex];
  if(m&&m[a.variant])return m[a.variant];
  if(TIME_QUALITY[ex]==="Скорость"&&a.distance_m)return Math.round(a.distance_m)+" м";
  return (exOf(ex)||{name:ex}).name; }
function pureTimeLines(ex,list,player){
  const groups=[], seen={};
  list.forEach(a=>{const l=segLabel(ex,a);
    if(seen[l]===undefined){seen[l]=groups.length;groups.push([l,[]]);}
    groups[seen[l]][1].push(a);});
  const out=[];
  groups.forEach(([l,g])=>{
    const rec=timeRecord(player,ex,g[0].variant,S.spec.iso);
    const s=statsTxt(g,false,rec);
    if(!s)return;
    out.push(`${l}: ${s}`);
    recordLines(g,rec).forEach(x=>out.push(x));
  });
  return out;
}
function timeGoalChunk(e,list,player){
  const rec=timeRecord(player,list[0].exercise_id,list[0].variant,S.spec.iso);
  const pctRec=ratioRecord(player,list[0].exercise_id,S.spec.iso);
  const lines=[], s=statsTxt(list,true,rec), t=goalsOf(list);
  if(s){ lines.push(s); recordLines(list,rec).forEach(x=>lines.push(x)); }
  if(t.s){ lines.push(`Голы: ${pctTxt(t.g,t.s)}${pctTail(pctRec)}`);
    pctRecordLines(t.g,t.s,pctRec).forEach(x=>lines.push(x)); }
  const lost=list.filter(a=>a.lost).length;
  if(lost>0)lines.push(`Потерь мяча: ${lost}`);
  return {h:e.name,lines};
}
// Чистые удары по воротам: только они идут в «Всего ударов». Единоборства
// тоже кончаются ударом, но упражнение там про обыгрыш и отбор — их процент
// считается своим блоком (dupl. bot/insights.py SHOT_EXERCISES).
const SHOT_EXERCISES=["E10","E10S","E07","E15"];
function shotsTotal(byEx){
  let g=0,s=0;
  SHOT_EXERCISES.forEach(ex=>{ const t=goalsOf(byEx[ex]||[]); g+=t.g; s+=t.s; });
  return {g,s};
}
function shotsChunk(list,total,player){
  const by={}; list.filter(a=>!a.lost).forEach(a=>{const v=a.variant||"";
    by[v]=by[v]||{g:0,s:0,t:[]}; by[v].g+=a.goals||0; by[v].s+=a.shots||0;
    if(a.time_sec!==null)by[v].t.push(a.time_sec);});
  const lines=[];
  E10_SERIES.forEach(([title,subs])=>{
    const parts=subs.filter(([v])=>by[v]).map(([v,cap])=>
      `${cap} ${pctTxt(by[v].g,by[v].s)}${pctTail(ratioRecord(player,"E10",S.spec.iso,v))}`);
    if(!parts.length)return;
    lines.push(`${title}: ${parts.join(", ")}`);
    const t=[].concat(...subs.map(([v])=>(by[v]||{t:[]}).t));
    if(t.length){
      const tr=subs.map(([v])=>timeRecord(player,"E10",v,S.spec.iso)).filter(x=>x!==null);
      const recTxt=tr.length?`, рекорд ${Math.min(...tr).toFixed(2)}`:FIRST_MEASURE;
      lines.push(" ".repeat(title.length+2)+
        `лучшее ${Math.min(...t).toFixed(2)}, среднее ${(t.reduce((x,y)=>x+y,0)/t.length).toFixed(2)}${recTxt}`);
    }
  });
  const rec=ratioRecord(player,"E10",S.spec.iso);
  lines.push(`Всего ударов: ${pctTxt(total.g,total.s)}${pctTail(rec)}`);
  pctRecordLines(total.g,total.s,rec).forEach(x=>lines.push(x));
  return {h:"Удары",lines};
}
function breakawayChunks(list,player){
  const fresh=list.filter(a=>a.variant===E15_FRESH), tired=list.filter(a=>a.variant===E15_TIRED);
  const subs=list.filter(a=>a.variant===E15_SHOTS_A.v);
  const lines=[];
  if(fresh.length){
    const rec=timeRecord(player,"E15",E15_FRESH,S.spec.iso), pctRec=ratioRecord(player,"E15",S.spec.iso);
    const s=statsTxt(fresh,!tired.length,rec), t=goalsOf(fresh);
    if(tired.length){
      if(s){ lines.push(`Свежие: ${s}`); recordLines(fresh,rec).forEach(x=>lines.push(x)); }
      if(t.s)lines.push(`  голы ${pctTxt(t.g,t.s)}${pctTail(pctRec)}`);
    } else {
      if(s){ lines.push(s); recordLines(fresh,rec).forEach(x=>lines.push(x)); }
      if(t.s)lines.push(`Голы: ${pctTxt(t.g,t.s)}${pctTail(pctRec)}`);
    }
  }
  if(tired.length){
    const tt=tired.slice().sort((a,b)=>a.attempt_no-b.attempt_no)
      .filter(a=>a.time_sec!==null&&!a.lost).map(a=>a.time_sec);
    if(tt.length){
      const tr=timeRecord(player,"E15",E15_TIRED,S.spec.iso);
      lines.push("На усталости: "+tt.map(x=>x.toFixed(2)).join(" → ")+
        (tr===null?FIRST_MEASURE:`, рекорд ${tr.toFixed(2)}`));
    }
    if(tt.length>=2){ const d=Math.round((tt[tt.length-1]-tt[0])*100)/100;
      // По старому отрезку дельту не трактуем — ставим пометку.
      const v=oldBreakawayTiming()?E15_OLD_TIMING
        :d<0.3?"способен повторить отрыв":d<=0.6?"на границе"
        :"не способен, ноги не восстанавливаются между всплесками";
      lines.push(`  дельта 1-3: ${d.toFixed(2)} — ${v}`); }
    const t=goalsOf(tired), tRec=ratioRecord(player,"E15",S.spec.iso,E15_TIRED);
    if(t.s){ lines.push(`  голы ${pctTxt(t.g,t.s)}${pctTail(tRec)}`);
      pctRecordLines(t.g,t.s,tRec).forEach(x=>lines.push(x)); }
  }
  const lost=fresh.concat(tired).filter(a=>a.lost).length;
  if(lost>0)lines.push(`Потерь мяча: ${lost}`);
  const out=lines.length?[{h:"Отрыв",lines}]:[];
  // Часть 2 Адриана: удары с места, дистанция названа явно.
  if(subs.length){
    const t=goalsOf(subs), sRec=ratioRecord(player,"E15",S.spec.iso,E15_SHOTS_A.v);
    if(t.s){
      const block=[`${E15_SHOTS_A.name}: ${pctTxt(t.g,t.s)}, `+
        `${E15_SHOTS_A.kind} ${E15_SHOTS_A.range}${pctTail(sRec)}`];
      pctRecordLines(t.g,t.s,sRec).forEach(x=>block.push(x));
      out.push({lines:block});
    }
  }
  return out;
}
function summaryChunks(pl){
  const att=S.attempts.filter(a=>a.player===pl), byEx={};
  att.forEach(a=>{(byEx[a.exercise_id]=byEx[a.exercise_id]||[]).push(a);});
  const order=[]; (S.spec.blocks||[]).forEach(b=>{if(byEx[b[0]]&&order.indexOf(b[0])<0)order.push(b[0]);});
  Object.keys(byEx).forEach(k=>{if(order.indexOf(k)<0)order.push(k);});
  const chunks=[]; let scores=[], q="";
  const flush=()=>{ if(scores.length){chunks.push({lines:scores});scores=[];} };
  for(const ex of order){
    const e=exOf(ex); if(!e)continue;                    // E00, NOTE — не показываем
    const list=byEx[ex];
    if(ex==="E10"){ flush(); q=""; chunks.push(shotsChunk(list,shotsTotal(byEx),pl)); continue; }
    if(ex==="E15"){ flush(); q=""; breakawayChunks(list,pl).forEach(c=>chunks.push(c)); continue; }
    const hasTime=scoringTimes(list).length>0;
    const hasGoals=list.some(a=>a.goals!==null&&a.goals!==undefined&&a.shots);
    if(hasTime&&hasGoals){ flush(); q=""; chunks.push(timeGoalChunk(e,list,pl)); continue; }
    if(hasTime){ flush();
      const lines=pureTimeLines(ex,list,pl); if(!lines.length)continue;
      const qq=TIME_QUALITY[ex]||e.name;
      if(qq===q&&chunks.length) chunks[chunks.length-1].lines.push(...lines);
      else { q=qq; chunks.push({h:qq,lines}); }
      continue; }
    if(hasGoals){ q=""; const t=goalsOf(list), pctRec=ratioRecord(pl,ex,S.spec.iso);
      let line=`${e.name}: ${pctTxt(t.g,t.s)}`;
      const c=controlOf(ex,list);
      if(c!==null)line+=`, контроль ${c}`;
      line+=pctTail(pctRec);
      scores.push(line);
      sidesLine(ex,list,pl).forEach(x=>scores.push(x));
      pctRecordLines(t.g,t.s,pctRec).forEach(x=>scores.push(x));
      const lost=list.filter(a=>a.lost).length;
      if(lost>0)scores.push(`${lostLabel(ex)}: ${lost}`); }
  }
  flush();
  return chunks;
}
function summaryCard(pl){
  const light=isLight(pl)?`<div class="badge">Облегчённый режим</div>`:"";
  const body=summaryChunks(pl).map(c=>
    `<div style="margin:8px 0">${c.h?`<div class="title" style="font-size:18px">${c.h}</div>`:""}
     ${c.lines.map(l=>`<div style="white-space:pre-wrap">${l}</div>`).join("")}</div>`).join("");
  return `<div class="card"><div class="name">${RU[pl]}</div>${light}
    ${body||'<div class="note">Замеров нет.</div>'}</div>`;
}
function finishLater(){clearSession();screenHome();}
function buildPayload(){
  const pending=loadAttempts().filter(a=>!a.uploaded), c=ctx();
  return {records:pending.map(a=>{const{uploaded,...r}=a;return r;}),
    context:{club_days:[...c.club],match_days:[...c.match]}};
}
// Пометить всё выгруженным (после подтверждения приёма ботом) и снять флаг.
function markUploaded(){ const all=loadAttempts();
  all.forEach(a=>{if(!a.uploaded)a.uploaded=true;}); saveAttempts(all);
  localStorage.removeItem("trening_copied"); }
function screenSent(n){
  h(`<h1>Отправлено</h1><div class="card center">
    <div class="big">${n}</div><div style="font-size:22px">записей отправлено</div></div>
    <div class="row"><button class="go" onclick="screenHome()">Готово</button></div>`);
}
function screenCopied(){
  h(`<h1>Скопировано</h1>
    <div class="card"><div style="font-size:21px">Вставь боту в чат одним сообщением
      и отправь.</div></div>
    <div class="row"><button class="go" onclick="screenHome()">Понятно</button></div>`);
}
// Показать текст с автовыделением — последний резерв, если копирование недоступно.
function screenCopyManual(text){
  h(`<h1>Скопируй вручную</h1>
    <div class="note">Выдели весь текст и скопируй, затем вставь боту в чат.</div>
    <textarea id="cptext" readonly style="min-height:180px"></textarea>
    <div class="row"><button class="go" onclick="screenHome()">Готово</button></div>`);
  const ta=document.getElementById("cptext"); if(ta){ta.value=text; ta.focus(); ta.select();}
}
function copyText(text,onOk,onFail){
  // 1) современный API
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(onOk,()=>legacyCopy(text,onOk,onFail));
  } else { legacyCopy(text,onOk,onFail); }
}
function legacyCopy(text,onOk,onFail){
  // 2) скрытый textarea + execCommand
  try{
    const ta=document.createElement("textarea");
    ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.focus(); ta.select();
    const ok=document.execCommand("copy"); ta.remove();
    if(ok) onOk(); else onFail();
  }catch(e){ onFail(); }
}
function uploadAll(){
  const pending=loadAttempts().filter(a=>!a.uploaded);
  if(!pending.length){toast("Нет несинхронизированных записей.");return;}
  const body=JSON.stringify(buildPayload());
  // Тихий резерв: sendData, если он есть и payload помещается в лимит Telegram.
  if(tg&&tg.sendData&&body.length<3800){
    try{ tg.sendData(body); markUploaded(); screenSent(pending.length); return; }catch(_){}
  }
  // Основной путь: копируем весь JSON в буфер. Выгруженным НЕ помечаем —
  // только после подтверждения кнопкой «Отметить выгруженным».
  localStorage.setItem("trening_copied","1");
  copyText(body, screenCopied, ()=>screenCopyManual(body));
}
// Ручная отметка после подтверждения ботом.
function confirmMark(){
  overlay(`<div class="card"><div class="title">Бот подтвердил приём?</div>
    <div class="note">Записи будут помечены как выгруженные.</div>
    <div class="row"><button class="go" onclick="doMark()">Да</button>
      <button class="ghost" onclick="closeOverlay()">Отмена</button></div></div>`);
}
function doMark(){ markUploaded(); closeOverlay(); screenHome(); }

/* ================================================================
   РАСПИСАНИЕ, ИМПОРТ, ПОСЛЕДНЕЕ, СБРОС
   ================================================================ */
function screenWeek(){
  const c=ctx();
  h(`<h1>Расписание на неделю</h1>
    <div class="card"><div class="title">Клубные дни (через запятую)</div>
      <input type="text" id="club" value="${[...c.club].join(", ")}"></div>
    <div class="card"><div class="title">Даты матчей</div>
      <input type="text" id="match" value="${[...c.match].join(", ")}"></div>
    <div class="note">Формат: 2026-08-21, 2026-08-24</div>
    <div class="row"><button class="go" onclick="saveWeek()">Сохранить</button>
      <button class="ghost" onclick="screenHome()">Назад</button></div>`);
}
function saveWeek(){
  const p=id=>document.getElementById(id).value.split(",").map(s=>s.trim()).filter(s=>/^\d{4}-\d{2}-\d{2}$/.test(s));
  localStorage.setItem("trening_ctx",JSON.stringify({club_days:p("club"),match_days:p("match")}));
  screenHome();
}
function screenImport(){
  h(`<h1>Импорт рекордов</h1>
    <div class="note">Вставьте слепок из ответа бота (по игроку). Он показывается на поле в строке «Пред. · рекорд».</div>
    <textarea id="imp" placeholder='{"player":"DANIIL","records":{...}}'></textarea>
    <div class="row"><button class="go" onclick="applyImport()">Сохранить</button>
      <button class="ghost" onclick="screenHome()">Назад</button></div>`);
}
// Вытащить JSON из вставленного текста: всё между первой { и последней }.
// Обёртка ```, строка «Рекорды …» и прочий текст вокруг игнорируются.
function extractJsonBlock(text){
  if(!text) return null;
  const i=text.indexOf("{"), j=text.lastIndexOf("}");
  if(i<0||j<0||j<i) return null;
  return text.slice(i,j+1);
}
function applyImport(){
  try{ const block=extractJsonBlock(document.getElementById("imp").value);
    const o=JSON.parse(block);
    if(!o.player||!o.records)throw 0;
    const r=records(); r[o.player]=o.records;
    localStorage.setItem("trening_records",JSON.stringify(r));
    // Рекорды по проценту попадания приходят тем же слепком (могут и не прийти).
    const p=pctRecords(); p[o.player]=o.pct||{};
    localStorage.setItem("trening_pct",JSON.stringify(p));
    toast("Рекорды "+o.player+" сохранены.");
  }catch(e){toast("Не удалось прочитать слепок.");}
}
function screenLast(){
  const a=loadAttempts(), dates=[...new Set(a.map(x=>x.date))].sort(), last=dates[dates.length-1];
  if(!last){h(`<h1>Последнее занятие</h1><div class="note">Данных нет.</div>
    <div class="row"><button class="go" onclick="screenHome()">Назад</button></div>`);return;}
  const cards=PLAYERS.map(pl=>{
    const list=a.filter(x=>x.date===last&&x.player===pl&&x.time_sec!==null&&!x.lost);
    const byEx={};list.forEach(x=>{(byEx[x.exercise_id]=byEx[x.exercise_id]||[]).push(x.time_sec);});
    const rows=Object.keys(byEx).map(ex=>{const nm=(EX[ex]||{name:ex}).name;
      return `<div>${nm}: ${Math.min(...byEx[ex]).toFixed(2)}</div>`;}).join("");
    return `<div class="card"><div class="name">${RU[pl]}</div>${rows||'<div class="note">—</div>'}</div>`;
  }).join("");
  h(`<h1>Последнее занятие · ${last}</h1>${cards}
    <div class="row"><button class="go" onclick="screenHome()">Назад</button></div>`);
}
function confirmReset(){
  const n=unsynced();
  overlay(`<div class="card"><div class="title">Сбросить все данные?</div>
    <div class="note">Будут удалены все попытки${n>0?` (в т.ч. ${n} невыгруженных)`:""}, рекорды, расписание и незавершённое занятие. Отменить нельзя.</div>
    <div class="row"><button class="warn" onclick="resetData()">Да, стереть</button>
      <button class="ghost" onclick="closeOverlay()">Отмена</button></div></div>`);
}
function resetData(){
  ["trening_attempts","trening_records","trening_ctx","trening_session","trening_hot","trening_copied"].forEach(k=>localStorage.removeItem(k));
  if(sessionTimer){clearInterval(sessionTimer);sessionTimer=null;} S=null;
  closeOverlay(); screenHome();
}

/* ================================================================
   ВОССТАНОВЛЕНИЕ И ЗАПУСК
   ================================================================ */
function boot(){
  if(localStorage.getItem("trening_session")){
    overlay(`<div class="card"><div class="title">Есть незавершённое занятие</div>
      <div class="row"><button class="go" onclick="resume()">Продолжить</button>
        <button class="ghost" onclick="dropSession()">Закрыть</button></div></div>`);
  } else screenHome();
}
function resume(){closeOverlay();S=JSON.parse(localStorage.getItem("trening_session"));
  if(S&&S.steps){S.startMs=performance.now();startSessionClock();resumeStep();}else screenHome();}
/* Возврат в занятие: если упражнение уже шло, продолжаем с той же попытки.
   runStep() запустил бы его заново — тренер переделывал бы серию, а записи
   задвоились бы. */
function resumeStep(){
  const st=S.steps&&S.steps[S.stepIndex];
  if(st&&st.kind==="work"){
    if(S.measure&&S.measure.ex===st.ex&&S.measure.pos<S.measure.order.length)
      return measureAdvance();
    if(S.ctrl&&S.ctrl.ex===st.ex) return ctrlAdvance();
    if(S.duelrun&&S.duelrun.ex===st.ex) return duelRunAdvance();
    if(S.shots&&S.shots.ex===st.ex) return shotsRender();
    if(S.four&&st.ex==="E10") return fourEnter();
  }
  runStep();
}
function dropSession(){closeOverlay();clearSession();screenHome();}

if('serviceWorker' in navigator){
  // Адрес регистрации версионный (./sw.js?v=BUILD): при деплое меняется сам
  // URL скрипта, поэтому браузер обязан сходить за ним на сервер, даже если
  // старый sw.js ещё лежит у него в HTTP-кэше. updateViaCache:'none' — то же
  // самое для последующих проверок обновления.
  const hadController=!!navigator.serviceWorker.controller;
  let reloadedForUpdate=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    // Управление перехватила новая сборка. Перезагружаем страницу, иначе на
    // экране осталась бы старая оболочка. НИКОГДА посреди занятия: там идёт
    // секундомер — незаконченное занятие обновится при следующем открытии.
    if(!hadController||reloadedForUpdate)return;
    if(localStorage.getItem("trening_session"))return;
    reloadedForUpdate=true; location.reload();
  });
  window.addEventListener('load',()=>navigator.serviceWorker
    .register('./sw.js?v='+BUILD,{updateViaCache:'none'})
    .then(r=>r.update().catch(()=>{})).catch(()=>{}));
}
boot();
