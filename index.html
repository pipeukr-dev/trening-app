<!DOCTYPE html>

<head>

<title>Тренировка</title>
<style>
/* Высокий контраст: тёмный текст на светлом фоне, читается на солнце. */
:root{
  --bg:#f7f3e8; --fg:#141414; --muted:#555; --line:#c9c2ad;
  --btn:#141414; --btn-fg:#fff; --accent:#0a6b2e; --warn:#a11; --card:#fff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);
  font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;
  font-size:19px;line-height:1.35;-webkit-user-select:none;user-select:none}
#app{max-width:540px;margin:0 auto;padding:14px 14px 24px;min-height:100vh;
  display:flex;flex-direction:column}
h1{font-size:23px;margin:.2em 0}
.title{font-weight:800;font-size:21px}
.sub{color:var(--muted);font-size:16px}
.hr{border:0;border-top:2px solid var(--line);margin:9px 0}
.big{font-size:46px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums}
/* Последние 10 секунд отдыха: цифры на весь экран, размер как у секундомера. */
.cd10{font-size:96px;line-height:1.05;font-weight:800;text-align:center;

button.ghost{background:transparent;color:var(--fg)}
button.warn{background:var(--warn);border-color:var(--warn)}
button.go{background:var(--accent);border-color:var(--accent)}
button.small{min-height:46px;font-size:16px}
button:disabled{opacity:.4}
.row{display:flex;gap:8px;margin-top:10px}
.card{background:var(--card);border:2px solid var(--line);border-radius:12px;
  padding:12px;margin:8px 0}
.center{text-align:center}
.name{font-size:30px;font-weight:800;letter-spacing:1px}
.tap{display:flex;flex-direction:column;align-items:center;justify-content:center;

.tap .num{font-size:60px;font-weight:800;font-variant-numeric:tabular-nums}

  align-items:center;justify-content:center;padding:16px;z-index:50}
.overlay .card{max-width:480px;width:100%;max-height:90vh;overflow-y:auto}
.note{color:var(--muted);font-size:15px}
.badge{display:inline-block;background:#141414;color:#fff;border-radius:8px;

.blk{margin:8px 0}

.blk.look .h{color:#0a4f6b}.blk.err .h{color:var(--warn)}

ol{margin:6px 0 6px 22px;padding:0}li{margin:3px 0}

input[type=text]{font-size:24px;width:100%;padding:10px;border:2px solid var(--btn);

<body>
<div id="app"></div>
<script>
"use strict";
/* Метка сборки: дата, время и хэш содержимого. deploy.sh заменяет всю
   строку целиком (якорь — начало строки «const BUILD = ») тем же значением,
   что попадает в имя кэша sw.js и в адрес его регистрации ./sw.js?v=BUILD.
   Локально остаётся 'dev'. Показывается внизу главного экрана — по ней
   сразу видно, какая версия загружена на телефоне. */
const BUILD = '20260807-1507-c436fb8';
function buildLabel(){
  const m=/^(\d{4})(\d{2})(\d{2})-(\d{2})(\d{2})-(.+)$/.exec(BUILD);
  return m?`Сборка ${m[3]}.${m[2]}.${m[1]} ${m[4]}:${m[5]} · ${m[6]}`:`Сборка ${BUILD}`;
}
/* ================================================================
   ТРЕНИРОВКА БРАТЬЕВ — автономное Mini App (v2).
   Приложение ведёт человека, который видит упражнение впервые:
   сколько фишек, на каком расстоянии, где стоит тренер, что делать
   по шагам. Коды упражнений тренеру НЕ показываются — только в данных.

   Перед каждым упражнением — ТРИ экрана: Расстановка → Что делать →
   Работа. Пробных попыток нет. Занятие идёт офлайн, копится в
   localStorage, вечером — [Выгрузить] боту (файлом).

   ГЛАВНОЕ ПРАВИЛО: братья не сравниваются. Один выполняет → тренер
   записал → потом второй. Итоги — отдельными карточками. Имена рядом
   только на экране самочувствия (это ввод, не вывод).
   ================================================================ */
const tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
if (tg) { try { tg.ready(); tg.expand(); } catch(e){} }

const PLAYERS = ["DANIIL","ADRIAN"];
const RU = {DANIIL:"ДАНИИЛ", ADRIAN:"АДРИАН"};
// Упражнения с мячом, где возможна потеря мяча (кнопка на экране замера).
const LOST_EXERCISES = new Set(["E04","E05","E15","E10S"]);
// Каноническое число повторов на игрока (dupl. bot/catalog.py REP_COUNTS).
// E15 — часть 1 (5 обоим) плюс часть 2 (Даниил 3).
const REPS={E01:{DANIIL:6,ADRIAN:5},E02:{DANIIL:6,ADRIAN:5},E04:{DANIIL:6,ADRIAN:6},
  E05:{DANIIL:6,ADRIAN:6},E06:{DANIIL:5,ADRIAN:5},E07:{DANIIL:10,ADRIAN:10},
  E10S:{DANIIL:10,ADRIAN:10},E15:{DANIIL:8,ADRIAN:5},
  E08_D:{DANIIL:5},E08_A:{ADRIAN:5}};
// «Отрыв» (E15): два режима подряд. Часть 2 — без стоп-правила.
const E15_FRESH="fresh", E15_TIRED="tired";
// Часть 2 Адриана: 10 ударов С МЕСТА (мяч лежит, ведения нет) с ближней
// дистанции, учёт одним числом из 10 (dupl. bot/catalog.py).
const E15_SHOTS_A={v:"tired_shots",name:"Удары с места",kind:"ближняя",
  shots:10,dist:13,range:"11-14 м"};
// Секундомер «Отрыва»: пуск — СТАРТ ИГРОКА, стоп — удар (dupl. bot/catalog.py).
// В замер входит весь рывок: реакция на пас, догон мяча, приём, ведение, удар.
// Замеры ДО 2026-08-07 мерили другой отрезок (от касания мяча) и с новыми
// НЕСРАВНИМЫ: тот отрезок был непостоянным и давал 2.94 с на 36 м.
const E15_WATCH_RULE="Пуск — когда он стартовал. Стоп — удар.";
// Замеры по эту дату включительно — старого формата (dupl. bot/catalog.py).
const E15_TIMING_CHANGED="2026-08-07";
const E15_OLD_TIMING="старый формат замера";
function oldBreakawayTiming(){ return (S&&S.spec?S.spec.iso:"")<=E15_TIMING_CHANGED; }
// Подсерии «Ударов» (E10): 9 × 5 = 45 ударов на игрока (dupl. bot/catalog.py).
const E10_SUB=[
  {v:"s1_near",series:1,kind:"ближняя",timed:false,dist:{DANIIL:15,ADRIAN:13}},
  {v:"s1_far",series:1,kind:"дальняя",timed:false,dist:{DANIIL:22,ADRIAN:16}},
  {v:"s2_near",series:2,kind:"ближняя",timed:false,dist:{DANIIL:15,ADRIAN:13}},
  {v:"s2_far",series:2,kind:"дальняя",timed:false,dist:{DANIIL:22,ADRIAN:16}},
  {v:"s3_right",series:3,kind:"справа",timed:false,dist:{DANIIL:10,ADRIAN:8}},
  {v:"s3_left",series:3,kind:"слева",timed:false,dist:{DANIIL:10,ADRIAN:8}},
  {v:"s4_left",series:4,kind:"слева",timed:true,dist:{DANIIL:17,ADRIAN:13}},
  {v:"s4_center",series:4,kind:"центр",timed:true,dist:{DANIIL:17,ADRIAN:13}},
  {v:"s4_right",series:4,kind:"справа",timed:true,dist:{DANIIL:17,ADRIAN:13}},
];

/* ---------- Звук и вибрация ---------- */
function soundOn(){ return localStorage.getItem("trening_sound")!=="off"; }
function toggleSound(){ localStorage.setItem("trening_sound", soundOn()?"off":"on"); screenHome(); }
function tone(ms,freq){
  if(!soundOn()) return;
  try{
    const A=window.AudioContext||window.webkitAudioContext; const a=new A();
    const o=a.createOscillator(), g=a.createGain();
    o.connect(g); g.connect(a.destination);
    o.type="sine"; o.frequency.value=freq; g.gain.value=0.25;
    o.start(); setTimeout(()=>{o.stop(); a.close();},ms);
  }catch(e){}
}
function beep(){ tone(180,880); }        // короткий: 3, 2, 1
function beepLong(){ tone(700,660); }    // длинный: ноль, можно давать старт
// Вибрация НЕ зависит от звука: при выключенном звуке остаётся она.
function buzz(ms){ if(navigator.vibrate){ try{navigator.vibrate(ms||200);}catch(e){} } }
function signal(){ beep(); buzz(200); }

/* ---------- Отсчёт последних 10 секунд отдыха ----------
   Один механизм на все экраны отдыха: между повторами, между упражнениями,
   в паузах. Пока секунд больше десяти — обычная строка «N сек»; последние
   десять — цифры на весь экран, бип на 3, 2, 1 и длинный на нуле, вибрация
   на каждой из последних трёх. Тренер не считает в уме. */
let cdTimer=null;
function stopCountdown(){ if(cdTimer){clearInterval(cdTimer);cdTimer=null;} }
function countdownTo(targetMs,elId,onDone){
  stopCountdown();
  let last=null, fired=false;
  const tick=()=>{
    const el=document.getElementById(elId);
    if(!el){ stopCountdown(); return; }
    const remain=targetMs-Date.now();
    const secs=Math.max(0,Math.ceil(remain/1000));
    if(secs<=10){ el.className="cd10"+(secs<=3?" hot":""); el.textContent=secs; }
    else { el.className="big"; el.textContent=secs+" сек"; }
    if(secs!==last){
      if(secs===3||secs===2||secs===1){ beep(); buzz(200); }
      else if(secs===0){ beepLong(); }
      last=secs;
    }
    if(remain<=0&&!fired){ fired=true; stopCountdown(); if(onDone)onDone(); }
  };
  tick(); cdTimer=setInterval(tick,200);
}

/* ---------- Часы и абсолютное время ---------- */
function hhmm(dt){ return String(dt.getHours()).padStart(2,"0")+":"+String(dt.getMinutes()).padStart(2,"0"); }
function hhmmss(dt){ return hhmm(dt)+":"+String(dt.getSeconds()).padStart(2,"0"); }

/* ================================================================
   КАЛЕНДАРЬ (зеркалит bot/schedule.py)
   ================================================================ */
const P1_START="2026-08-03", P1_END="2026-08-19";
const P2_START="2026-08-20", P2_END="2026-09-10";
const CONTROL_DAYS={"2026-08-03":1,"2026-08-14":2,"2026-09-09":3};
const TAPER_SHORT="2026-08-19", TAPER_WEEK_START="2026-08-17";
const WD=["MON","TUE","WED","THU","FRI","SAT","SUN"];
const WD_RU=["понедельник","вторник","среда","четверг","пятница","суббота","воскресенье"];
// Разминка/заминка/пауза (минут) — каркас. Длительность дня вычисляется:
// разминка + Σблоки + паузы(по числу блоков) + заминка.
const WARMUP_MIN={1:15,2:12}, COOLDOWN_MIN={1:5,2:4}, PAUSE_MIN=1;
function sessionMinutes(phase,blocks){
  return WARMUP_MIN[phase]+blocks.reduce((a,b)=>a+b[1],0)+blocks.length*PAUSE_MIN+COOLDOWN_MIN[phase];
}
// Матрица Фазы 1: [цель, [[код, минут-блока]...]] (минуты дня — из sessionMinutes)
// Минуты E13 учитывают отдых 1 мин между приёмами (см. bot/schedule.py).
const P1_MATRIX={
  MON:["Скорость и первый шаг",[["E01",14],["E02",15],["E13",16],["E12",9],["E10S",9]]],
  TUE:["Дриблинг и быстрые ноги",[["E04",15],["E05",15],["E14",14],["E10S",12]]],
  WED:["Смена направления",[["E06",12],["E13",22],["E14",14],["E12",12]]],
  THU:["Контроль и завершение",[["E07",19],["E10",45],["E13",10]]],
  FRI:["Отрыв",[["E15",38],["E13",18]]],
};
// Фаза 2 — два блока, короткое занятие (35 мин).
const P2_TYPES={
  S:["Скорость",[["E01",10],["E02",7]]],
  B:["Мяч",[["E04",10],["E10S",7]]],
  D:["Единоборство",[["E13",10],["E12",7]]],
};
function isoToDate(s){const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);}
function dateToIso(dt){return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");}
function addDays(iso,n){const dt=isoToDate(iso);dt.setDate(dt.getDate()+n);return dateToIso(dt);}
function wdOf(iso){return (isoToDate(iso).getDay()+6)%7;}
function weekOfP1(iso){return Math.floor((isoToDate(iso)-isoToDate(P1_START))/86400000/7)+1;}
function ctx(){const raw=localStorage.getItem("trening_ctx");
  const o=raw?JSON.parse(raw):{club_days:[],match_days:[]};
  return {club:new Set(o.club_days||[]),match:new Set(o.match_days||[])};}
function rule5(iso,c){
  if(c.club.has(iso)||c.match.has(iso))return false;
  if(c.match.has(addDays(iso,1)))return false;
  if(c.match.has(addDays(iso,-1)))return false;
  if(c.club.has(addDays(iso,-1))&&c.club.has(addDays(iso,-2)))return false;
  return true;}
function phase2Type(iso,c){
  let alt=0,cur=P2_START; while(cur<iso){if(rule5(cur,c))alt++;cur=addDays(cur,1);}
  if(c.club.has(iso))return[null,"Сегодня клубная тренировка. Утреннего занятия нет."];
  if(c.match.has(iso))return[null,"Сегодня матч. Занятия нет."];
  if(c.match.has(addDays(iso,1)))return[null,"Завтра матч. Занятия нет."];
  if(c.match.has(addDays(iso,-1)))return["B","Вчера был матч — тип Мяч."];
  if(c.club.has(addDays(iso,-1))&&c.club.has(addDays(iso,-2)))return["B","Два клубных дня подряд — тип Мяч."];
  return[(alt%2===0)?"S":"D","Чередование скорость/единоборство."];
}
function noDay(iso,phase,reason){return {iso,phase,week:null,code:WD[wdOf(iso)],day_code:"",
  goal:"",minutes:0,has:false,control:false,type:null,blocks:[],shortened:false,reason};}
function determineDay(iso){
  const wd=wdOf(iso),code=WD[wd];
  if(CONTROL_DAYS[iso]!==undefined){
    const ph=iso<=P1_END?1:2, blocks=[["E01",12],["E02",12],["E08",13]];
    return {iso,phase:ph,week:iso<=P1_END?weekOfP1(iso):null,code,
      day_code:"CTRL_"+CONTROL_DAYS[iso],goal:"Контрольный замер",
      minutes:sessionMinutes(ph,blocks),has:true,
      control:true,type:null,blocks,shortened:false,
      reason:"Контрольный день: тест, не тренировка."};
  }
  if(iso>=P1_START&&iso<=P1_END){
    if(!P1_MATRIX[code])return noDay(iso,1,"Выходной. В Фазе 1 занятия только Пн-Пт.");
    const w=weekOfP1(iso),[goal,blocks]=P1_MATRIX[code];
    if(iso===TAPER_SHORT){const tb=[["E01",10],["E10S",8]];
      return {iso,phase:1,week:w,code,day_code:"P1_W"+w+"_"+code,
      goal:"Подводка: старты + удары",minutes:sessionMinutes(1,tb),has:true,control:false,type:null,
      blocks:tb,shortened:true,reason:"Подводка перед Фазой 2."};}
    const short=iso>=TAPER_WEEK_START, bl=blocks.map(b=>b.slice());
    return {iso,phase:1,week:w,code,day_code:"P1_W"+w+"_"+code,goal,minutes:sessionMinutes(1,bl),has:true,
      control:false,type:null,blocks:bl,shortened:short,
      reason:short?"Подводка: объём -50%.":""};
  }
  if(iso>=P2_START&&iso<=P2_END){
    const c=ctx(),[t,reason]=phase2Type(iso,c);
    if(!t)return noDay(iso,2,reason);
    const[name,blocks]=P2_TYPES[t], bl=blocks.map(b=>b.slice());
    return {iso,phase:2,week:null,code,day_code:"P2_"+t,goal:name,minutes:sessionMinutes(2,bl),has:true,
      control:false,type:t,blocks:bl,shortened:false,reason};
  }
  return noDay(iso,null,"Дата вне программы лагеря.");
}
// Число приёмов E13 по дню (контроль под опекой).
function e13N(code){return {MON:6,WED:8,THU:4,FRI:5}[code]||5;}
// Фаза-зависимые счётчики: в Фазе 2 объём срезан.
function receptionsFor(spec){return spec.phase===2?5:e13N(spec.code);}
function e10sReps(spec){return spec.phase===2?6:REPS.E10S.DANIIL;}
function duelShotsFor(ex,spec){return (ex==="E12"&&spec.phase===2)?4:EX[ex].shots;}
// Раз в две недели удлинённый третий длинный забег Даниила (E02).
function e02Biweekly(iso){const diff=Math.round((isoToDate(iso)-isoToDate("2026-08-10"))/86400000);
  return diff>=0 && diff%14===0;}

/* ================================================================
   РАЗМЕТКА НА ДЕНЬ — пронумерованный список по порядку выполнения.
   Для КАЖДОГО упражнения дня своя разметка; ничего не пропускается.
   ================================================================ */
const MARKUP_SNIPPET = {
  E01: "Даниил: 2 фишки на 10 м — его коридор.\nАдриан: рядом в 3 м, 2 фишки на 10 м.\nСтарты по очереди, ты на общем финише.",
  E02: "Даниил, одна дорожка: фишки 0 и 20 м — забеги с места; фишки 10 и 35 м — длинные (пуск на 10 м, стоп на 35 м).\nАдриан: фишки 0, 15 и 20 м.\nТы на финише.",
  E04: "8 фишек в линию через 2 м — общая дорожка.\nОт последней фишки: Даниилу 15 м до удара, Адриану 10 м. Ворота.",
  E05: "5 фишек в шахматном порядке:\nДаниилу 5 м вперёд и 3 м вбок, Адриану 4 м вперёд и 2.5 м вбок. Ворота.",

// SVG-схема дня — коридоры для ПН и ПТ Фазы 1 (если есть).
function markupSvg(spec){
  if(spec.phase!==1 || spec.control) return "";
  if(spec.code==="MON")return svg(cone(20,40)+cone(250,40)+dim(25,55,245,"старты 10 м")+
    cone(20,110)+cone(250,110)+dim(25,125,245,"старты 10 м")+lbl(20,90,"3 м")+
    arrow(30,40,240,40)+arrow(30,110,240,110)+mark(258,80,"ТЫ")+lbl(255,95,"финиш"));
  if(spec.code==="FRI")return svg(goal(275,55)+mark(15,60,"Д")+arrow(25,60,270,60)+lbl(80,52,"старт — команда 25 м — удар (~36 м)")+
    mark(15,120,"А")+arrow(25,120,270,120)+lbl(80,112,"старт — команда 18 м — удар (~27 м)"));
  return "";
}
function dayMarkup(spec){
  const items=spec.blocks.map((b,i)=>{
    const ex=b[0], name=(EX[ex]||{name:ex}).name;
    let snip=(MARKUP_SNIPPET[ex]||"по описанию упражнения");
    if(ex==="E13") snip+="\nПриёмов сегодня: "+receptionsFor(spec)+".";
    return `${i+1}. ${name}\n   ${snip.replace(/\n/g,"\n   ")}`;
  });
  return {text:items.join("\n\n"), svg:markupSvg(spec)};
}

function warmupSteps(spec){
  const code=spec.code, phase=spec.phase;
  if(phase===2) // сокращённая разминка Фазы 2, без блока с мячом = 12 мин
    return [WU.leg,WU.joints3,WU.dyn3,WU.acc];       // 3+3+3+3 = 12
  if(code==="MON") return [WU.leg,WU.joints3,WU.dyn3,WU.acc,WU.ball,WU.jump]; // 3+3+3+3+2+1 = 15
  if(code==="TUE") return [WU.leg,WU.joints2,WU.dyn3,WU.acc,WU.ladder];       // 3+2+3+3+4 = 15
  return [WU.leg,WU.joints3,WU.dyn4,WU.acc,WU.ball];                          // 3+3+4+3+2 = 15
}
function cooldownStep(spec){
  const min=spec.phase===2?4:5;
  return {t:"Заминка",min,body:
    (spec.code==="FRI"?"Лёгкий бег 3 минуты.":"Лёгкий бег 2 минуты.")+
    "\nРастяжка по 20 сек: задняя поверхность бедра,\nикры, пах, квадрицепс."};
}

/* ================================================================
   SVG-помощники
   ================================================================ */
function svg(inner){
  return `<svg class="svg" viewBox="0 0 300 170">
   <defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
     <path d="M0,0 L6,3 L0,6 Z" fill="#141414"/></marker></defs>${inner}</svg>`;
}
function cone(x,y){return `<circle cx="${x}" cy="${y}" r="5" fill="none" stroke="#141414" stroke-width="2"/>`;}
function ball(x,y){return `<circle cx="${x}" cy="${y}" r="4" fill="#141414"/>`;}
function lbl(x,y,t){return `<text x="${x}" y="${y}" font-size="12" fill="#141414">${t}</text>`;}
function mark(x,y,t){return `<text x="${x}" y="${y}" font-size="15" font-weight="700" fill="#141414">${t}</text>`;}
function goal(x,y){return `<rect x="${x}" y="${y}" width="7" height="40" fill="none" stroke="#141414" stroke-width="2"/>`;}
function arrow(x1,y1,x2,y2){return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#141414" stroke-width="2" marker-end="url(#ar)"/>`;}
function dim(x1,y,x2,t){return `<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="#888" stroke-width="1"/>`+lbl((x1+x2)/2-10,y-4,t);}

/* ================================================================
   ПОСТРОЕНИЕ ПОВТОРОВ (слоты для измеряемых упражнений)
   ================================================================ */
function slot(player,ex,variant,dist,no,rest,extra){
  return Object.assign({player,ex,variant,dist,attempt_no:no,rest,goal:false,
    firstRest:false},extra||{});
}
function repsFor(code,spec){
  const R={DANIIL:[],ADRIAN:[]}, p2=(spec.phase===2);
  const push=(pl,arr)=>{R[pl]=arr;};
  if(code==="E01"){
    // Фаза 2 режет объём: 4/4 вместо 6/5.
    const dv=p2?[["stance",1],["stance",2],["sit_face",3],["sit_back",4]]
               :[["stance",1],["stance",2],["sit_face",3],["sit_face",4],["lie",5],["sit_back",6]];
    const av=p2?[["stance",1],["stance",2],["sit_back",3],["sit_back",4]]
               :[["stance",1],["stance",2],["sit_back",3],["sit_back",4],["sit_back",5]];
    push("DANIIL",dv.map(([v,n])=>slot("DANIIL","E01",v,10,n,80)));
    push("ADRIAN",av.map(([v,n])=>slot("ADRIAN","E01",v,10,n,80)));
    R.DANIIL[0].firstRest=true; R.ADRIAN[0].firstRest=true;
  } else if(code==="E02"){
    const bw=e02Biweekly(spec.iso);
    if(p2){ // 4/3, без длинных с ходу
      push("DANIIL",[slot("DANIIL","E02","20m",20,1,90),slot("DANIIL","E02","20m",20,2,90),
        slot("DANIIL","E02","25m_fly",35,3,150),slot("DANIIL","E02","25m_fly",35,4,150)]);
      push("ADRIAN",[slot("ADRIAN","E02","15m",15,1,80),slot("ADRIAN","E02","15m",15,2,80),
        slot("ADRIAN","E02","20m",20,3,90)]);
    } else {
      const d=[slot("DANIIL","E02","20m",20,1,90),slot("DANIIL","E02","20m",20,2,90),slot("DANIIL","E02","20m",20,3,90),
        slot("DANIIL","E02","25m_fly",35,4,150),slot("DANIIL","E02","25m_fly",35,5,150),
        slot("DANIIL","E02", bw?"30m_fly":"25m_fly", bw?40:35,6,150)];
      push("DANIIL",d);
      push("ADRIAN",[slot("ADRIAN","E02","15m",15,1,80),slot("ADRIAN","E02","15m",15,2,80),slot("ADRIAN","E02","15m",15,3,80),
        slot("ADRIAN","E02","20m",20,4,90),slot("ADRIAN","E02","20m",20,5,90)]);
    }
  } else if(code==="E06"){
    push("DANIIL",[1,2,3,4,5].map(n=>slot("DANIIL","E06","",5,n,75)));
    push("ADRIAN",[1,2,3,4,5].map(n=>slot("ADRIAN","E06","",4,n,75)));
  } else if(code==="E04"){
    const nn=p2?4:6;  // Фаза 2 — 4 прохода
    push("DANIIL",Array.from({length:nn},(_,i)=>slot("DANIIL","E04","",15,i+1,70,{goal:true})));
    push("ADRIAN",Array.from({length:nn},(_,i)=>slot("ADRIAN","E04","",10,i+1,60,{goal:true})));
  } else if(code==="E05"){
    push("DANIIL",[1,2,3,4,5,6].map(n=>slot("DANIIL","E05","",5,n,70,{goal:true})));
    push("ADRIAN",[1,2,3,4,5,6].map(n=>slot("ADRIAN","E05","",4,n,60,{goal:true})));
  } else if(code==="E10S"){
    const nn=e10sReps(spec);  // Фаза 2 — 6 повторов
    push("DANIIL",Array.from({length:nn},(_,i)=>slot("DANIIL","E10S","",36,i+1,60,{goal:true})));
    push("ADRIAN",Array.from({length:nn},(_,i)=>slot("ADRIAN","E10S","",27,i+1,60,{goal:true})));
  } else if(code==="E15"){
    return e15Slots(E15_FRESH);   // часть 2 строится отдельно, после части 1
  } else if(code==="E08"){
    push("DANIIL",[1,2,3,4,5].map(n=>slot("DANIIL","E08_D","",34,n,90,{goal:true})));
    push("ADRIAN",[1,2,3,4,5].map(n=>slot("ADRIAN","E08_A","",27,n,90,{goal:true})));
  }
  return R;
}
// «Отрыв»: часть 1 — оба по 5 через 2 мин; часть 2 — только Даниил,
// 3 повтора через 90 сек и без стоп-правила (noStop). goal:true в обеих
// частях: каждый повтор кончается ударом, гол пишется по каждому.
function e15Slots(part){
  if(part===E15_TIRED) return {
    DANIIL:[1,2,3].map(n=>slot("DANIIL","E15",E15_TIRED,36,n,90,{goal:true,noStop:true})),
    ADRIAN:[]};
  return {
    DANIIL:[1,2,3,4,5].map(n=>slot("DANIIL","E15",E15_FRESH,36,n,120,{goal:true})),
    ADRIAN:[1,2,3,4,5].map(n=>slot("ADRIAN","E15",E15_FRESH,27,n,120,{goal:true}))};
}

   ================================================================ */
function loadAttempts(){return JSON.parse(localStorage.getItem("trening_attempts")||"[]");}
function saveAttempts(a){localStorage.setItem("trening_attempts",JSON.stringify(a));}
function records(){return JSON.parse(localStorage.getItem("trening_records")||"{}");}
function unsynced(){return loadAttempts().filter(a=>!a.uploaded).length;}
function uuid(){return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{
  const r=Math.random()*16|0,v=c==='x'?r:(r&0x3|0x8);return v.toString(16);});}
function nowIso(){return new Date().toISOString();}
let S=null, sessionTimer=null, lastDrink=0;
function saveSession(){ if(S) localStorage.setItem("trening_session",JSON.stringify(S)); }
function clearSession(){ localStorage.removeItem("trening_session"); S=null;
  if(sessionTimer){clearInterval(sessionTimer);sessionTimer=null;} }
function pushAttempt(o){
  const a=loadAttempts();
  const rec={uuid:uuid(),timestamp:nowIso(),date:S.spec.iso,player:o.player,
    day_code:S.spec.day_code,exercise_id:o.ex||o.exercise_id,variant:o.variant||"",
    attempt_no:o.attempt_no||0,is_warmup:false, // пробных больше нет
    time_sec:(o.time_sec!==undefined&&o.time_sec!==null)?Number(Number(o.time_sec).toFixed(2)):null,
    distance_m:o.dist||o.distance_m||null,control:o.control??null,goals:o.goals??null,
    shots:o.shots??null,wellbeing:o.wellbeing??null,

/* Ручное обновление: если телефон всё же держит старую сборку. Сносит кэши
   и воркер и перезагружает страницу с сервера. Данные занятий лежат в
   localStorage и не трогаются. Только при сети: без неё это оставило бы
   приложение без офлайн-кэша прямо на поле. */
function confirmUpdate(){
  if(navigator.onLine===false){
    return overlay(`<div class="card"><div class="title">Нет сети</div>
      <div class="note">Обновление возможно только с интернетом: без него
      приложение осталось бы без офлайн-кэша.</div>
      <div class="row"><button class="ghost" onclick="closeOverlay()">Понятно</button></div></div>`);
  }
  overlay(`<div class="card"><div class="title">Обновить приложение?</div>
    <div class="note">Сейчас: ${buildLabel()}.<br>Страница перезагрузится с сервера.
    Записи занятий и рекорды сохранятся.</div>
    <div class="row"><button class="go" onclick="forceUpdate()">Обновить</button>
      <button class="ghost" onclick="closeOverlay()">Отмена</button></div></div>`);
}
function forceUpdate(){
  const reload=()=>location.replace(location.pathname+"?u="+Date.now());
  const jobs=[];
  if(window.caches&&caches.keys)
    jobs.push(caches.keys().then(ks=>Promise.all(ks.map(k=>caches.delete(k)))));
  if(navigator.serviceWorker&&navigator.serviceWorker.getRegistrations)
    jobs.push(navigator.serviceWorker.getRegistrations()
      .then(rs=>Promise.all(rs.map(r=>r.unregister()))));
  Promise.all(jobs).then(reload,reload);
}

   ================================================================ */
function buildSteps(){
  const steps=[];
  for(const w of warmupSteps(S.spec)) steps.push({kind:"timer",title:w.t,mins:w.min,body:w.body});
  // Пауза 1 мин ПЕРЕД каждым упражнением (после разминки и между блоками).
  S.spec.blocks.forEach((b,i)=>{
    steps.push({kind:"pause"});
    steps.push({kind:"setup",ex:b[0],mins:b[1]});
    steps.push({kind:"what",ex:b[0]});
    steps.push({kind:"work",ex:b[0],mins:b[1]});
  });
  const cd=cooldownStep(S.spec);
  steps.push({kind:"timer",title:cd.t,mins:cd.min,body:cd.body});
  steps.push({kind:"summary"});
  S.steps=steps; S.stepIndex=0; S.startMs=performance.now();
  startSessionClock(); saveSession(); runStep();
}
function nextStep(){S.stepIndex++;runStep();}
function runStep(){
  saveSession();
  if(S.stepIndex>=S.steps.length)return screenSummary();
  const st=S.steps[S.stepIndex];
  S.block = (st.ex?{ex:st.ex}:S.block);
  if(st.kind==="timer")return screenTimer(st);
  if(st.kind==="pause")return screenPause();
  if(st.kind==="setup")return screenSetup(st);
  if(st.kind==="what")return screenWhat(st);
  if(st.kind==="work")return startWork(st);
  if(st.kind==="summary")return screenSummary();
}

/* ---- Измеряемые упражнения (time / time_goal / breakaway) ---- */
function startMeasure(st,part){
  const e=EX[st.ex];
  const plan=(st.ex==="E15")?e15Slots(part):repsFor(st.ex,S.spec);
  const order=[]; const mx=Math.max(plan.DANIIL.length,plan.ADRIAN.length);
  for(let i=0;i<mx;i++){ if(plan.DANIIL[i])order.push(plan.DANIIL[i]);
    if(plan.ADRIAN[i])order.push(plan.ADRIAN[i]); }
  S.measure={ex:st.ex,type:e.type,part:part||"",order,pos:0,
    stopped:{DANIIL:false,ADRIAN:false},
    best:{DANIIL:null,ADRIAN:null},readyAt:{DANIIL:0,ADRIAN:0},firstDone:{DANIIL:false,ADRIAN:false}};
  saveSession(); measureAdvance();
}
function measureAdvance(){
  const m=S.measure;
  while(m.pos<m.order.length&&m.stopped[m.order[m.pos].player])m.pos++;
  if(m.pos>=m.order.length)return afterMeasure();
  const cur=m.order[m.pos];
  if(cur.firstRest&&!m.firstDone[cur.player]) return screenFullRest(cur);
  const remain=m.readyAt[cur.player]-Date.now();
  if(remain<=10000) return screenStopwatch(cur, remain>0);
  return screenRestWait(cur);
}
function afterMeasure(){
  const m=S.measure;
  // «Отрыв»: часть 1 → часть 2 Даниила → дельта → удары Адриана.
  if(m.ex==="E15"){
    if(m.part===E15_FRESH) return screenBreakawayPart2();
    if(!m.deltaShown){ m.deltaShown=true; return screenBreakawayDelta(); }
    if(!m.adrianDone){ m.adrianDone=true; return e15ShotsPick(); }
  }
  nextStep();
}

function screenBreakawayDelta(){
  const times=S.attempts.filter(a=>a.player==="DANIIL"&&a.exercise_id==="E15"
      &&a.variant===E15_TIRED&&a.time_sec!==null&&!a.lost)
    .sort((a,b)=>a.attempt_no-b.attempt_no).map(a=>a.time_sec);
  const d=times.length>=2?Math.round((times[times.length-1]-times[0])*100)/100:null;
  let verdict="";
  if(d!==null) verdict = oldBreakawayTiming()
    ? "Старый формат замера: дельта не оценивается."
    : d<0.3?"Способен повторить отрыв."

function screenRestWait(cur){

function skipRest(){ if(S._restTimer){clearInterval(S._restTimer);S._restTimer=null;}

function screenStopwatch(cur,ready10){
  const m=S.measure, e=EX[cur.ex];
  const forPlayer=m.order.filter(o=>o.player===cur.player);
  const idx=m.order.slice(0,m.pos+1).filter(o=>o.player===cur.player).length;

  for(let k=m.pos+1;k<m.order.length;k++){ if(!m.stopped[m.order[k].player]){
    nextInfo="Далее: "+RU[m.order[k].player]; break; } }
  const prev=prevToday(cur.player,cur.ex,cur.variant), rec=recordFor(cur.player,cur.ex,cur.variant);
  const recLine=(prev!==null||rec!==null)?`Пред. ${prev!==null?prev.toFixed(2):"—"} · рекорд ${rec!==null?rec.toFixed(2):"—"}`:"";
  h(`${ready10?`<div class="warnbox center">ГОТОВНОСТЬ<div id="rc10"></div></div>`:""}
    <div class="title">${e.name}</div><div class="hr"></div>

    <div class="tap" id="tap" onclick="tapWatch()">
      <div class="name">${RU[cur.player]}</div>
      <div class="note">попытка ${idx} из ${total}${variantLine?" · "+variantLine:""}</div>
      <div class="num" id="num">0.00</div>
      <div class="note" id="hint">тап = старт</div></div>
    <div class="note">${recLine}</div>
    <div class="note">${nextInfo}</div>
    <div class="row">
      <button class="ghost small" onclick="notMeasured()">Не засёк</button>
      ${LOST_EXERCISES.has(cur.ex)?`<button class="warn small" onclick="lostBall()">Потерял мяч</button>`:""}
      <button class="ghost small" onclick="measureBack()">Назад</button></div>
    <div class="row"><button class="ghost small" onclick="manualEntry()">Ручной ввод</button></div>
    ${smallActions()}`);
  // Последние секунды отдыха отсчитываются вслух и цифрами на весь экран.
  if(ready10) countdownTo(m.readyAt[cur.player],"rc10");
  S.watch={running:false,t0:0,cur};
}
function variantLabel(cur){
  const V={stance:"стойка",sit_face:"сидя лицом",sit_back:"сидя спиной",lie:"лёжа",
    spin:"спиной",side:"боком","20m":"20 м","15m":"15 м","25m_fly":"замер 25 м с ходу","30m_fly":"замер 30 м с ходу",
    fresh:"часть 1 · свежие",tired:"часть 2 · на усталости"};
  if(cur.variant&&V[cur.variant])return V[cur.variant];
  if(cur.dist)return cur.dist+" м";
  return "";
}
function tapWatch(){
  const w=S.watch;
  if(!w.running){w.running=true;w.t0=performance.now();
    document.getElementById("tap").classList.add("run");
    document.getElementById("hint").textContent="тап = стоп";
    const loop=()=>{const el=document.getElementById("num");if(!el||!w.running)return;
      el.textContent=((performance.now()-w.t0)/1000).toFixed(2);w.raf=requestAnimationFrame(loop);};
    w.raf=requestAnimationFrame(loop);
  } else {
    w.running=false; if(w.raf)cancelAnimationFrame(w.raf);
    recordTime((performance.now()-w.t0)/1000);
  }
}
function notMeasured(){recordTime(null,true);}
function manualEntry(){overlay(`<div class="card"><div class="title">Ручной ввод (2.06 / 2,06 / 206)</div>
  <input type="text" id="mv" inputmode="decimal">
  <div class="row"><button class="go" onclick="applyManual()">Ок</button>
   <button class="ghost" onclick="closeOverlay()">Отмена</button></div></div>`);}
function parseTime(s){s=(s||"").trim().replace(",",".");if(!s)return null;
  let v=parseFloat(s); if(s.indexOf(".")<0&&v>=100)v=v/100; return isNaN(v)?null:v;}
function applyManual(){const v=parseTime(document.getElementById("mv").value);closeOverlay();recordTime(v);}
function measureBack(){const m=S.measure;
  if(m.pos>0){ const last=S.attempts[S.attempts.length-1];
    if(last){const a=loadAttempts();a.pop();saveAttempts(a);S.attempts.pop();}
    m.pos--; }
  measureAdvance();}

function recordTime(t,nm){
  const m=S.measure, cur=m.order[m.pos];
  pushAttempt({player:cur.player,ex:cur.ex,variant:cur.variant,attempt_no:cur.attempt_no,
    time_sec:t,dist:cur.dist,note:nm?"не засечено":""});
  // Гол за попытку спрашиваем по флагу слота, а не по типу упражнения:
  // «Отрыв» — свой тип (breakaway), но гол в нём тоже пишется.
  if(cur.goal && t!==null){ return screenGoalAsk(cur,t); }
  finalizeTime(cur,t);
}
// Потеря мяча: если секундомер идёт — фиксируем текущее время, иначе без времени.
// Попытка помечается lost=true и не влияет на лучшее/среднее/разброс/стоп-правило.
function lostBall(){
  const w=S.watch, m=S.measure, cur=m.order[m.pos];
  let t=null;
  if(w&&w.running){ w.running=false; if(w.raf)cancelAnimationFrame(w.raf);
    t=(performance.now()-w.t0)/1000; }
  pushAttempt({player:cur.player,ex:cur.ex,variant:cur.variant,attempt_no:cur.attempt_no,
    time_sec:t,dist:cur.dist,lost:true,note:"потеря мяча"});
  // Ни стоп-правила, ни экрана гола: потеря — это отсутствие завершения.
  m.readyAt[cur.player]=Date.now()+(cur.rest||60)*1000;
  m.pos++; saveSession(); measureAdvance();
}
function screenGoalAsk(cur,t){
  h(`<h1>Гол?</h1>
    <div class="card center">
      <div style="font-size:24px;font-weight:800">${RU[cur.player]} · ${t.toFixed(2)} · Гол?</div></div>
    <div class="row"><button class="go" onclick="setGoal(true)">⚽ ДА</button>
      <button class="warn" onclick="setGoal(false)">✕ НЕТ</button></div>`);

function setGoal(g){
  const m=S.measure, cur=m.order[m.pos];
  const a=S.attempts[S.attempts.length-1]; a.goals=g?1:0; a.shots=1;
  const all=loadAttempts(); const ix=all.findIndex(x=>x.uuid===a.uuid);
  if(ix>=0){all[ix].goals=a.goals;all[ix].shots=a.shots;saveAttempts(all);}
  saveSession();
  finalizeTime(cur, a.time_sec);
}
function finalizeTime(cur,t){
  const m=S.measure;
  // Стоп-правило: только там, где задан порог, и не в части 2 «Отрыва»
  // (slot с noStop) — там падение времени и есть измеряемая величина.
  const th=cur.noStop?null:EX[cur.ex].stopT;
  if(t!==null && th){
    const b=m.best[cur.player];
    if(b!==null && Math.round((t-b)*100)/100>=th) return screenStopRule(cur,b,t);
    m.best[cur.player]=(b===null)?t:Math.min(b,t);
  } else if(t!==null){
    const b=m.best[cur.player]; m.best[cur.player]=(b===null)?t:Math.min(b,t);
  }
  m.readyAt[cur.player]=Date.now()+ (cur.rest||60)*1000;
  m.pos++; saveSession(); measureAdvance();
}
function screenStopRule(cur,best,t){
  h(`<h1>Стоп-правило</h1>
    <div class="card center"><div class="name">${RU[cur.player]}</div>

      <div class="note">Последняя ${t.toFixed(2)} — падение ${(t-best).toFixed(2)}.</div></div>
    <div class="row"><button class="go" onclick="stopSeries('${cur.player}')">Завершить</button>
      <button class="ghost" onclick="continueSeries()">Ещё один</button></div>`);
}
function stopSeries(pl){const m=S.measure;m.stopped[pl]=true;m.pos++;measureAdvance();}
function continueSeries(){const m=S.measure,cur=m.order[m.pos];
  const t=S.attempts[S.attempts.length-1].time_sec;
  m.best[cur.player]=Math.min(m.best[cur.player]??Infinity,t);
  m.readyAt[cur.player]=Date.now()+(cur.rest||60)*1000; m.pos++; measureAdvance();}

/* ---- shots: «забил из N» — общий экран счёта (сейчас только E07) ---- */

/* ---- control: контроль 1-5 + голы из N (E13) ---- */
/* Приём под опекой: сначала сами приёмы с отдыхом, потом ввод результата.
   Отдых между СВОИМИ приёмами — минута. Братья чередуются, поэтому часть
   минуты набегает сама, пока принимает второй: ждём только остаток до
   готовности, лишнего экрана на полную минуту не появляется. */
const E13_REST_SEC=60;
function workControl(st){
  const N=receptionsFor(S.spec);
  const order=[];
  for(let i=1;i<=N;i++) for(const pl of PLAYERS) order.push({player:pl,no:i});
  S.ctrl={ex:st.ex,player:"DANIIL",N,stage:"reps",pos:0,order,
          readyAt:{DANIIL:0,ADRIAN:0}};
  ctrlAdvance();
}
function ctrlAdvance(){
  const c=S.ctrl;
  if(c.pos>=c.order.length){        // приёмы кончились — вводим результат
    c.stage="c"; c.player="DANIIL"; saveSession(); return ctrlRender();
  }
  const cur=c.order[c.pos];
  return (c.readyAt[cur.player]-Date.now()>0)?ctrlRest(cur):ctrlRep(cur);
}
function ctrlRep(cur){
  const c=S.ctrl;
  h(`${countHeader(cur.player,"Приём под опекой",c.N,"приёмов")}
    <div class="title">Приём ${cur.no} из ${c.N}</div>
    <div class="note">Вариант объявляешь вслух до паса. Между своими приёмами
    ${E13_REST_SEC} секунд отдыха — приложение следит.</div>
    <div class="row"><button class="go" onclick="ctrlRepDone()">Принял</button></div>
    ${smallActions()}`);
}
function ctrlRepDone(){
  const c=S.ctrl, cur=c.order[c.pos];
  c.readyAt[cur.player]=Date.now()+E13_REST_SEC*1000;
  c.pos++; saveSession(); ctrlAdvance();
}
function ctrlRest(cur){
  const c=S.ctrl, target=c.readyAt[cur.player];
  h(`<h1>Отдых</h1>
    <div class="card center"><div class="sub">следующий</div>
      <div class="name">${RU[cur.player]}</div>

      <div class="big" id="rc"></div></div>
    <div class="row"><button class="ghost" onclick="ctrlSkipRest()">Пропустить отдых</button></div>
    ${smallActions()}`);
  countdownTo(target,"rc",()=>ctrlAdvance());
}
function ctrlSkipRest(){ stopCountdown();
  const c=S.ctrl; c.readyAt[c.order[c.pos].player]=Date.now(); ctrlAdvance(); }
function ctrlRender(){
  const c=S.ctrl;
  const head=countHeader(c.player,"Приём под опекой",c.N,"приёмов");
  if(c.stage==="c"){
    h(`${head}
      <div class="title">Контроль мяча под давлением</div>
      <div class="note">1 — терял · 5 — держал уверенно</div>
      <div class="grid5">${[1,2,3,4,5].map(v=>`<button onclick="ctrlC(${v})">${v}</button>`).join("")}</div>
      ${smallActions()}`);
  } else {
    h(`${head}
      <div class="title">Сколько забил из ${c.N}?</div>

      ${smallActions()}`);

}
function ctrlC(v){S.ctrl._c=v;S.ctrl.stage="g";ctrlRender();}
function ctrlG(g){const c=S.ctrl;
  pushAttempt({player:c.player,ex:c.ex,control:c._c,goals:g,shots:c.N});
  if(c.player==="DANIIL"){c.player="ADRIAN";c.stage="c";delete c._c;return ctrlRender();}

}

/* ---- Удары (E10): 4 серии по подсериям, 45 ударов на игрока ---- */
const E10_SERIES_NAME={1:"Удары с места",2:"Удары после приёма",3:"Удары с фланга",4:"Рывок на пас"};
function e10subs(series){return E10_SUB.filter(s=>s.series===series);}
function workFour(st){ S.four={series:1,player:"DANIIL",queue:null,pos:0}; fourEnter(); }
// Вход в (серия, игрок): экран выбора первой подсерии.
function fourEnter(){
  const f=S.four, subs=e10subs(f.series);
  h(`<h1>${E10_SERIES_NAME[f.series]} · ${RU[f.player]}</h1>
    <div class="reps">Серия ${f.series}/4. Выбери подсерию — дальше приложение ведёт само.</div>
    <div class="row">${subs.map(s=>`<button class="go" onclick="fourPick('${s.v}')">${s.kind} ${s.dist[f.player]} м</button>`).join("")}</div>
    ${smallActions()}`);
}
function fourPick(v){
  const f=S.four, subs=e10subs(f.series).map(s=>s.v);
  f.queue=[v,...subs.filter(x=>x!==v)]; f.pos=0; fourRunSub();
}
function fourRunSub(){
  const f=S.four;
  if(f.pos>=f.queue.length){ // игрок закончил серию
    if(f.player==="DANIIL"){f.player="ADRIAN";f.queue=null;f.pos=0;return fourEnter();}
    // оба закончили серию
    if(f.series<4){f.series++;f.player="DANIIL";f.queue=null;f.pos=0;return fourSeriesBreak();}
    delete S.four; return nextStep();
  }
  const sub=E10_SUB.find(s=>s.v===f.queue[f.pos]);
  if(sub.timed){ f.rush={sub,shot:1}; fourRushWatch(); }
  else fourAggShot(sub);
}
function fourSeriesBreak(){
  h(`<h1>Смена постановки</h1>
    <div class="card center"><div class="title">Серия ${S.four.series}/4</div>
      <div style="font-size:20px;margin-top:8px">${E10_SERIES_NAME[S.four.series]}. Переставь фишки.</div></div>
    <div class="row"><button class="go" onclick="fourEnter()">Готово</button></div>`);
}
// Подсерия без замера (серии 1-3): экран удара → учёт голов из 5.
function fourAggShot(sub){
  const f=S.four, d=sub.dist[f.player];
  h(`${countHeader(f.player,E10_SERIES_NAME[f.series],5,"ударов")}
    <div class="title">${sub.kind} · ${d} м</div>
    <div class="note">5 ударов подряд, затем введи, сколько забил.</div>
    <div class="row"><button class="go" onclick="fourAggGoals('${sub.v}')">Ввести голы</button></div>
    ${smallActions()}`);
}
function fourAggGoals(v){
  const f=S.four, sub=E10_SUB.find(s=>s.v===v), d=sub.dist[f.player];
  h(`${countHeader(f.player,E10_SERIES_NAME[f.series]+" · "+sub.kind+" "+d+" м",5,"ударов")}
    <div class="title">Сколько забил из 5?</div>
    <div class="gridN">${Array.from({length:6},(_,i)=>`<button onclick="fourAggSave('${v}',${i})">${i}</button>`).join("")}</div>
    ${smallActions()}`);
}
function fourAggSave(v,goals){
  const f=S.four, sub=E10_SUB.find(s=>s.v===v);
  pushAttempt({player:f.player,ex:"E10",variant:v,attempt_no:f.pos+1,
    goals,shots:5,dist:sub.dist[f.player]});
  f.pos++; fourRunSub();
}
// Серия 4: 5 рывков, каждый с секундомером, гол и отдыхом 25 сек.
function fourRushWatch(){
  const f=S.four, sub=f.rush.sub, d=sub.dist[f.player];
  h(`${countHeader(f.player,"Рывок · "+sub.kind,5,"рывков")}
    <div class="note">Удар ${f.rush.shot} из 5 · удар с ${d} м · угол называешь в момент паса</div>
    <div class="tap" id="tap" onclick="fourRushTap()">
      <div class="num" id="num">0.00</div><div class="note" id="hint">тап = старт (пас)</div></div>
    ${smallActions()}`);
  S.watch={running:false,t0:0};
}
function fourRushTap(){
  const w=S.watch;
  if(!w.running){w.running=true;w.t0=performance.now();
    document.getElementById("tap").classList.add("run");
    document.getElementById("hint").textContent="тап = стоп (удар)";
    const loop=()=>{const el=document.getElementById("num");if(!el||!w.running)return;
      el.textContent=((performance.now()-w.t0)/1000).toFixed(2);w.raf=requestAnimationFrame(loop);};
    w.raf=requestAnimationFrame(loop);
  } else { w.running=false; if(w.raf)cancelAnimationFrame(w.raf);
    S.four.rush.t=(performance.now()-w.t0)/1000; fourRushGoal(); }
}
function fourRushGoal(){
  const f=S.four;
  h(`<h1>Гол в названный угол?</h1>
    <div class="card center"><div class="name">${RU[f.player]}</div>
      <div class="big">${f.rush.t.toFixed(2)}</div></div>
    <div class="row"><button class="go" onclick="fourRushSave(true)">⚽ ДА</button>
      <button class="warn" onclick="fourRushSave(false)">✕ НЕТ</button></div>`);
}
function fourRushSave(g){
  const f=S.four, sub=f.rush.sub;
  pushAttempt({player:f.player,ex:"E10",variant:sub.v,attempt_no:f.rush.shot,
    time_sec:f.rush.t,goals:g?1:0,shots:1,dist:sub.dist[f.player]});
  if(f.rush.shot<5){ f.rush.shot++; return fourRest(); }
  f.pos++; fourRunSub();
}

/* ---- Итог занятия: формат тот же, что у бота и в md-журнале ----
   Время и голы — РАЗНЫЕ строки; процент после каждого «N из M»;
   лучшее и среднее в два знака; разброс от трёх повторов; попытки
   с потерей мяча не входят в лучшее/среднее/разброс. */
const SEG_LABELS={E02:{"20m":"20 м","15m":"15 м","25m_fly":"25 м с ходу","30m_fly":"30 м с ходу"}};
const TIME_QUALITY={E01:"Скорость",E02:"Скорость",E06:"Смена направления"};
const E10_SERIES=[["С места",[["s1_near","ближняя"],["s1_far","дальняя"]]],
  ["После приёма",[["s2_near","ближняя"],["s2_far","дальняя"]]],
  ["С фланга",[["s3_right","справа"],["s3_left","слева"]]],
  ["Рывок на пас",[["s4_left","слева"],["s4_center","центр"],["s4_right","справа"]]]];
function exOf(ex){ return EX[ex]||EX[ex.replace(/_[DA]$/,"")]||null; }
function pctTxt(g,s){ return s?`${g} из ${s} (${Math.round(100*g/s)}%)`:"—"; }
function scoringTimes(list){ return list.filter(a=>a.time_sec!==null&&!a.lost).map(a=>a.time_sec); }
function statsTxt(list,cap){
  const t=scoringTimes(list); if(!t.length)return null;
  const best=Math.min(...t), avg=t.reduce((x,y)=>x+y,0)/t.length;
  const parts=[`${cap?"Лучшее":"лучшее"} ${best.toFixed(2)}`,`среднее ${avg.toFixed(2)}`];
  if(t.length>=3) parts.push(`разброс ${(Math.max(...t)-best).toFixed(2)}`);
  return parts.join(", ");
}
function goalsOf(list){ const l=list.filter(a=>!a.lost&&a.shots);
  return {g:l.reduce((s,a)=>s+(a.goals||0),0), s:l.reduce((s,a)=>s+(a.shots||0),0)}; }
function segLabel(ex,a){ const m=SEG_LABELS[ex];
  if(m&&m[a.variant])return m[a.variant];
  if(TIME_QUALITY[ex]==="Скорость"&&a.distance_m)return Math.round(a.distance_m)+" м";
  return (exOf(ex)||{name:ex}).name; }
function pureTimeLines(ex,list){
  const groups=[], seen={};
  list.forEach(a=>{const l=segLabel(ex,a);
    if(seen[l]===undefined){seen[l]=groups.length;groups.push([l,[]]);}
    groups[seen[l]][1].push(a);});
  return groups.map(([l,g])=>{const s=statsTxt(g,false);return s?`${l}: ${s}`:null;}).filter(Boolean);
}
function timeGoalChunk(e,list){
  const lines=[], s=statsTxt(list,true), t=goalsOf(list);
  if(s)lines.push(s);
  if(t.s)lines.push(`Голы: ${pctTxt(t.g,t.s)}`);
  const lost=list.filter(a=>a.lost).length;
  if(lost>0)lines.push(`Потерь мяча: ${lost}`);
  return {h:e.name,lines};
}
// Чистые удары по воротам: только они идут в «Всего ударов». Единоборства
// тоже кончаются ударом, но упражнение там про обыгрыш и отбор — их процент
// считается своим блоком (dupl. bot/insights.py SHOT_EXERCISES).
const SHOT_EXERCISES=["E10","E10S","E07","E15"];
function shotsTotal(byEx){
  let g=0,s=0;
  SHOT_EXERCISES.forEach(ex=>{ const t=goalsOf(byEx[ex]||[]); g+=t.g; s+=t.s; });
  return {g,s};
}
function shotsChunk(list,total){
  const by={}; list.filter(a=>!a.lost).forEach(a=>{const v=a.variant||"";
    by[v]=by[v]||{g:0,s:0,t:[]}; by[v].g+=a.goals||0; by[v].s+=a.shots||0;
    if(a.time_sec!==null)by[v].t.push(a.time_sec);});
  const lines=[];
  E10_SERIES.forEach(([title,subs])=>{
    const parts=subs.filter(([v])=>by[v]).map(([v,cap])=>`${cap} ${pctTxt(by[v].g,by[v].s)}`);
    if(!parts.length)return;
    lines.push(`${title}: ${parts.join(", ")}`);
    const t=[].concat(...subs.map(([v])=>(by[v]||{t:[]}).t));
    if(t.length)lines.push(" ".repeat(title.length+2)+
      `лучшее ${Math.min(...t).toFixed(2)}, среднее ${(t.reduce((x,y)=>x+y,0)/t.length).toFixed(2)}`);
  });
  lines.push(`Всего ударов: ${pctTxt(total.g,total.s)}`);
  return {h:"Удары",lines};
}
function breakawayChunks(list){
  const fresh=list.filter(a=>a.variant===E15_FRESH), tired=list.filter(a=>a.variant===E15_TIRED);
  const subs=list.filter(a=>a.variant===E15_SHOTS_A.v);
  const lines=[];
  if(fresh.length){
    const s=statsTxt(fresh,!tired.length), t=goalsOf(fresh);
    if(tired.length){ if(s)lines.push(`Свежие: ${s}`); if(t.s)lines.push(`  голы ${pctTxt(t.g,t.s)}`); }
    else { if(s)lines.push(s); if(t.s)lines.push(`Голы: ${pctTxt(t.g,t.s)}`); }
  }
  if(tired.length){
    const tt=tired.slice().sort((a,b)=>a.attempt_no-b.attempt_no)
      .filter(a=>a.time_sec!==null&&!a.lost).map(a=>a.time_sec);
    if(tt.length)lines.push("На усталости: "+tt.map(x=>x.toFixed(2)).join(" → "));
    if(tt.length>=2){ const d=Math.round((tt[tt.length-1]-tt[0])*100)/100;
      // По старому отрезку дельту не трактуем — ставим пометку.
      const v=oldBreakawayTiming()?E15_OLD_TIMING
        :d<0.3?"способен повторить отрыв":d<=0.6?"на границе"
        :"не способен, ноги не восстанавливаются между всплесками";
      lines.push(`  дельта 1-3: ${d.toFixed(2)} — ${v}`); }
    const t=goalsOf(tired); if(t.s)lines.push(`  голы ${pctTxt(t.g,t.s)}`);
  }
  const lost=fresh.concat(tired).filter(a=>a.lost).length;
  if(lost>0)lines.push(`Потерь мяча: ${lost}`);
  const out=lines.length?[{h:"Отрыв",lines}]:[];
  // Часть 2 Адриана: удары с места, дистанция названа явно.
  if(subs.length){
    const t=goalsOf(subs);
    if(t.s)out.push({lines:[`${E15_SHOTS_A.name}: ${pctTxt(t.g,t.s)}, `+
      `${E15_SHOTS_A.kind} ${E15_SHOTS_A.range}`]});
  }
  return out;
}
function summaryChunks(pl){
  const att=S.attempts.filter(a=>a.player===pl), byEx={};
  att.forEach(a=>{(byEx[a.exercise_id]=byEx[a.exercise_id]||[]).push(a);});
  const order=[]; (S.spec.blocks||[]).forEach(b=>{if(byEx[b[0]]&&order.indexOf(b[0])<0)order.push(b[0]);});
  Object.keys(byEx).forEach(k=>{if(order.indexOf(k)<0)order.push(k);});
  const chunks=[]; let scores=[], q="";
  const flush=()=>{ if(scores.length){chunks.push({lines:scores});scores=[];} };
  for(const ex of order){
    const e=exOf(ex); if(!e)continue;                    // E00, NOTE — не показываем
    const list=byEx[ex];
    if(ex==="E10"){ flush(); q=""; chunks.push(shotsChunk(list,shotsTotal(byEx))); continue; }
    if(ex==="E15"){ flush(); q=""; breakawayChunks(list).forEach(c=>chunks.push(c)); continue; }
    const hasTime=scoringTimes(list).length>0;
    const hasGoals=list.some(a=>a.goals!==null&&a.goals!==undefined&&a.shots);
    if(hasTime&&hasGoals){ flush(); q=""; chunks.push(timeGoalChunk(e,list)); continue; }
    if(hasTime){ flush();
      const lines=pureTimeLines(ex,list); if(!lines.length)continue;
      const qq=TIME_QUALITY[ex]||e.name;
      if(qq===q&&chunks.length) chunks[chunks.length-1].lines.push(...lines);
      else { q=qq; chunks.push({h:qq,lines}); }
      continue; }
    if(hasGoals){ q=""; const t=goalsOf(list);
      let line=`${e.name}: ${pctTxt(t.g,t.s)}`;
      const c=list.filter(a=>a.control!==null&&a.control!==undefined).map(a=>a.control);
      if(c.length)line+=`, контроль ${+(c.reduce((x,y)=>x+y,0)/c.length).toFixed(1)}`;
      scores.push(line); }
  }
  flush();
  return chunks;
}
function summaryCard(pl){
  const body=summaryChunks(pl).map(c=>
    `<div style="margin:8px 0">${c.h?`<div class="title" style="font-size:18px">${c.h}</div>`:""}
     ${c.lines.map(l=>`<div style="white-space:pre-wrap">${l}</div>`).join("")}</div>`).join("");
  return `<div class="card"><div class="name">${RU[pl]}</div>
    ${body||'<div class="note">Замеров нет.</div>'}</div>`;
}
function finishLater(){clearSession();screenHome();}
function buildPayload(){
  const pending=loadAttempts().filter(a=>!a.uploaded), c=ctx();
  return {records:pending.map(a=>{const{uploaded,...r}=a;return r;}),
    context:{club_days:[...c.club],match_days:[...c.match]}};
}
// Пометить всё выгруженным (после подтверждения приёма ботом) и снять флаг.
function markUploaded(){ const all=loadAttempts();
  all.forEach(a=>{if(!a.uploaded)a.uploaded=true;}); saveAttempts(all);
  localStorage.removeItem("trening_copied"); }
function screenSent(n){
  h(`<h1>Отправлено</h1><div class="card center">
    <div class="big">${n}</div><div style="font-size:22px">записей отправлено</div></div>
    <div class="row"><button class="go" onclick="screenHome()">Готово</button></div>`);
}
function screenCopied(){
  h(`<h1>Скопировано</h1>
    <div class="card"><div style="font-size:21px">Вставь боту в чат одним сообщением
      и отправь.</div></div>
    <div class="row"><button class="go" onclick="screenHome()">Понятно</button></div>`);
}
// Показать текст с автовыделением — последний резерв, если копирование недоступно.
function screenCopyManual(text){
  h(`<h1>Скопируй вручную</h1>
    <div class="note">Выдели весь текст и скопируй, затем вставь боту в чат.</div>
    <textarea id="cptext" readonly style="min-height:180px"></textarea>
    <div class="row"><button class="go" onclick="screenHome()">Готово</button></div>`);
  const ta=document.getElementById("cptext"); if(ta){ta.value=text; ta.focus(); ta.select();}
}
function copyText(text,onOk,onFail){
  // 1) современный API
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(onOk,()=>legacyCopy(text,onOk,onFail));
  } else { legacyCopy(text,onOk,onFail); }
}
function legacyCopy(text,onOk,onFail){
  // 2) скрытый textarea + execCommand
  try{
    const ta=document.createElement("textarea");
    ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.focus(); ta.select();
    const ok=document.execCommand("copy"); ta.remove();
    if(ok) onOk(); else onFail();
  }catch(e){ onFail(); }
}
function uploadAll(){
  const pending=loadAttempts().filter(a=>!a.uploaded);
  if(!pending.length){toast("Нет несинхронизированных записей.");return;}
  const body=JSON.stringify(buildPayload());
  // Тихий резерв: sendData, если он есть и payload помещается в лимит Telegram.
  if(tg&&tg.sendData&&body.length<3800){
    try{ tg.sendData(body); markUploaded(); screenSent(pending.length); return; }catch(_){}
  }
  // Основной путь: копируем весь JSON в буфер. Выгруженным НЕ помечаем —
  // только после подтверждения кнопкой «Отметить выгруженным».
  localStorage.setItem("trening_copied","1");
  copyText(body, screenCopied, ()=>screenCopyManual(body));
}

   РАСПИСАНИЕ, ИМПОРТ, ПОСЛЕДНЕЕ, СБРОС

function screenWeek(){
  const c=ctx();
  h(`<h1>Расписание на неделю</h1>
    <div class="card"><div class="title">Клубные дни (через запятую)</div>
      <input type="text" id="club" value="${[...c.club].join(", ")}"></div>
    <div class="card"><div class="title">Даты матчей</div>
      <input type="text" id="match" value="${[...c.match].join(", ")}"></div>

    <div class="row"><button class="go" onclick="saveWeek()">Сохранить</button>

}
function saveWeek(){
  const p=id=>document.getElementById(id).value.split(",").map(s=>s.trim()).filter(s=>/^\d{4}-\d{2}-\d{2}$/.test(s));
  localStorage.setItem("trening_ctx",JSON.stringify({club_days:p("club"),match_days:p("match")}));
  screenHome();
}
function screenImport(){
  h(`<h1>Импорт рекордов</h1>
    <div class="note">Вставьте слепок из ответа бота (по игроку). Он показывается на поле в строке «Пред. · рекорд».</div>
    <textarea id="imp" placeholder='{"player":"DANIIL","records":{...}}'></textarea>
    <div class="row"><button class="go" onclick="applyImport()">Сохранить</button>
      <button class="ghost" onclick="screenHome()">Назад</button></div>`);
}
// Вытащить JSON из вставленного текста: всё между первой { и последней }.
// Обёртка ```, строка «Рекорды …» и прочий текст вокруг игнорируются.
function extractJsonBlock(text){
  if(!text) return null;
  const i=text.indexOf("{"), j=text.lastIndexOf("}");
  if(i<0||j<0||j<i) return null;
  return text.slice(i,j+1);
}
function applyImport(){
  try{ const block=extractJsonBlock(document.getElementById("imp").value);
    const o=JSON.parse(block);
    if(!o.player||!o.records)throw 0;
    const r=records(); r[o.player]=o.records;
    localStorage.setItem("trening_records",JSON.stringify(r));
    toast("Рекорды "+o.player+" сохранены.");
  }catch(e){toast("Не удалось прочитать слепок.");}
}
function screenLast(){
  const a=loadAttempts(), dates=[...new Set(a.map(x=>x.date))].sort(), last=dates[dates.length-1];
  if(!last){h(`<h1>Последнее занятие</h1><div class="note">Данных нет.</div>
    <div class="row"><button class="go" onclick="screenHome()">Назад</button></div>`);return;}
  const cards=PLAYERS.map(pl=>{
    const list=a.filter(x=>x.date===last&&x.player===pl&&x.time_sec!==null&&!x.lost);
    const byEx={};list.forEach(x=>{(byEx[x.exercise_id]=byEx[x.exercise_id]||[]).push(x.time_sec);});
    const rows=Object.keys(byEx).map(ex=>{const nm=(EX[ex]||{name:ex}).name;
      return `<div>${nm}: ${Math.min(...byEx[ex]).toFixed(2)}</div>`;}).join("");
    return `<div class="card"><div class="name">${RU[pl]}</div>${rows||'<div class="note">—</div>'}</div>`;
  }).join("");
  h(`<h1>Последнее занятие · ${last}</h1>${cards}
    <div class="row"><button class="go" onclick="screenHome()">Назад</button></div>`);
}
function confirmReset(){
  const n=unsynced();
  overlay(`<div class="card"><div class="title">Сбросить все данные?</div>
    <div class="note">Будут удалены все попытки${n>0?` (в т.ч. ${n} невыгруженных)`:""}, рекорды, расписание и незавершённое занятие. Отменить нельзя.</div>
    <div class="row"><button class="warn" onclick="resetData()">Да, стереть</button>
      <button class="ghost" onclick="closeOverlay()">Отмена</button></div></div>`);
}
function resetData(){
  ["trening_attempts","trening_records","trening_ctx","trening_session","trening_hot","trening_copied"].forEach(k=>localStorage.removeItem(k));
  if(sessionTimer){clearInterval(sessionTimer);sessionTimer=null;} S=null;
  closeOverlay(); screenHome();
}

/* ================================================================
   ВОССТАНОВЛЕНИЕ И ЗАПУСК
   ================================================================ */
function boot(){
  if(localStorage.getItem("trening_session")){
    overlay(`<div class="card"><div class="title">Есть незавершённое занятие</div>
      <div class="row"><button class="go" onclick="resume()">Продолжить</button>
        <button class="ghost" onclick="dropSession()">Закрыть</button></div></div>`);
  } else screenHome();
}
function resume(){closeOverlay();S=JSON.parse(localStorage.getItem("trening_session"));
  if(S&&S.steps){S.startMs=performance.now();startSessionClock();runStep();}else screenHome();}
function dropSession(){closeOverlay();clearSession();screenHome();}

if('serviceWorker' in navigator){
  // Адрес регистрации версионный (./sw.js?v=BUILD): при деплое меняется сам
  // URL скрипта, поэтому браузер обязан сходить за ним на сервер, даже если
  // старый sw.js ещё лежит у него в HTTP-кэше. updateViaCache:'none' — то же
  // самое для последующих проверок обновления.
  const hadController=!!navigator.serviceWorker.controller;
  let reloadedForUpdate=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    // Управление перехватила новая сборка. Перезагружаем страницу, иначе на
    // экране осталась бы старая оболочка. НИКОГДА посреди занятия: там идёт
    // секундомер — незаконченное занятие обновится при следующем открытии.
    if(!hadController||reloadedForUpdate)return;
    if(localStorage.getItem("trening_session"))return;
    reloadedForUpdate=true; location.reload();
  });
  window.addEventListener('load',()=>navigator.serviceWorker
    .register('./sw.js?v='+BUILD,{updateViaCache:'none'})
    .then(r=>r.update().catch(()=>{})).catch(()=>{}));
}
boot();
