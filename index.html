<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#f7f3e8">
<title>Тренировка</title>
<style>
/* Высокий контраст: тёмный текст на светлом фоне, читается на солнце. */
:root{
  --bg:#f7f3e8; --fg:#141414; --muted:#555; --line:#c9c2ad;
  --btn:#141414; --btn-fg:#fff; --accent:#0a6b2e; --warn:#a11; --card:#fff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);
  font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;
  font-size:19px;line-height:1.35;-webkit-user-select:none;user-select:none}
#app{max-width:540px;margin:0 auto;padding:14px 14px 24px;min-height:100vh;
  display:flex;flex-direction:column}
h1{font-size:23px;margin:.2em 0}
.title{font-weight:800;font-size:21px}
.sub{color:var(--muted);font-size:16px}
.hr{border:0;border-top:2px solid var(--line);margin:9px 0}
.big{font-size:46px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums}
/* Последние 10 секунд отдыха: цифры на весь экран, размер как у секундомера. */
.cd10{font-size:96px;line-height:1.05;font-weight:800;text-align:center;
  font-variant-numeric:tabular-nums;color:var(--accent)}
.cd10.hot{color:var(--warn)}
button{font-size:19px;min-height:52px;border:2px solid var(--btn);
  background:var(--btn);color:var(--btn-fg);border-radius:12px;padding:10px 14px;
  font-weight:700;cursor:pointer;flex:1}
button.ghost{background:transparent;color:var(--fg)}
button.warn{background:var(--warn);border-color:var(--warn)}
button.go{background:var(--accent);border-color:var(--accent)}
button.small{min-height:46px;font-size:16px}
button:disabled{opacity:.4}
.row{display:flex;gap:8px;margin-top:10px}
.card{background:var(--card);border:2px solid var(--line);border-radius:12px;
  padding:12px;margin:8px 0}
.center{text-align:center}
.name{font-size:30px;font-weight:800;letter-spacing:1px}
.tap{display:flex;flex-direction:column;align-items:center;justify-content:center;
  border:3px solid var(--btn);border-radius:16px;margin:10px 0;min-height:40vh;
  background:#fffef8;cursor:pointer}
.tap .num{font-size:60px;font-weight:800;font-variant-numeric:tabular-nums}
.tap.run{background:#eaf6ec;border-color:var(--accent)}
.grid5{display:flex;gap:6px}
.grid5 button{min-height:56px;font-size:22px}
.gridN{display:flex;flex-wrap:wrap;gap:6px}
.gridN button{min-height:52px;flex:1 0 26%}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;
  align-items:center;justify-content:center;padding:16px;z-index:50}
.overlay .card{max-width:480px;width:100%;max-height:90vh;overflow-y:auto}
.note{color:var(--muted);font-size:15px}
.badge{display:inline-block;background:#141414;color:#fff;border-radius:8px;
  padding:2px 9px;font-size:14px;font-weight:700}
.warnbox{background:#fff2f0;border:2px solid var(--warn);color:var(--warn);
  border-radius:10px;padding:8px;font-weight:700}
.blk{margin:8px 0}
.blk .h{font-weight:800;font-size:15px;text-transform:uppercase;letter-spacing:.5px}
.blk.look .h{color:#0a4f6b}.blk.err .h{color:var(--warn)}
.blk.ok .h{color:var(--accent)}.blk.match .h{color:#7a4b00}
ol{margin:6px 0 6px 22px;padding:0}li{margin:3px 0}
svg.svg{width:100%;height:auto;background:#fffef8;border:2px solid var(--line);
  border-radius:10px;display:block;margin:6px 0}
.scroll{overflow-y:auto;flex:1}
input[type=text]{font-size:24px;width:100%;padding:10px;border:2px solid var(--btn);
  border-radius:10px;text-align:center}
textarea{font-size:17px;width:100%;min-height:80px;padding:10px;
  border:2px solid var(--btn);border-radius:10px}
.foot{margin-top:auto}
.sw{display:flex;align-items:center;justify-content:space-between;gap:8px}
.small-actions{display:flex;gap:6px;margin-top:10px}
.small-actions button{min-height:44px;font-size:14px}
.reps{background:#fffef8;border:2px solid var(--line);border-radius:10px;padding:8px;margin:6px 0}
.build{color:var(--muted);font-size:12px;text-align:center;margin-top:8px}
.build button{margin-left:8px;min-height:32px;font-size:12px;padding:4px 10px}
/* Отмена занятия — отдельной строкой, с отступом от служебного ряда. */
.cancel-row{display:flex;margin-top:14px}
.cancel-row button{flex:0 0 auto;min-width:150px;opacity:.85}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* Метка сборки: дата, время и хэш содержимого. deploy.sh заменяет всю
   строку целиком (якорь — начало строки «const BUILD = ») тем же значением,
   что попадает в имя кэша sw.js и в адрес его регистрации ./sw.js?v=BUILD.
   Локально остаётся 'dev'. Показывается внизу главного экрана — по ней
   сразу видно, какая версия загружена на телефоне. */
const BUILD = '20260827-0141-b5c1771';
function buildLabel(){
  const m=/^(\d{4})(\d{2})(\d{2})-(\d{2})(\d{2})-(.+)$/.exec(BUILD);
  return m?`Сборка ${m[3]}.${m[2]}.${m[1]} ${m[4]}:${m[5]} · ${m[6]}`:`Сборка ${BUILD}`;
}
/* ================================================================
   ТРЕНИРОВКА БРАТЬЕВ — автономное Mini App (v2).
   Приложение ведёт человека, который видит упражнение впервые:
   сколько фишек, на каком расстоянии, где стоит тренер, что делать
   по шагам. Коды упражнений тренеру НЕ показываются — только в данных.

   Перед каждым упражнением — ТРИ экрана: Расстановка → Что делать →
   Работа. Пробных попыток нет. Занятие идёт офлайн, копится в
   localStorage, вечером — [Выгрузить] боту (файлом).

   ГЛАВНОЕ ПРАВИЛО: братья не сравниваются. Один выполняет → тренер
   записал → потом второй. Итоги — отдельными карточками. Имена рядом
   только на экране самочувствия (это ввод, не вывод).
   ================================================================ */
const tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
if (tg) { try { tg.ready(); tg.expand(); } catch(e){} }

const PLAYERS = ["DANIIL","ADRIAN"];
const RU = {DANIIL:"ДАНИИЛ", ADRIAN:"АДРИАН"};
// Упражнения с мячом, где возможна потеря мяча (кнопка на экране замера).
const LOST_EXERCISES = new Set(["E04","E05","E15","E10S"]);
/* ПАРАМЕТРЫ УПРАЖНЕНИЙ — один источник для слотов, текстов и схем.
   Числа повторов, дистанций и отдыха НЕ пишутся в описаниях словами:
   тексты подставляют их отсюда. Иначе правишь одно, а второе остаётся
   старым — так и разъехалось «10 повторов» в «Ведении и ударе». */
// Дистанции (м): по игроку или по варианту.
// Рывок после последней фишки — ОДИН И ТОТ ЖЕ элемент в слаломе и зигзаге:
// выход из тесноты на скорость. Фишка удара во вторник ставится один раз
// и между упражнениями не двигается (dupl. bot/catalog.py RUSH_M).
const RUSH={DANIIL:15,ADRIAN:10};
const DIST={
  E01:{DANIIL:10,ADRIAN:10},
  E02:{"20m":20,"15m":15,"25m_fly":35,"30m_fly":40},
  E04:{DANIIL:RUSH.DANIIL,ADRIAN:RUSH.ADRIAN},
  E05:{DANIIL:5,ADRIAN:4},
  E06:{DANIIL:5,ADRIAN:4},
  E07:{DANIIL:20,ADRIAN:15},
  E10S:{DANIIL:36,ADRIAN:27},
  E12:{DANIIL:20,ADRIAN:20},
  E13:{DANIIL:17,ADRIAN:17},
  E14:{DANIIL:20,ADRIAN:20},
  E15:{DANIIL:36,ADRIAN:27},
  E17:{DANIIL:10,ADRIAN:10},
  E08_D:{DANIIL:34}, E08_A:{ADRIAN:27},
  // Режим 2 (dupl. bot/catalog.py distances_m).
  E18:{DANIIL:20,ADRIAN:15},   // замеряемый участок после разгона
  E19:{DANIIL:30,ADRIAN:20},
  E22:{DANIIL:5,ADRIAN:4},     // радиус звезды
  E24:{DANIIL:10,ADRIAN:8},
  E27:{DANIIL:5,ADRIAN:4},     // между фишками челнока
};
// Замер внутри длинного забега (E02): бежит 35 — меряем средние 25.
const E02_MEASURE={"25m_fly":25,"30m_fly":30};
// Разметка, не совпадающая с дистанцией замера.
const E01_LANE_GAP=3;        // между коридорами братьев
/* «Прыжки и старт» (E17): прыжков подряд по игроку — у младшего их меньше,
   иначе к старту он приходит выключенным (dupl. bot/catalog.E17_JUMPS). */
const E17_JUMPS={DANIIL:3,ADRIAN:2};
const E17_WATCH_RULE="Пуск — старт после последнего прыжка. Стоп — 10 метров. Сами прыжки в замер не входят.";
/* ── РЕЖИМ 2: разметка и правила упражнений (dupl. bot/catalog.py) ──── */
// «Летящие ускорения» (E18): разгон до пуска секундомера.
const E18_RUNUP_M=15;
const E18_REPS={DANIIL:5,ADRIAN:4};
const E18_WATCH_RULE="Пуск — вторая фишка. Стоп — третья.";
// «Повторные рывки с мячом» (E19).
const E19_REPS={DANIIL:6,ADRIAN:5};
const E19_FADE_GOOD=0.4, E19_FADE_BAD=0.8;
const E19_FADE_VERDICTS={hold:"держит скорость в серии",edge:"на границе",
  fade:"садится, восстановление слабое"};
// «Координационная лестница» (E03) — отдельный блок среды режима 2.
const E03_DRILLS=["два шага в ячейку","один шаг, максимально часто",
  "боком приставным","внутрь-наружу","крест-накрест","с разворотом на выходе"];
const E03_DRILL_SEC=90, E03_ACCEL_M=15;
// «Звезда» (E22): подход — пять забегов подряд, к каждой фишке по разу.
const E22_POINTS=5, E22_REPS=3;
// «Техника бега» (E23).
const E23_DRILLS=["высокое бедро","захлёст голени","семенящий бег",
  "прыжковый шаг","бег с ускорением на второй половине"];
/* «Техника бега» (E23). ОДИН КРУГ = один прогон всех пяти упражнений
   подряд по E23_LEG_M метров, обратно шагом. Между кругами отдельного
   отдыха нет: паузой служит возврат шагом (~E23_WALK_BACK_SEC секунд). */
const E23_LEG_M=20, E23_ROUNDS=2, E23_WALK_BACK_SEC=20;
// «Разворот на 180°» (E24): три через правое плечо, три через левое.
const E24_BACK_M=5;
const E24_SUBS=[{v:"turn_right",side:"через правое плечо",reps:3},
                {v:"turn_left",side:"через левое плечо",reps:3}];
// «Интервалы 30-30» (E25) и «Интервалы с мячом 15-15» (E26).
const E25_WORK_SEC=30, E25_REST_SEC=30;
/* Дорожка с фишками через 5 м: по ним тренер вводит, докуда добежал игрок.
   Остановился между фишками — округляем до ближайшей (dupl. bot/catalog). */
const E25_CONE_STEP=5, E25_MARKS=[];
for(let m=30;m<=100;m+=E25_CONE_STEP)E25_MARKS.push(m);
const E25_REPS={DANIIL:10,ADRIAN:8}, E25_LIGHT={DANIIL:6,ADRIAN:5};
const E26_WORK_SEC=15, E26_REST_SEC=15, E26_BREAK_SEC=180;
const E26_CONE_STEP=5, E26_MARKS=[];
for(let m=15;m<=50;m+=E26_CONE_STEP)E26_MARKS.push(m);
/* Падение дистанции: первый интервал против последнего, в метрах
   и процентах (dupl. bot/catalog.INTERVAL_FADE_*). */
const INTERVAL_WARN_SEC=5;
const INTERVAL_FADE_GOOD=10, INTERVAL_FADE_BAD=20;
const INTERVAL_FADE_VERDICTS={hold:"держит темп всю серию",edge:"на границе",
  fade:"садится, выносливости не хватает"};
const INTERVAL_MARKS={E25:E25_MARKS,E26:E26_MARKS};
const E26_SERIES={DANIIL:[6,6],ADRIAN:[5,5]};
const E26_LIGHT_SERIES={DANIIL:[6],ADRIAN:[5]};
// «Челнок с мячом» (E27): ворота в стороне от линии фишек.
const E27_REPS=4;
const E27_GOAL_M={DANIIL:15,ADRIAN:12};
/* ЕДИНОЕ ПРАВИЛО ЗАМЕРА В УПРАЖНЕНИЯХ С МЯЧОМ: секундомер идёт ОТ СТАРТА
   ИГРОКА ДО МОМЕНТА УДАРА. Не от касания мяча и не до пересечения линии.
   Выводится текстом на экране замера каждого такого упражнения. */
const BALL_WATCH_RULE="Пуск — старт. Стоп — удар.";
const BALL_TIMED=["E04","E05","E19","E27","E15"];
// Упражнение с мячом, где секундомер идёт от старта игрока до удара.
function ballTimed(ex){ return BALL_TIMED.indexOf(ex)>=0; }
// Ограничение выводится на экран упражнения (dupl. bot/catalog.E17_WARNING).
const E17_WARNING="Прыжки подряд — ударная нагрузка на пятку. При боли в пятке упражнение пропускать. После перерыва начинать с одного прыжка.";
const E04_CONES=8, E04_CONE_GAP=2;
const E05_CONES=5, E05_SIDE={DANIIL:3,ADRIAN:2.5};
const E06_CONES=3;
const E07_PASS={DANIIL:10,ADRIAN:8};   // пасующий перед принимающим
const E13_PASS=12, E13_BACK="16-18";   // пас и позиция принимающего
const E14_GAP=5;                       // ты между игроком и воротами
const E10_RUSH_REST=25;                // отдых между рывками серии 4
const E10_RUSH_START={DANIIL:28,ADRIAN:22};  // откуда стартует на пас
const E15_CALL={DANIIL:25,ADRIAN:18};  // метр, на котором кричишь УДАР/ПАС
const FULL_REST_SEC=90;                // полный отдых перед первой попыткой
/* ПОТОЛОК ОТДЫХА между повторами — 100 секунд, больше в программе нет
   ничего (dupl. bot/catalog.REST_CEILING_SEC). Поднят с 90 ровно под
   «Ведение и удар»: 36 м с мячом на скорости плюс удар. Полный отдых перед
   ПЕРВОЙ попыткой серии — правило отдельное, оно не про паузу между
   повторами. Отдых между повторами (с): число, по варианту или по игроку. */
const REST_CEILING_SEC=100;
/* У РЕЖИМА 2 свой потолок — 120 секунд, и держит его ровно одно упражнение:
   «Летящие ускорения». Это забег на МАКСИМАЛЬНОЙ скорости с ходу, и две
   минуты между повторами — решение тренера: недовосстановленный
   максимальный спринт бьёт по задней поверхности бедра
   (dupl. bot/catalog.REST_CEILING_MODE2_SEC). */
const REST_CEILING_MODE2_SEC=120;
const REST={
  E01:45,
  E02:{"20m":90,"15m":80,"25m_fly":90,"30m_fly":90},
  E04:{DANIIL:70,ADRIAN:60},
  E05:{DANIIL:70,ADRIAN:60},
  E06:75,
  E10S:100,
  E08:90,
  E15:90,
  E17:45,
  // Режим 2.
  E18:120,
  E19:{DANIIL:15,ADRIAN:25},
  E22:60,
  E24:75,
  E25:30,
  E26:15,
  E27:90,
};
function restOf(ex,key){ const r=REST[ex];
  return (r&&typeof r==="object")?r[key]:r; }
// Число повторов по факту плана дня — не по памяти текста.
// Числа в текстах подставляются, поэтому склонение считается, а не пишется.
function plural(n,one,few,many){
  const a=Math.abs(n)%100, b=a%10;
  if(a>10&&a<20)return many;
  if(b>1&&b<5)return few;
  if(b===1)return one;
  return many;
}
function nOf(n,one,few,many){ return `${n} ${plural(n,one,few,many)}`; }
const N_REP=(n)=>nOf(n,"повтор","повтора","повторов");
const N_RUN=(n)=>nOf(n,"забег","забега","забегов");
const N_PASS=(n)=>nOf(n,"проход","прохода","проходов");
const N_TRY=(n)=>nOf(n,"подход","подхода","подходов");
const N_CATCH=(n)=>nOf(n,"приём","приёма","приёмов");
const N_ATT=(n)=>nOf(n,"попытка","попытки","попыток");
// Разбивка стартов по положениям — из самого плана дня, не из памяти текста.
const START_POSE={stance:"стойка",sit_face:"сидя лицом",sit_back:"сидя спиной",lie:"лёжа"};
function startBreakdown(player,spec){
  const by={};
  repsFor("E01",spec)[player].forEach(sl=>{by[sl.variant]=(by[sl.variant]||0)+1;});
  return Object.keys(by).map(v=>`${START_POSE[v]||v}·${by[v]}`).join(", ");
}
// Сколько забегов данного варианта у каждого игрока — из плана дня.
function runCount(ex,variant,spec){
  const plan=repsFor(ex,spec), out={};
  PLAYERS.forEach(pl=>{out[pl]=(plan[pl]||[]).filter(sl=>sl.variant===variant).length;});
  return out;
}
function repsOf(ex,player,spec){
  return (repsFor(ex,spec)[player]||[]).length;
}
// Каноническое число повторов на игрока (dupl. bot/catalog.py REP_COUNTS).
// E15 — три забега обоим (деления на части нет с 19.08).
const REPS={E01:{DANIIL:6,ADRIAN:5},E02:{DANIIL:6,ADRIAN:5},E04:{DANIIL:6,ADRIAN:6},
  E05:{DANIIL:6,ADRIAN:6},E06:{DANIIL:5,ADRIAN:5},E07:{DANIIL:10,ADRIAN:10},
  E10S:{DANIIL:6,ADRIAN:6},E15:{DANIIL:3,ADRIAN:3},E17:{DANIIL:3,ADRIAN:3},
  E08_D:{DANIIL:5},E08_A:{ADRIAN:5}};
/* РЕЖИМ 2: свои числа повторов. Общие с режимом 1 упражнения перекрываются
   там, где объём другой (слалом: 5 проходов вместо шести — он тут
   разминочный, а не главный). dupl. bot/catalog.REP_COUNTS_MODE2. */
const REPS2={E04:{DANIIL:5,ADRIAN:5},
  E18:{DANIIL:E18_REPS.DANIIL,ADRIAN:E18_REPS.ADRIAN},
  E19:{DANIIL:E19_REPS.DANIIL,ADRIAN:E19_REPS.ADRIAN},
  E05:{DANIIL:5,ADRIAN:5},
  E22:{DANIIL:E22_REPS,ADRIAN:E22_REPS},
  E23:{DANIIL:E23_ROUNDS,ADRIAN:E23_ROUNDS},
  E24:{DANIIL:6,ADRIAN:6},
  E25:{DANIIL:E25_REPS.DANIIL,ADRIAN:E25_REPS.ADRIAN},
  E27:{DANIIL:E27_REPS,ADRIAN:E27_REPS}};
// Повторы упражнения для ЭТОГО игрока с учётом его режима.
function repsCount(ex,pl){
  const t=(modeOf(pl)===MODE_SPEED&&REPS2[ex])?REPS2[ex]:REPS[ex];
  return (t&&t[pl])||0;
}

/* ── ОБЛЕГЧЁННЫЙ РЕЖИМ (dupl. bot/catalog.py) ──────────────────────────
   Выбирается ОТДЕЛЬНО на каждого игрока перед занятием. Режется только
   объём: занятие одно, порядок упражнений и чередование прежние. Ноль —
   упражнение у этого игрока убрано целиком.

/* ---------- Звук и вибрация ---------- */
function soundOn(){ return localStorage.getItem("trening_sound")!=="off"; }
function toggleSound(){ localStorage.setItem("trening_sound", soundOn()?"off":"on"); screenHome(); }
function tone(ms,freq){
  if(!soundOn()) return;
  try{
    const A=window.AudioContext||window.webkitAudioContext; const a=new A();
    const o=a.createOscillator(), g=a.createGain();
    o.connect(g); g.connect(a.destination);
    o.type="sine"; o.frequency.value=freq; g.gain.value=0.25;
    o.start(); setTimeout(()=>{o.stop(); a.close();},ms);
  }catch(e){}
}
function beep(){ tone(180,880); }        // короткий: 3, 2, 1
function beepLong(){ tone(700,660); }    // длинный: ноль, можно давать старт
// Вибрация НЕ зависит от звука: при выключенном звуке остаётся она.
function buzz(ms){ if(navigator.vibrate){ try{navigator.vibrate(ms||200);}catch(e){} } }
function signal(){ beep(); buzz(200); }

/* ---------- Отсчёт последних 10 секунд отдыха ----------
   Один механизм на все экраны отдыха: между повторами, между упражнениями,
   в паузах. Пока секунд больше десяти — обычная строка «N сек»; последние
   десять — цифры на весь экран, бип на 3, 2, 1 и длинный на нуле, вибрация
   на каждой из последних трёх. Тренер не считает в уме. */
let cdTimer=null;
function stopCountdown(){ if(cdTimer){clearInterval(cdTimer);cdTimer=null;} }
/* opts.warnFrom — с какой секунды идут крупные цифры и короткие сигналы.
   По умолчанию 10 (последние 10 секунд любого отдыха); у интервальных
   упражнений отрезок короткий, там 5 — тренеру нужен знак смены, а не
   отсчёт трети отрезка. Длинный бип в момент смены — всегда. */
const COUNTDOWN_WARN_SEC=10;
function countdownTo(targetMs,elId,onDone,opts){
  stopCountdown();
  const warn=(opts&&opts.warnFrom)||COUNTDOWN_WARN_SEC;
  let last=null, fired=false;
  const tick=()=>{
    const el=document.getElementById(elId);
    if(!el){ stopCountdown(); return; }
    const remain=targetMs-Date.now();
    const secs=Math.max(0,Math.ceil(remain/1000));
    if(secs<=warn){ el.className="cd10"+(secs<=3?" hot":""); el.textContent=secs; }
    else { el.className="big"; el.textContent=secs+" сек"; }
    if(secs!==last){
      if(secs>0&&secs<=Math.min(warn,3)){ beep(); buzz(200); }
      else if(secs>0&&secs<=warn&&warn<=5){ beep(); buzz(200); }
      else if(secs===0){ beepLong(); }
      last=secs;
    }
    if(remain<=0&&!fired){ fired=true; stopCountdown(); if(onDone)onDone(); }
  };
  tick(); cdTimer=setInterval(tick,200);
}

/* Программа ОДНА — та, что раньше называлась Фазой 1. Занятия идут все пять
   дней недели, нагрузку регулирует облегчённый режим (выбирается вручную и
   отдельно каждому игроку). Фазы 2 (короткие занятия типов S/B/D с выбором
   по расписанию клуба и матчей) больше нет: у братьев разное расписание
   клуба, и один день не может быть Фазой 2 для одного и Фазой 1 для
   другого. Вместе с ней убран особый день подводки 19 августа. */
const PROGRAM_START="2026-08-03", PROGRAM_END="2026-09-10";
const CONTROL_DAYS={"2026-08-03":1,"2026-08-14":2,"2026-09-09":3};
const WD=["MON","TUE","WED","THU","FRI","SAT","SUN"];
const WD_RU=["понедельник","вторник","среда","четверг","пятница","суббота","воскресенье"];
// Разминка/заминка/пауза (минут) — каркас. Длительность дня вычисляется:
// разминка + Σблоки + паузы(по числу блоков) + заминка.
/* Минимум на блок в облегчённом режиме: расчёт по повторам даёт только
   чистую работу, а блок начинается с расстановки и объяснения — короче
   пяти минут он не бывает (dupl. bot/schedule.LIGHT_BLOCK_MIN). Ноль —
   упражнение в облегчённом не идёт, под правило не попадает. */
const LIGHT_BLOCK_MIN=5;
const WARMUP_MIN=15, COOLDOWN_MIN=5, PAUSE_MIN=1;
function sessionMinutes(blocks){
  return WARMUP_MIN+blocks.reduce((a,b)=>a+b[1],0)+blocks.length*PAUSE_MIN+COOLDOWN_MIN;
}
/* Длительность занятия по фактическим режимам игроков: её задаёт тот, у кого
   объём больше, поэтому облегчённый у ОДНОГО день не укорачивает. Блоки
   с нулём (в облегчённом упражнения нет) выпадают вместе со своей паузой
   (dupl. bot/schedule.light_minutes). */
function sessionMinutesNow(spec){
  const mins=modesToday().map(m=>{
    const bl=planFor(m,spec).blocks;
    if(!PLAYERS.filter(pl=>modeOf(pl)===m).every(pl=>isLight(pl)))
      return sessionMinutes(bl);
    const kept=bl.filter(b=>b[2]>0).map(b=>[b[0],b[2]]);
    return kept.length?sessionMinutes(kept):0;
  });
  return mins.length?Math.max(...mins):0;
}
/* Матрица дня: [цель, [[код, минут-блока, минут в облегчённом]...]]
   (минуты дня — из sessionMinutes, dupl. bot/schedule.py).
   РЕЖИМОВ ДВА, тренер выбирает их вручную и отдельно каждому игроку:
   1 — основная программа, 2 — скорость и игровая выносливость (25.08).
   День определяется по календарю одинаково, разминка и заминка те же.
   ПН 84, ВТ 79, СР 86, ЧТ 97, ПТ 78 — режим 1
   ПН 69, ВТ 68, СР 73, ЧТ 76, ПТ 82 — режим 2 */
const MODE_MAIN=1, MODE_SPEED=2, MODES=[MODE_MAIN,MODE_SPEED];
const MODE1_MATRIX={
  MON:["Скорость и первый шаг",[["E17",6,5],["E01",11,8],["E02",13,0],["E13",16,10],["E12",13,7]]],
  TUE:["Дриблинг и быстрые ноги",[["E04",15,9],["E05",15,9],["E14",15,10],["E10S",10,5]]],
  WED:["Смена направления",[["E06",12,9],["E13",19,13],["E14",15,10],["E12",16,10]]],
  THU:["Контроль и завершение",[["E07",19,13],["E10",45,18],["E13",10,7]]],
  FRI:["Отрыв и завершение",[["E15",10,7],["E12",11,7],["E14",15,10],["E13",18,13]]],
};
const MODE2_MATRIX={
  MON:["Максимальная скорость",[["E18",16,11],["E01",11,8],["E06",12,9],["E17",6,5]]],
  TUE:["Повторные рывки",[["E04",13,9],["E19",20,14],["E05",13,9]]],
  WED:["Агилити и техника бега",[["E03",10,7],["E22",12,9],["E23",12,7],["E14",15,10]]],
  THU:["Скорость и смена направления",[["E18",16,11],["E24",14,8],["E25",16,10],["E17",6,5]]],
  FRI:["Игровая выносливость",[["E15",10,7],["E26",18,10],["E27",12,7],["E13",18,13]]],

const DAY_MATRIX={1:MODE1_MATRIX,2:MODE2_MATRIX};
// Контрольный день: состав не меняется, облегчённого режима в нём нет.
const CONTROL_BLOCKS=[["E01",9,9],["E02",10,10],["E08",13,13]];
function isoToDate(s){const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);}
function dateToIso(dt){return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");}
function addDays(iso,n){const dt=isoToDate(iso);dt.setDate(dt.getDate()+n);return dateToIso(dt);}
function wdOf(iso){return (isoToDate(iso).getDay()+6)%7;}
function weekOf(iso){return Math.floor((isoToDate(iso)-isoToDate(PROGRAM_START))/86400000/7)+1;}
function noDay(iso,reason){return {iso,week:null,code:WD[wdOf(iso)],day_code:"",
  goal:"",minutes:0,has:false,control:false,blocks:[],
  plans:{1:{goal:"",blocks:[]},2:{goal:"",blocks:[]}},reason};}
function planOf(goal,blocks){
  const bl=blocks.map(b=>b.slice());

}
/* spec несёт план ОБОИХ режимов: братья могут идти разными, и блок одного
   номера выполняется в одно и то же место занятия. Поля goal/blocks/minutes
   верхнего уровня — режим 1 (основной), чтобы код, которому режим не важен,
   работал как раньше. */
function determineDay(iso){
  const wd=wdOf(iso),code=WD[wd];
  const wrap=(plans,extra)=>Object.assign({iso,code,plans,
    goal:plans[MODE_MAIN].goal,blocks:plans[MODE_MAIN].blocks,
    minutes:plans[MODE_MAIN].minutes,has:true},extra);
  if(CONTROL_DAYS[iso]!==undefined){
    // Контрольный день одинаков в обоих режимах: база 3 августа снята так.
    const plans={}; MODES.forEach(m=>{plans[m]=planOf("Контрольный замер",CONTROL_BLOCKS);});
    return wrap(plans,{week:weekOf(iso),day_code:"CTRL_"+CONTROL_DAYS[iso],
      control:true,reason:"Контрольный день: тест, не тренировка."});
  }
  if(iso<PROGRAM_START||iso>PROGRAM_END)return noDay(iso,"Дата вне программы лагеря.");
  if(!MODE1_MATRIX[code])return noDay(iso,"Выходной. Занятия только Пн-Пт.");
  const w=weekOf(iso), plans={};
  MODES.forEach(m=>{const[goal,blocks]=DAY_MATRIX[m][code]; plans[m]=planOf(goal,blocks);});
  return wrap(plans,{week:w,day_code:"W"+w+"_"+code,control:false,reason:""});

// Режим программы этого игрока (по умолчанию основной).
function modeOf(pl){ return (S&&S.mode&&S.mode[pl])||MODE_MAIN; }
// Режимы, которые сегодня реально используются, в порядке 1, 2.
function modesToday(){ return MODES.filter(m=>PLAYERS.some(pl=>modeOf(pl)===m)); }
// Игроки этого режима.
function playersOfMode(m){ return PLAYERS.filter(pl=>modeOf(pl)===m); }
// План дня для режима.
function planFor(m,spec){ const sp=spec||S.spec;
  return (sp.plans&&sp.plans[m])||sp.plans[MODE_MAIN]; }
// Число приёмов E13 по дню (контроль под опекой).
// Среда 8 → 6 (17.08): правило максимума шести повторов действует на всё,
// кроме чистых ударов (dupl. bot/catalog.E13_RECEPTIONS).
function e13N(code){return {MON:6,WED:6,THU:4,FRI:5}[code]||5;}
// Второй аргумент player — облегчённый режим этого игрока; без него
// возвращается обычное число (для текстов, где игрок не назван).
function receptionsFor(spec,player){
  if(player&&isLight(player))return LIGHT_RECEPTIONS;
  return e13N(spec.code);}
// «Ведение и удар» — 6 повторов во все дни (dupl. bot/catalog.py).
function e10sReps(spec){return REPS.E10S.DANIIL;}
/* «Ты догоняешь» в пятницу короче: он там четвёртым блоком после «Отрыва»
   (4 подхода, dupl. bot/catalog.E12_SHOTS_FRI). */
const E12_SHOTS_FRI=4;
function duelShotsFor(ex,spec,player){
  if(player&&isLight(player))return LIGHT_DUEL_SHOTS;
  if(ex==="E12"&&spec&&spec.code==="FRI")return E12_SHOTS_FRI;
  return EX[ex].shots;}
// Число ударов подсерии «Ударов» и приёмов подсерии «Разворота» — по игроку.
function e10SubShots(sub,player){return isLight(player)?LIGHT_SUB_SHOTS:sub.shots;}
function e07Shots(player){return isLight(player)?LIGHT_REPS.E07/E07_SUBS.length
                                                :REPS.E07.DANIIL/E07_SUBS.length;}
/* Сколько повторов упражнения приходится на игрока сегодня — одна точка
   истины для экрана расстановки, пропуска пустых блоков и отчёта. */
function plannedReps(ex,spec,pl){
  if(ex==="E13")return receptionsFor(spec,pl);
  if(ex==="E12"||ex==="E14")return duelShotsFor(ex,spec,pl);
  if(ex==="E07")return e07Shots(pl)*E07_SUBS.length;
  if(ex==="E10")return isLight(pl)
    ? LIGHT_SUB_SHOTS*e10subs(1).length*LIGHT_E10_SERIES : e10Total();
  // Упражнения без слотов замера: объём задан числом, а не списком попыток.
  if(ex==="E03")return isLight(pl)?LIGHT_REPS.E03:E03_DRILLS.length;
  if(ex==="E23")return isLight(pl)?LIGHT_REPS.E23:E23_ROUNDS;
  if(ex==="E22")return isLight(pl)?lightReps("E22",pl):repsCount("E22",pl);
  if(ex==="E25")return intervalReps("E25",pl);
  if(ex==="E26")return e26Series(pl).reduce((a,b)=>a+b,0);
  const plan=repsFor(ex,spec);
  return (plan[pl]||[]).length;
}
/* Блок целиком пуст, если работы нет ни у одного игрока ЭТОГО режима
   («Разгон» в облегчённом у обоих) — такой блок приложение пропускает.
   Режим передаётся, потому что упражнение может стоять только у одного
   из братьев: второй в это время делает своё. */
function blockHasWork(ex,spec,mode){
  const pls=(mode===undefined)?PLAYERS:playersOfMode(mode);
  return pls.some(pl=>plannedReps(ex,spec,pl)>0);
}
// Игроки, которые реально делают это упражнение сейчас.
function blockPlayers(ex){
  const m=(S&&S.block&&S.block.mode)||undefined;
  const pls=(m===undefined)?PLAYERS:playersOfMode(m);
  return pls.filter(pl=>plannedReps(ex,S.spec,pl)>0);
}
// Объём по игрокам на экране расстановки.
function volumeLines(ex,spec,mode){
  const pls=(mode===undefined)?PLAYERS:playersOfMode(mode);
  return pls.map(pl=>{
    const n=plannedReps(ex,spec,pl);
    if(!n)return `${RU[pl]}: не делает (облегчённый)`;
    return `${RU[pl]}: ${(EX_UNIT[ex]||N_REP)(n)}${isLight(pl)?" (облегчённая)":""}`;
  }).join("\n");
}
// Раз в две недели удлинённый третий длинный забег Даниила (E02).

// SVG-схема дня — коридоры для ПН и ПТ (если есть).
function markupSvg(spec){
  if(spec.control) return "";
  // ПН — два стартовых коридора рядом, тренер на общем финише.
  if(spec.code==="MON"){
    const k=mScale(DIST.E01.DANIIL,190), x0=30, x1=x0+DIST.E01.DANIIL*k;
    return svg(
      cone(x0,45)+cone(x1,45)+arrow(x0+10,45,x1-12,45)+
      dim(x0,68,x1,`старты ${DIST.E01.DANIIL} м`)+
      cone(x0,120)+cone(x1,120)+arrow(x0+10,120,x1-12,120)+
      dim(x0,143,x1,`старты ${DIST.E01.ADRIAN} м`)+
      dimV(14,45,120,E01_LANE_GAP+" м")+coach(x1+45,82,"ТЫ · финиш"));
  }
  // ПТ — «Отрыв»: обе дорожки одним масштабом, ворота справа поперёк.
  if(spec.code==="FRI"){
    const k=mScale(DIST.E15.DANIIL,215), x0=25, xGoal=x0+DIST.E15.DANIIL*k;
    const call=(pl)=>x0+E15_CALL[pl]*k;
    const xA=x0+(DIST.E15.DANIIL-DIST.E15.ADRIAN)*k;   // Адриан ближе к воротам
    return svg(
      goalV(xGoal,80)+
      player(x0,48,"Даниил")+arrow(x0+10,48,xGoal-10,66)+
      cone(call("DANIIL"),48)+lblC(call("DANIIL"),36,`команда ${E15_CALL.DANIIL} м`)+
      dim(x0,72,xGoal,`удар ~${DIST.E15.DANIIL} м`)+
      player(xA,118,"Адриан")+arrow(xA+10,118,xGoal-8,96)+
      cone(xA+E15_CALL.ADRIAN*k,118)+
      lblC(xA+E15_CALL.ADRIAN*k,140,`команда ${E15_CALL.ADRIAN} м`)+
      dim(xA,148,xGoal,`удар ~${DIST.E15.ADRIAN} м`));
  }
  return "";
}
function dayMarkup(spec){
  const modes=modesToday();
  const listOf=(m)=>planFor(m,spec).blocks.map((b,i)=>{
    const ex=b[0], name=(EX[ex]||{name:ex}).name;
    let snip=txt(MARKUP_SNIPPET[ex]||"по описанию упражнения",spec);
    if(ex==="E13") snip+="\nПриёмов сегодня: "+receptionsFor(spec)+".";
    return `${i+1}. ${name}\n   ${snip.replace(/\n/g,"\n   ")}`;
  }).join("\n\n");
  // Идут оба режима — два пронумерованных списка с подзаголовками.
  const text=(modes.length>1)
    ? modes.map(m=>`РЕЖИМ ${m} · ${planFor(m,spec).goal}\n\n${listOf(m)}`).join("\n\n")
    : listOf(modes[0]||MODE_MAIN);
  return {text, svg:markupSvg(spec)};
}

/* Прыжки из разминки понедельника убраны 19.08: они стали упражнением
   «Прыжки и старт» (E17) с замером времени и стоят первым блоком дня.
   Понедельник поэтому идёт с общей разминкой — те же 15 минут. */
function warmupSteps(spec){
  const code=spec.code;
  if(code==="TUE") return [WU.leg,WU.joints2,WU.dyn3,WU.acc,WU.ladder];       // 3+2+3+3+4 = 15
  return [WU.leg,WU.joints3,WU.dyn4,WU.acc,WU.ball];                          // 3+3+4+3+2 = 15
}
function cooldownStep(spec){
  const min=COOLDOWN_MIN;
  return {t:"Заминка",min,body:
    (spec.code==="FRI"?"Лёгкий бег 3 минуты.":"Лёгкий бег 2 минуты.")+
    "\nРастяжка по 20 сек: задняя поверхность бедра,\nикры, пах, квадрицепс."};
}

/* ================================================================
   SVG-помощники
   ================================================================ */
/* Схемы рисуются в метрах, а не «на глаз»: у каждой свой масштаб px/м
   (helper mScale), и 10 метров на схеме не могут выглядеть длиннее 35.
   Ворота — прямоугольник ПОПЕРЁК направления атаки, стороны 3:1:
   goalV — атака идёт по горизонтали (створ вытянут по вертикали),
   goalH — атака идёт по вертикали (створ вытянут по горизонтали).
   Игроки и тренер — одинаковые кружки с подписью, тренер подписан «ТЫ». */
const SVG_W=300, SVG_H=170;
const GOAL_LONG=45, GOAL_SHORT=15;      // 3:1
function svg(inner){
  return `<svg class="svg" viewBox="0 0 ${SVG_W} ${SVG_H}">
   <defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
     <path d="M0,0 L7,3 L0,6 Z" fill="#141414"/></marker></defs>${inner}</svg>`;
}
/* Дорожка интервального упражнения: прямая с фишками через равные метры.
   Подписаны первая, последняя и каждая третья — иначе цифры сливаются.
   goalLabel — если в конце дорожки стоят ворота. */
function trackSvg(marks,step,goalLabel){
  const first=marks[0], last=marks[marks.length-1];
  const x0=22, xEnd=goalLabel?244:282, k=(xEnd-x0)/last;
  let inner=`<line x1="${x0}" y1="86" x2="${xEnd}" y2="86" stroke="#888" stroke-width="1"/>`;
  inner+=cone(x0,86)+lblC(x0,110,"0")+lblC(x0,52,"старт");
  marks.forEach((m,i)=>{ const x=x0+m*k;
    inner+=cone(x,86);
    if(i===0||i===marks.length-1||i%3===0) inner+=lblC(x,110,String(m));
  });
  inner+=arrow(x0+10,68,xEnd-8,68)+lblC((x0+xEnd)/2,58,`фишки через ${step} м`);
  inner+=arrow(xEnd-8,132,x0+10,132)+lblC((x0+xEnd)/2,150,"обратно шагом к старту");
  if(goalLabel) inner+=goalV(xEnd+10,86);
  else inner+=coach(x0+8,26,"ТЫ");
  return svg(inner);
}
// Масштаб: сколько пикселей в метре, чтобы totalM уложились в px.
function mScale(totalM,px){ return px/totalM; }
function cone(x,y){return `<circle cx="${x}" cy="${y}" r="5" fill="none" stroke="#141414" stroke-width="2"/>`;}
function ball(x,y){return `<circle cx="${x}" cy="${y}" r="4" fill="#141414"/>`;}
function lbl(x,y,t){return `<text x="${x}" y="${y}" font-size="11" fill="#141414">${t}</text>`;}
// Подпись по центру точки — чтобы не наезжала на соседние.
function lblC(x,y,t){return `<text x="${x}" y="${y}" font-size="11" fill="#141414" text-anchor="middle">${t}</text>`;}
// Подпись, растущая ВЛЕВО от точки — чтобы не наезжала на соседний элемент.
function lblR(x,y,t){return `<text x="${x}" y="${y}" font-size="11" fill="#141414" text-anchor="end">${t}</text>`;}
/* Фигура игрока: одинаковый кружок у обоих братьев и у тренера,
   различает только подпись. Тренер всегда подписан «ТЫ». */
function figure(x,y,label,filled){
  return `<circle cx="${x}" cy="${y}" r="7" fill="${filled?"#141414":"#fff"}" stroke="#141414" stroke-width="2"/>`
    +(label?lblC(x,y+21,label):"");
}
function player(x,y,label){ return figure(x,y,label===undefined?"игрок":label,false); }
function coach(x,y,label){ return figure(x,y,label===undefined?"ТЫ":label,true); }
function goalV(x,cy){
  return `<rect x="${x}" y="${cy-GOAL_LONG/2}" width="${GOAL_SHORT}" height="${GOAL_LONG}" fill="none" stroke="#141414" stroke-width="2.5"/>`;
}
function goalH(cx,y){
  return `<rect x="${cx-GOAL_LONG/2}" y="${y}" width="${GOAL_LONG}" height="${GOAL_SHORT}" fill="none" stroke="#141414" stroke-width="2.5"/>`;
}
// Ломаная со стрелкой на конце — для слалома и зигзага: видно, что игрок
// обводит фишки, а не бежит сквозь них.
function pathArrow(pts){
  return `<polyline points="${pts.map(p=>p[0]+","+p[1]).join(" ")}" fill="none" stroke="#141414" stroke-width="2" marker-end="url(#ar)"/>`;
}
function arrow(x1,y1,x2,y2){return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#141414" stroke-width="2" marker-end="url(#ar)"/>`;}
// Размерная линия с засечками и подписью по центру — под элементами.
function dim(x1,y,x2,t){
  return `<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="#888" stroke-width="1"/>`
    +`<line x1="${x1}" y1="${y-4}" x2="${x1}" y2="${y+4}" stroke="#888" stroke-width="1"/>`
    +`<line x1="${x2}" y1="${y-4}" x2="${x2}" y2="${y+4}" stroke="#888" stroke-width="1"/>`
    +lblC((x1+x2)/2,y+14,t);
}
// Вертикальная размерная линия — для схем, где движение снизу вверх.
function dimV(x,y1,y2,t){
  return `<line x1="${x}" y1="${y1}" x2="${x}" y2="${y2}" stroke="#888" stroke-width="1"/>`
    +`<line x1="${x-4}" y1="${y1}" x2="${x+4}" y2="${y1}" stroke="#888" stroke-width="1"/>`
    +`<line x1="${x-4}" y1="${y2}" x2="${x+4}" y2="${y2}" stroke="#888" stroke-width="1"/>`
    +lbl(x+6,(y1+y2)/2+4,t);
}
function mark(x,y,t){return `<text x="${x}" y="${y}" font-size="13" font-weight="700" fill="#141414">${t}</text>`;}

E18:{ name:"Летящие ускорения", type:"time", stopT:0.15,
  setup:()=>`Три фишки в линию. Первая на нуле — старт.\nВторая через ${E18_RUNUP_M} м — пуск секундомера.\nТретья: Даниилу через ${DIST.E18.DANIIL} м после второй, Адриану через ${DIST.E18.ADRIAN} м.\nИтого дорожка: Даниил ${E18_RUNUP_M+DIST.E18.DANIIL} м, Адриан ${E18_RUNUP_M+DIST.E18.ADRIAN} м.\nТы стоишь у третьей фишки.`,
  svg:()=>{const total=E18_RUNUP_M+DIST.E18.DANIIL, k=mScale(total,215), x0=25;
    const x1=x0+E18_RUNUP_M*k, x2=x0+total*k;

      cone(x0,50)+cone(x1,50)+cone(x2,50)+
      lblC(x0,32,"старт")+

      lblC(x1,32,"пуск")+lblC(x2,32,"стоп")+
      dim(x0,74,x1,"разгон "+E18_RUNUP_M+" м")+
      dim(x1,98,x2,"замер "+DIST.E18.DANIIL+" м")+
      cone(xa,126)+dim(x1,142,xa,"Адриан "+DIST.E18.ADRIAN+" м")+
      coach(x2+30,50,"ТЫ"));},
  steps:(spec)=>[`Первые ${E18_RUNUP_M} метров игрок разгоняется свободно, НЕ на максимум.`,
    "Секундомер ПУСКАЕШЬ, когда он пересекает вторую фишку. ОСТАНАВЛИВАЕШЬ на третьей.",
    "Замеряется только участок на максимальной скорости, без фазы разгона.",
    `${N_RUN(repsCount("E18","DANIIL"))} Даниилу, ${N_RUN(repsCount("E18","ADRIAN"))} Адриану. Отдых ${REST.E18} секунд.`,
    "Финиш пробегает насквозь: тормозить начинает на 3 метра дальше третьей фишки."],
  reps_text:(spec)=>`${PLAYERS.map(pl=>`${RU[pl]}: ${N_RUN(repsOf("E18",pl,spec||S.spec))}, замер ${DIST.E18[pl]} м`).join("\n")}\nОтдых ${REST.E18} сек между своими забегами.`,
  watchNote:E18_WATCH_RULE,
  req:"Отдых две минуты не сокращать: это забег на МАКСИМАЛЬНОЙ скорости, недовосстановленный спринт бьёт по задней поверхности бедра.",
  smotri:"Корпус выпрямлен, шаг длинный, стопа ставится под таз. Руки вдоль тела, не поперёк.",
  oshibka:"Тормозит до третьей фишки. Финиш на 3 м дальше.",
  pravilno:"Между второй и третьей фишкой скорость не растёт и не падает — она уже максимальная.",

  rec:"Записывается время участка после разгона.",
},
E19:{ name:"Повторные рывки с мячом", type:"time_goal", fade:true,

E03:{ name:"Координационная лестница", type:"drills",
  drills:()=>E03_DRILLS, drillSec:()=>E03_DRILL_SEC, itemWord:"Вариант",
  setup:()=>`Лестница на ровном месте, после неё ${E03_ACCEL_M} м свободного пространства для ускорения.\nТы сбоку от лестницы.\nОба работают одновременно: по очереди по ходу, чередования с отдыхом нет.`,
  svg:()=>{const x0=30, cells=8, w=16, xe=x0+cells*w;
    let inner="";
    for(let i=0;i<=cells;i++) inner+=`<line x1="${x0+i*w}" y1="60" x2="${x0+i*w}" y2="96" stroke="#141414" stroke-width="2"/>`;
    inner+=`<line x1="${x0}" y1="60" x2="${xe}" y2="60" stroke="#141414" stroke-width="2"/>`;
    inner+=`<line x1="${x0}" y1="96" x2="${xe}" y2="96" stroke="#141414" stroke-width="2"/>`;
    return svg(inner+
      arrow(xe+8,78,xe+92,78)+lblC(xe+52,64,"ускорение "+E03_ACCEL_M+" м")+
      lblC(x0+cells*w/2,118,"лестница")+
      coach(x0+cells*w/2,32,"ТЫ"));},
  steps:()=>[`ОДИН ПРОХОД ПО КАЖДОМУ ВАРИАНТУ, не серия: ${nOf(E03_DRILLS.length,"вариант","варианта","вариантов")} подряд, по ${E03_DRILL_SEC} секунд каждый.`,
    E03_DRILLS.map((x,i)=>`${i+1}) ${x} — ${E03_DRILL_SEC} сек, затем ускорение ${E03_ACCEL_M} м`).join("\n"),
    `Прошли все ${E03_DRILLS.length} — упражнение закончено, к варианту не возвращаемся.`,
    "Оба работают одновременно — по очереди по ходу, отдельного отдыха между вариантами нет.",
    "Замера нет: это работа на частоту ног, а не на результат.",
    "Стопа ставится в ячейку и снимается сразу — лестницу не топчут."],
  reps_text:(spec)=>`ПО ОДНОМУ ПРОХОДУ на каждый вариант, не серия:\n`
    +E03_DRILLS.map((x,i)=>`  ${i+1}) ${x} — ${E03_DRILL_SEC} сек`).join("\n")

    +`\nПосле каждого варианта ускорение ${E03_ACCEL_M} м. Оба одновременно, замера нет.`,
  smotri:"Частота, а не длина. Взгляд вперёд, а не под ноги.",
  oshibka:"Смотрит в лестницу и ставит стопу с паузой — тогда это ходьба по клеткам.",
  pravilno:"Ноги стучат чаще, чем успевает считать глаз, корпус спокоен.",
  match:"Частота ног в тесноте: перекладывание мяча и мелкие подшагивания перед обводкой.",
  diff:{DANIIL:"Все шесть вариантов.",ADRIAN:"Все шесть вариантов, темп по себе."},
  rec:"Записей нет — упражнение без замера.",
},
E22:{ name:"Звезда", type:"star",
  setup:()=>`Центральная фишка. Вокруг неё ${E22_POINTS} фишек по кругу, радиус ${DIST.E22.DANIIL} м (Адриану ${DIST.E22.ADRIAN} м).\nФишки пронумерованы 1-${E22_POINTS}, номера видны игроку.\nТы стоишь рядом с центром.`,
  svg:()=>{const cx=140, cy=84, r=54;
    let inner=cone(cx,cy)+lblC(cx,cy+20,"центр");
    for(let i=0;i<E22_POINTS;i++){
      const a=-Math.PI/2+i*2*Math.PI/E22_POINTS;
      const x=Math.round(cx+r*Math.cos(a)), y=Math.round(cy+r*Math.sin(a));
      inner+=arrow(cx,cy,x,y);
      inner+=cone(x,y)+lblC(x,y-10,String(i+1));
    }
    return svg(inner+lblC(cx,cy+68,"радиус "+DIST.E22.DANIIL+" м (Адриану "+DIST.E22.ADRIAN+")")+
      coach(cx+92,cy+34,"ТЫ"));},
  steps:(spec)=>["Игрок стоит в центре. Ты называешь номер — он бежит к этой фишке, касается рукой и возвращается в центр.",
    "Как только вернулся, ты называешь следующий номер. Порядок называешь на ходу и меняешь каждый подход.",
    `ОДИН ПОДХОД = ${E22_POINTS} забегов подряд, к каждой фишке по одному разу, без пауз между забегами.`,
    `${N_TRY(repsCount("E22","DANIIL"))} каждому. Отдых ${REST.E22} секунд ТОЛЬКО между подходами.`,
    "Замера нет: считается качество разворота, а не секунды."],
  reps_text:(spec)=>`${PLAYERS.map(pl=>`${RU[pl]}: ${N_TRY(plannedReps("E22",spec||S.spec,pl))}`).join(", ")} по ${E22_POINTS} забегов, отдых ${REST.E22} сек между подходами.\nПорядок номеров меняется каждый подход. Замера нет.`,
  smotri:"Тормозит на трёх шагах, разворот на опорной ноге одним движением, обратно стартует сразу.",
  oshibka:"Добегает до фишки по инерции и разворачивается широкой дугой.",
  pravilno:"Касание и разворот — одно движение, без лишнего шага.",
  match:"Реакция на команду плюс смена направления. Открывание: побежал в одну сторону, тут же в другую.",
  diff:{DANIIL:`Радиус ${DIST.E22.DANIIL} м.`,ADRIAN:`Радиус ${DIST.E22.ADRIAN} м: дистанция короче, разворотов столько же.`},
  rec:"Записей нет — упражнение без замера.",
},
E23:{ name:"Техника бега", type:"drills",

E25:{ name:"Интервалы 30-30", type:"intervals",
  work:()=>E25_WORK_SEC, restSec:()=>E25_REST_SEC, ball:false,
  setup:()=>`Прямая вдоль поля. Фишки через каждые ${E25_CONE_STEP} метров, от ${E25_MARKS[0]} до ${E25_MARKS[E25_MARKS.length-1]} метров — итого ${E25_MARKS.length} фишек.\nИгроки стартуют от нулевой отметки и бегут в одну сторону.\nТы стоишь сбоку и видишь всю дорожку.`,
  svg:()=>trackSvg(E25_MARKS,E25_CONE_STEP,null),
  steps:(spec)=>[`${E25_WORK_SEC} секунд бега на высокой скорости — примерно 80% от максимума, НЕ спринт.`,
    "По сигналу приложения останавливаются ТАМ, ГДЕ ДОБЕЖАЛИ.",
    `${E25_REST_SEC} секунд шагом обратно к старту. Следующий интервал снова от нуля.`,

/* ================================================================
   ПОСТРОЕНИЕ ПОВТОРОВ (слоты для измеряемых упражнений)
   ================================================================ */
function slot(player,ex,variant,dist,no,rest,extra){
  return Object.assign({player,ex,variant,dist,attempt_no:no,rest,goal:false,
    firstRest:false},extra||{});
}
/* Облегчённый режим срезает ХВОСТ серии: остаются первые N слотов, номера
   попыток и порядок вариантов не меняются. Ноль слотов — упражнение у этого
   игрока сегодня не идёт. */
function lightReps(code,pl){
  const n=LIGHT_REPS[code];
  if(n===undefined)return undefined;
  return (typeof n==="object")?n[pl]:n;
}
function lightTrim(code,R){
  if(LIGHT_REPS[code]===undefined)return R;
  PLAYERS.forEach(pl=>{ if(!isLight(pl))return;
    const n=lightReps(code,pl);
    // «Разворот на 180°» режется поровну по подсериям: иначе облегчённый
    // вариант остался бы только на одну сторону.
    if(code==="E24"){
      // Три повтора делятся как 2 + 1: нечётное число на две стороны ровно
      // не ложится, лишний отдаём первой.
      const base=Math.floor(n/E24_SUBS.length), extra=n%E24_SUBS.length, out=[];
      E24_SUBS.forEach((sub,i)=>{ out.push(...(R[pl]||[])
        .filter(sl=>sl.variant===sub.v).slice(0,base+(i<extra?1:0))); });
      R[pl]=out.map((sl,i)=>Object.assign({},sl,{attempt_no:i+1}));
      return;
    }
    R[pl]=(R[pl]||[]).slice(0,n); });
  return R;
}
function repsFor(code,spec){
  const R={DANIIL:[],ADRIAN:[]};
  const push=(pl,arr)=>{R[pl]=arr;};
  if(code==="E17"){
    // «Прыжки и старт»: 3 подхода обоим, прыжков подряд разное число.
    push("DANIIL",[1,2,3].map(n=>slot("DANIIL","E17","",DIST.E17.DANIIL,n,REST.E17)));
    push("ADRIAN",[1,2,3].map(n=>slot("ADRIAN","E17","",DIST.E17.ADRIAN,n,REST.E17)));
  } else if(code==="E01"){
    const dv=[["stance",1],["stance",2],["sit_face",3],["sit_face",4],["lie",5],["sit_back",6]];
    const av=[["stance",1],["stance",2],["sit_back",3],["sit_back",4],["sit_back",5]];
    push("DANIIL",dv.map(([v,n])=>slot("DANIIL","E01",v,DIST.E01.DANIIL,n,REST.E01)));
    push("ADRIAN",av.map(([v,n])=>slot("ADRIAN","E01",v,DIST.E01.ADRIAN,n,REST.E01)));
    R.DANIIL[0].firstRest=true; R.ADRIAN[0].firstRest=true;
  } else if(code==="E02"){
    const bw=e02Biweekly(spec.iso);
    const e2=(pl,v,n)=>slot(pl,"E02",v,DIST.E02[v],n,REST.E02[v]);
    const long3=bw?"30m_fly":"25m_fly";
    push("DANIIL",[e2("DANIIL","20m",1),e2("DANIIL","20m",2),e2("DANIIL","20m",3),
      e2("DANIIL","25m_fly",4),e2("DANIIL","25m_fly",5),e2("DANIIL",long3,6)]);
    push("ADRIAN",[e2("ADRIAN","15m",1),e2("ADRIAN","15m",2),e2("ADRIAN","15m",3),
      e2("ADRIAN","20m",4),e2("ADRIAN","20m",5)]);
  } else if(code==="E06"){
    push("DANIIL",[1,2,3,4,5].map(n=>slot("DANIIL","E06","",DIST.E06.DANIIL,n,REST.E06)));
    push("ADRIAN",[1,2,3,4,5].map(n=>slot("ADRIAN","E06","",DIST.E06.ADRIAN,n,REST.E06)));
  } else if(code==="E04"){
    // В режиме 2 слалом разминочный: 5 проходов вместо шести (repsCount).
    const e04=(pl)=>Array.from({length:repsCount("E04",pl)},(_,i)=>
      slot(pl,"E04","",DIST.E04[pl],i+1,REST.E04[pl],{goal:true}));
    push("DANIIL",e04("DANIIL")); push("ADRIAN",e04("ADRIAN"));
  } else if(code==="E05"){
    // В режиме 2 зигзаг идёт на 5 проходов вместо шести (repsCount).
    const e05=(pl)=>Array.from({length:repsCount("E05",pl)},(_,i)=>
      slot(pl,"E05","",DIST.E05[pl],i+1,REST.E05[pl],{goal:true}));
    push("DANIIL",e05("DANIIL")); push("ADRIAN",e05("ADRIAN"));
  } else if(code==="E10S"){
    const nn=e10sReps(spec);  // 6 повторов во все дни
    push("DANIIL",Array.from({length:nn},(_,i)=>slot("DANIIL","E10S","",DIST.E10S.DANIIL,i+1,REST.E10S,{goal:true})));
    push("ADRIAN",Array.from({length:nn},(_,i)=>slot("ADRIAN","E10S","",DIST.E10S.ADRIAN,i+1,REST.E10S,{goal:true})));
  } else if(code==="E15"){
    // Три забега обоим подряд, без деления на части. Стоп-правила нет
    // (noStop): падение времени здесь — измеряемая величина, а не повод
    // остановить серию. Каждый забег кончается ударом, гол пишется по всем.
    const e15=(pl)=>Array.from({length:E15_REPS},(_,i)=>
      slot(pl,"E15","",DIST.E15[pl],i+1,REST.E15,{goal:true,noStop:true}));
    push("DANIIL",e15("DANIIL")); push("ADRIAN",e15("ADRIAN"));
  } else if(code==="E18"){
    // Замеряется только участок после разгона: distance_m — его длина.
    const e18=(pl)=>Array.from({length:repsCount("E18",pl)},(_,i)=>
      slot(pl,"E18","",DIST.E18[pl],i+1,REST.E18));
    push("DANIIL",e18("DANIIL")); push("ADRIAN",e18("ADRIAN"));
  } else if(code==="E19"){
    // Стоп-правила нет: падение времени и есть измеряемая величина.
    const e19=(pl)=>Array.from({length:repsCount("E19",pl)},(_,i)=>
      slot(pl,"E19","",DIST.E19[pl],i+1,REST.E19[pl],{goal:true,noStop:true}));
    push("DANIIL",e19("DANIIL")); push("ADRIAN",e19("ADRIAN"));
  } else if(code==="E24"){
    // Три повтора через правое плечо, потом три через левое: счёт раздельный.
    const e24=(pl)=>{const out=[]; let n=0;
      E24_SUBS.forEach(sub=>{ for(let i=0;i<sub.reps;i++)
        out.push(slot(pl,"E24",sub.v,DIST.E24[pl],++n,REST.E24)); });
      return out;};
    push("DANIIL",e24("DANIIL")); push("ADRIAN",e24("ADRIAN"));
  } else if(code==="E27"){
    const e27=(pl)=>Array.from({length:repsCount("E27",pl)},(_,i)=>
      slot(pl,"E27","",DIST.E27[pl],i+1,REST.E27,{goal:true}));
    push("DANIIL",e27("DANIIL")); push("ADRIAN",e27("ADRIAN"));
  } else if(code==="E08"){
    push("DANIIL",[1,2,3,4,5].map(n=>slot("DANIIL","E08_D","",DIST.E08_D.DANIIL,n,REST.E08,{goal:true})));
    push("ADRIAN",[1,2,3,4,5].map(n=>slot("ADRIAN","E08_A","",DIST.E08_A.ADRIAN,n,REST.E08,{goal:true})));
    return R;      // контрольный день: облегчённого режима там нет
  }
  return lightTrim(code,R);
}
/* ================================================================
   ХРАНЕНИЕ
   ================================================================ */
function loadAttempts(){return JSON.parse(localStorage.getItem("trening_attempts")||"[]");}
function saveAttempts(a){localStorage.setItem("trening_attempts",JSON.stringify(a));}
function records(){return JSON.parse(localStorage.getItem("trening_records")||"{}");}
function pctRecords(){return JSON.parse(localStorage.getItem("trening_pct")||"{}");}
// Рекорды дистанции интервальных упражнений (среднее за занятие).
function distRecords(){return JSON.parse(localStorage.getItem("trening_dist")||"{}");}

/* РЕКОРДЫ. Приложение считает их САМО по своей истории в localStorage:
   слепок «Импорт рекордов» тренер вставляет уже после занятия, и на экране
   итога сравнивать было бы не с чем. Слепок при этом не игнорируется — он
   помнит занятия, проведённые до установки приложения, поэтому берётся
   лучшее из двух источников.

   В рекорд не идут потери мяча и попытки с пометкой «сбой замера»
   (dupl. bot/rules.py counts_for_record). История — строго ДО текущего дня. */
const BROKEN_NOTE="сбой замера";
function countsForRecord(a){
  return !a.is_warmup && !a.lost && a.time_sec!==null && a.time_sec!==undefined
    && String(a.note||"").indexOf(BROKEN_NOTE)<0;
}
/* История для рекордов — строго ДО текущего дня и БЕЗ облегчённых занятий:
   объём там другой, «2 из 2 (100%)» дало бы непобиваемый рекорд процента,
   а три забега вместо шести — лучшее время на свежих ногах
   (dupl. bot/storage.py _RECORD_COND). */
function historyBefore(player,ex,day){
  // Режим программы тоже фильтр: слалом на пять проходов в режиме 2 и на
  // шесть в режиме 1 — разные условия, общего рекорда у них нет.
  const m=modeOf(player);
  return loadAttempts().filter(a=>a.player===player&&a.exercise_id===ex
    &&a.date<day&&!a.light&&((a.mode||MODE_MAIN)===m));
}
/* Слепок из ответа бота помечен режимом: ключ «E04|» — режим 1, «E04|@2» —
   режим 2. Старые слепки без пометки читаются как режим 1. */
function snapRecord(snap,ex,variant,mode){
  if(!snap)return undefined;
  const base=ex+(variant===undefined||variant===null?"":"|"+(variant||""));
  const key=(mode===MODE_SPEED)?base+"@2":base;
  return snap[key];
}
// Лучшее время за всю историю до этого занятия: локальная база плюс слепок.
function timeRecord(player,ex,variant,day){
  const local=historyBefore(player,ex,day)
    .filter(a=>(a.variant||"")===(variant||"")&&countsForRecord(a))
    .map(a=>a.time_sec);
  const snap=snapRecord(records()[player],ex,variant,modeOf(player));
  const all=local.concat((snap===undefined||snap===null)?[]:[snap]);
  return all.length?Math.min(...all):null;
}
// Лучший процент попадания за занятие до этого дня: локальная база и слепок.
function ratioRecord(player,ex,day,variant){
  const byDay={};
  historyBefore(player,ex,day).forEach(a=>{
    if((variant!==undefined&&variant!==null)&&(a.variant||"")!==variant)return;
    if(a.lost&&!LOST_IS_RESULT.has(a.exercise_id))return;
    if(!a.shots)return;
    const d=byDay[a.date]=byDay[a.date]||{g:0,s:0};
    d.g+=a.goals||0; d.s+=a.shots;
  });
  const local=Object.values(byDay).filter(d=>d.s).map(d=>100*d.g/d.s);
  const snap=(variant===undefined||variant===null)
    ?snapRecord(pctRecords()[player],ex,undefined,modeOf(player)):undefined;
  const all=local.concat((snap===undefined||snap===null)?[]:[snap]);
  return all.length?Math.max(...all):null;
}
function unsynced(){return loadAttempts().filter(a=>!a.uploaded).length;}
function uuid(){return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{
  const r=Math.random()*16|0,v=c==='x'?r:(r&0x3|0x8);return v.toString(16);});}
function nowIso(){return new Date().toISOString();}
let S=null, sessionTimer=null, lastDrink=0;
function saveSession(){ if(S) localStorage.setItem("trening_session",JSON.stringify(S)); }
function clearSession(){ localStorage.removeItem("trening_session"); S=null;
  if(sessionTimer){clearInterval(sessionTimer);sessionTimer=null;} }
// Поля записи из «слотовых» полей — один маппер на запись и перезапись.
function attemptFields(o){
  return {player:o.player,day_code:S.spec.day_code,
    exercise_id:o.ex||o.exercise_id,variant:o.variant||"",
    attempt_no:o.attempt_no||0,is_warmup:false, // пробных больше нет
    time_sec:(o.time_sec!==undefined&&o.time_sec!==null)?Number(Number(o.time_sec).toFixed(2)):null,
    distance_m:o.dist||o.distance_m||null,control:o.control??null,goals:o.goals??null,
    shots:o.shots??null,wellbeing:o.wellbeing??null,
    shortened:!!(S&&S.shortened),note:o.note||"",lost:!!o.lost,
    interrupted:!!(S&&S.interrupted),
    // Облегчённый режим и программа — по игроку: у второго брата свои.
    light:isLight(o.player),mode:modeOf(o.player)};
}
function pushAttempt(o){
  const a=loadAttempts();
  const rec=Object.assign({uuid:uuid(),timestamp:nowIso(),date:S.spec.iso},
                          attemptFields(o),{uploaded:false});
  a.push(rec); saveAttempts(a); S.attempts.push(rec); saveSession(); return rec;
}
// Перезапись существующей попытки (кнопка «Назад»): uuid, дата и номер
// остаются прежними, меняется только результат — новая запись не создаётся
// и нумерация не сдвигается.
function rewriteAttempt(id,o){
  const fields=attemptFields(o);
  const all=loadAttempts(), i=all.findIndex(x=>x.uuid===id);
  if(i>=0){ Object.assign(all[i],fields); saveAttempts(all); }
  const j=S.attempts.findIndex(x=>x.uuid===id);
  if(j>=0) Object.assign(S.attempts[j],fields);
  saveSession();
  return j>=0?S.attempts[j]:null;
}
function writeWellbeing(){ for(const pl of PLAYERS){ if(S.wellbeing[pl]!==undefined)
  pushAttempt({player:pl,ex:"E00",wellbeing:S.wellbeing[pl],note:"самочувствие",time_sec:null}); } }
function recordFor(player,ex,variant){const r=records()[player]; if(!r)return null;
  return r[ex+"|"+(variant||"")]??null;}
function prevToday(player,ex,variant){
  const l=S.attempts.filter(a=>a.player===player&&a.exercise_id===ex&&(a.variant||"")===(variant||"")&&a.time_sec!==null&&!a.lost);
  return l.length?l[l.length-1].time_sec:null;}

/* ЗАНЯТИЕ ЦЕЛИКОМ ОБОРВАНО тренером (жара, самочувствие) — «Отмена занятия».
   Записи сохраняются, но помечаются interrupted: в рекорды и недельные
   проценты они не идут, потому что оборвано занятие, а не упражнение.
   Это ЕДИНСТВЕННОЕ место, где флаг ставится. Пропуск упражнения его НЕ
   ставит: shots там равен фактически выполненным повторам, процент честный,
   а замеры времени сделанных повторов сравнимы с любыми другими. */
function markInterrupted(){
  if(!S)return;
  S.interrupted=true;
  const mine=new Set((S.attempts||[]).map(a=>a.uuid));
  const all=loadAttempts();
  all.forEach(a=>{ if(mine.has(a.uuid)){a.interrupted=true;a.uploaded=false;} });
  saveAttempts(all);
  (S.attempts||[]).forEach(a=>{a.interrupted=true;});
  saveSession();
}
function cancelSession(){ markInterrupted(); closeOverlay(); stopCountdown();
  stopRestBadge(); screenHome(); }
/* ПРОПУСК УПРАЖНЕНИЯ — по ИГРОКУ, не по занятию. Применяется к тому, чья
   очередь сейчас на экране: он выбывает из этого упражнения, второй
   доделывает свои повторы до конца (без чередования, с обычным отдыхом).
   Нажали ещё раз, когда очередь второго — упражнение закрывается целиком
   и занятие идёт со следующего блока. Раньше кнопка называлась «Завершить
   упражнение» и закрывала блок сразу обоим.

   В записях пропуск отражается ОТСУТСТВИЕМ записей — ни отдельного флага,
   ни пометки interrupted. Сделал 2 повтора из 6 и пропустил остальные —
   записей две, shots = 2, процент считается от двух. Данные нормальные:
   они идут в рекорды и недельные проценты как обычные. */
function skippedPlayers(){ return (S.block&&S.block.skip)||{}; }
function isSkipped(pl){ return !!skippedPlayers()[pl]; }
// Чей повтор сейчас на экране — одна точка на все типы упражнений.
function currentWorkPlayer(){
  if(!S)return null;
  if(S.measure&&S.measure.order[S.measure.pos])return S.measure.order[S.measure.pos].player;
  if(S.ctrl&&S.ctrl.order[S.ctrl.pos])return S.ctrl.order[S.ctrl.pos].player;
  if(S.duelrun&&S.duelrun.order[S.duelrun.pos])return S.duelrun.order[S.duelrun.pos].player;
  if(S.star&&S.star.order[S.star.pos])return S.star.order[S.star.pos].player;
  if(S.four)return S.four.player;
  if(S.shots)return S.shots.player;
  return null;
}
function confirmSkipExercise(){
  const name=(S&&S.block&&EX[S.block.ex])?EX[S.block.ex].name:"упражнение";
  const pl=currentWorkPlayer();
  if(!pl) return overlay(`<div class="card"><div class="title">Пропустить «${name}»?</div>
    <div class="note">Занятие продолжится со следующего блока — это НЕ отмена занятия.</div>
    <div class="row"><button class="go" onclick="finishExercise()">Да</button>
      <button class="ghost" onclick="closeOverlay()">Отмена</button></div></div>`);
  const other=pl==="DANIIL"?"ADRIAN":"DANIIL";
  const alone=isSkipped(other);
  overlay(`<div class="card"><div class="title">Пропустить упражнение для ${RU[pl]}?</div>
    <div class="note">${alone?`${RU[other]} уже пропустил — упражнение закроется целиком.`
                             :`${RU[other]} продолжит.`}</div>
    <div class="row"><button class="go" onclick="skipExercise('${pl}')">Да</button>
      <button class="ghost" onclick="closeOverlay()">Отмена</button></div></div>`);
}
function skipExercise(pl){
  if(!S.block)S.block={ex:(S.measure||S.ctrl||S.duelrun||{}).ex||""};
  S.block.skip=S.block.skip||{};
  S.block.skip[pl]=true;
  closeOverlay(); stopCountdown(); stopRestBadge();
  if(S._restTimer){clearInterval(S._restTimer);S._restTimer=null;}
  if(S.watch&&S.watch.running){S.watch.running=false;
    if(S.watch.raf)cancelAnimationFrame(S.watch.raf);}
  saveSession();
  // Оба пропустили — упражнение закрыто; иначе второй доигрывает своё.
  if(PLAYERS.every(p=>isSkipped(p))) return closeExercise();
  if(S.measure)return measureAdvance();
  if(S.ctrl)return ctrlAdvance();
  if(S.duelrun)return duelRunAdvance();
  if(S.star)return starAdvance();
  if(S.four)return fourNextPlayer();
  if(S.shots)return shotsSkipPlayer();
  // У блоков без чередования (лестница, техника бега, интервалы) пропуск
  // одного игрока экран не меняет: работают все, кто остался.
  if(S.drills||S.iv)return resumeStep();
  return closeExercise();
}
function closeExercise(){
  closeCurrentWork();
  saveSession(); nextStep();
}
function closeCurrentWork(){
  closeOverlay(); stopCountdown(); stopRestBadge();
  if(S._restTimer){clearInterval(S._restTimer);S._restTimer=null;}
  if(S.watch&&S.watch.running){S.watch.running=false;
    if(S.watch.raf)cancelAnimationFrame(S.watch.raf);}
  ["measure","ctrl","duelrun","four","shots","drills","star","iv"].forEach(k=>{delete S[k];});
}
/* Закрыть упражнение обоим сразу. Отдельная точка входа: сюда приходят из
   подтверждения, когда чья-то очередь не определена (экраны без повторов).
   Прерванным занятие при этом НЕ становится: сколько успели — столько
   и записано, и это нормальные данные. */
function finishExercise(){ closeExercise(); }

// Шапка экрана ввода счёта: игрок · упражнение · «Выполнено <word>: N».
/* Шапка блока. done задан — показываем реальный прогресс «выполнено X из N»;
   не задан (агрегатный ввод после серии) — сколько всего в блоке. Раньше
   писалось «Выполнено подходов: 5», когда выполнен был один: из-за этого
   казалось, что серия идёт по второму кругу. */
function countHeader(player,exName,n,word,done){
  const line=(done===undefined||done===null)
    ? `Всего ${word} в блоке: ${n}`
    : `Выполнено ${word}: ${done} из ${n}`;
  return `<div class="card"><div class="name" style="font-size:22px">${RU[player]||player} · ${exName}</div>
    <div class="note">${line}</div></div>`;
}
/* Состояние отдыха второго брата на экране того, кто работает: «Даниил
   отдыхает, готов через 0:34». Тикает раз в секунду, по готовности исчезает. */
let restTimer=null;
function stopRestBadge(){ if(restTimer){clearInterval(restTimer);restTimer=null;} }
function restBadge(elId,player,readyAt){
  stopRestBadge();
  const tick=()=>{
    const el=document.getElementById(elId);
    if(!el){ stopRestBadge(); return; }
    const left=Math.ceil((readyAt-Date.now())/1000);
    if(left<=0){ el.textContent=`${RU[player]} готов`; stopRestBadge(); return; }
    const m=Math.floor(left/60), sec=String(left%60).padStart(2,"0");
    el.textContent=`${RU[player]} отдыхает, готов через ${m}:${sec}`;
  };
  tick(); restTimer=setInterval(tick,1000);
}

/* Ручное обновление: если телефон всё же держит старую сборку. Сносит кэши
   и воркер и перезагружает страницу с сервера. Данные занятий лежат в
   localStorage и не трогаются. Только при сети: без неё это оставило бы
   приложение без офлайн-кэша прямо на поле. */
function confirmUpdate(){
  if(navigator.onLine===false){
    return overlay(`<div class="card"><div class="title">Нет сети</div>
      <div class="note">Обновление возможно только с интернетом: без него
      приложение осталось бы без офлайн-кэша.</div>
      <div class="row"><button class="ghost" onclick="closeOverlay()">Понятно</button></div></div>`);
  }
  overlay(`<div class="card"><div class="title">Обновить приложение?</div>
    <div class="note">Сейчас: ${buildLabel()}.<br>Страница перезагрузится с сервера.
    Записи занятий и рекорды сохранятся.</div>
    <div class="row"><button class="go" onclick="forceUpdate()">Обновить</button>
      <button class="ghost" onclick="closeOverlay()">Отмена</button></div></div>`);
}
function forceUpdate(){
  const reload=()=>location.replace(location.pathname+"?u="+Date.now());
  const jobs=[];
  if(window.caches&&caches.keys)
    jobs.push(caches.keys().then(ks=>Promise.all(ks.map(k=>caches.delete(k)))));
  if(navigator.serviceWorker&&navigator.serviceWorker.getRegistrations)
    jobs.push(navigator.serviceWorker.getRegistrations()
      .then(rs=>Promise.all(rs.map(r=>r.unregister()))));
  Promise.all(jobs).then(reload,reload);
}

/* ================================================================
   ПОСТРОЕНИЕ ПОСЛЕДОВАТЕЛЬНОСТИ И ПОТОК
   ================================================================ */
/* Занятие собирается ПО НОМЕРАМ БЛОКОВ. Порядок задаёт режим 1; игрок
   в режиме 2 в это же место занятия делает своё упражнение того же номера.
   Если братья идут разными режимами, в одном номере блока стоят два разных
   упражнения — каждое со своим набором экранов и только со своим игроком
   (одна пара рук и один секундомер на двоих; чередовать два РАЗНЫХ
   упражнения внутри одного блока приложение не берётся). */
function buildSteps(){
  const steps=[];
  for(const w of warmupSteps(S.spec)) steps.push({kind:"timer",title:w.t,mins:w.min,body:w.body});
  const modes=modesToday();
  const plans=modes.map(m=>({m,blocks:planFor(m,S.spec).blocks}));
  const total=Math.max(...plans.map(p=>p.blocks.length));
  // Пауза 1 мин ПЕРЕД каждым номером блока (после разминки и между блоками).
  for(let i=0;i<total;i++){
    const slots=plans.map(p=>({m:p.m,b:p.blocks[i]}))
      .filter(x=>x.b&&blockHasWork(x.b[0],S.spec,x.m));
    if(!slots.length)continue;
    steps.push({kind:"pause"});
    slots.forEach(({m,b})=>{
      steps.push({kind:"setup",ex:b[0],mins:b[1],mode:m});
      steps.push({kind:"what",ex:b[0],mode:m});
      steps.push({kind:"work",ex:b[0],mins:b[1],mode:m});
    });
  }
  const cd=cooldownStep(S.spec);
  steps.push({kind:"timer",title:cd.t,mins:cd.min,body:cd.body});
  steps.push({kind:"summary"});
  S.steps=steps; S.stepIndex=0; S.startMs=performance.now();
  startSessionClock(); saveSession(); runStep();
}
function nextStep(){S.stepIndex++;runStep();}
function runStep(){
  saveSession();
  if(S.stepIndex>=S.steps.length)return screenSummary();
  const st=S.steps[S.stepIndex];
  S.block = (st.ex?{ex:st.ex,mode:st.mode}:S.block);
  if(st.kind==="timer")return screenTimer(st);
  if(st.kind==="pause")return screenPause();
  if(st.kind==="setup")return screenSetup(st);
  if(st.kind==="what")return screenWhat(st);
  if(st.kind==="work")return startWork(st);
  if(st.kind==="summary")return screenSummary();
}

/* ---- Питьевой таймер каждые 15 минут ---- */
function startSessionClock(){
  lastDrink=0; if(sessionTimer)clearInterval(sessionTimer);
  sessionTimer=setInterval(()=>{
    const min=(performance.now()-S.startMs)/60000;
    if(min>=lastDrink+15){lastDrink=Math.floor(min/15)*15;showDrink();}
  },5000);
}

/* ================================================================
   ЭКРАН 3 · РАБОТА — по типу упражнения
   ================================================================ */
function startWork(st){
  // Хвост предыдущего упражнения в новом блоке жить не должен: иначе
  // «чья сейчас очередь» читается из чужого состояния.
  ["measure","ctrl","duelrun","four","shots","drills","star","iv"].forEach(k=>{delete S[k];});
  // skip — кто пропустил ЭТО упражнение; на каждом блоке заново.
  const e=EX[st.ex]; S.block={ex:st.ex,mode:st.mode,skip:{}};
  if(e.type==="duel")return workDuel(st);
  if(e.type==="duel_goals")return workDuelGoals(st);
  if(e.type==="shots")return workShots(st);
  if(e.type==="control")return workControl(st);
  if(e.type==="four")return workFour(st);
  if(e.type==="drills")return workDrills(st);
  if(e.type==="star")return workStar(st);
  if(e.type==="intervals")return workIntervals(st);
  if(e.type==="breakaway")return startMeasure(st);
  return startMeasure(st); // time, time_goal
}
function workDuel(st){
  const e=EX[st.ex];
  h(`<h1>${e.name}</h1>
    <div class="card"><div class="badge">Без ввода</div>
      <div class="note" style="margin-top:8px">${txt(e.reps_text)}</div></div>
    <div class="row"><button class="go" onclick="nextStep()">Готово</button></div>
    ${smallActions()}`);
}
/* Единоборства с учётом голов (E12, E14) ведутся ПО ПОДХОДАМ: строгое
   чередование, после каждого подхода три кнопки — гол, ушёл (обыграл),
   не ушёл (не обыграл). Общего ввода голов в конце нет: держать счёт
   в голове через десять подходов тренер не обязан.
   Отдых от своего финиша есть в обоих: в «Ты догоняешь» 90 с (рывок
   с сопротивлением на 20 м), в «Обыгрыше лицом» 40 с (18.08). */
const DUEL_WORDS={
  E12:{ok:"УШЁЛ",no:"НЕ УШЁЛ",lost:"Не ушёл",note:"не ушёл от опеки",
       hint:"ГОЛ — ушёл от опеки и забил · УШЁЛ — ушёл от опеки, но не забил · "+
            "НЕ УШЁЛ — не смог уйти, потерял мяч или ты его накрыл."},
  E14:{ok:"ОБЫГРАЛ",no:"НЕ ОБЫГРАЛ",lost:"Не обыграл",note:"не обыграл",
       hint:"ГОЛ — обыграл и забил · ОБЫГРАЛ — обыграл, но не забил · "+
            "НЕ ОБЫГРАЛ — не прошёл защитника."},
};
// Значения читаются в момент вызова: сами константы объявлены ниже.
function duelRestFor(ex){ return {E12:E12_REST_SEC,E14:E14_REST_SEC}[ex]||0; }
function workDuelGoals(st){ return duelRunStart(st); }
function duelRunStart(st){
  // Игроки независимы: у каждого своё число подходов (в облегчённом — два).
  const mine=blockPlayers(st.ex);
  const N={DANIIL:0,ADRIAN:0};
  mine.forEach(pl=>{N[pl]=duelShotsFor(st.ex,S.spec,pl);});
  const order=[];
  for(let i=1;i<=Math.max(N.DANIIL,N.ADRIAN);i++)
    for(const pl of PLAYERS) if(i<=N[pl]) order.push({player:pl,no:i,N:N[pl]});
  S.duelrun={ex:st.ex,N:Math.max(N.DANIIL,N.ADRIAN),byPlayer:N,pos:0,order,
             readyAt:{DANIIL:0,ADRIAN:0}};
  duelRunAdvance();
}
function duelRunAdvance(){
  const d=S.duelrun;
  while(d.pos<d.order.length&&isSkipped(d.order[d.pos].player))d.pos++;
  if(d.pos>=d.order.length){        // всё записано по ходу — ввода не нужно
    delete S.duelrun; saveSession(); return nextStep();
  }
  const cur=d.order[d.pos];
  return (d.readyAt[cur.player]-Date.now()>0)?duelRunRest(cur):duelRunRep(cur);
}
function duelRunRep(cur){
  const d=S.duelrun, other=cur.player==="DANIIL"?"ADRIAN":"DANIIL";
  const w=DUEL_WORDS[d.ex], rest=duelRestFor(d.ex);
  const done=d.order.slice(0,d.pos).filter(o=>o.player===cur.player).length;
  h(`${countHeader(cur.player,EX[d.ex].name+lightTag(cur.player),cur.N,"подходов",done)}
    <div class="title">${RU[cur.player]} · подход ${cur.no} из ${cur.N}</div>
    <div class="note">Второй в это время отдыхает.${rest?` Отдых ${rest} секунд
    от своего финиша — приложение следит.`:""}</div>
    <div class="row"><button class="go" onclick="duelRunDone('goal')">⚽ ГОЛ</button></div>
    <div class="row"><button onclick="duelRunDone('pass')">✓ ${w.ok}</button>
      <button class="warn" onclick="duelRunDone('lost')">✕ ${w.no}</button></div>
    <div class="note">${w.hint}</div>
    ${otherRestHtml()}
    ${smallActions()}`);
  if(d.readyAt[other]>Date.now()) restBadge("rest-other",other,d.readyAt[other]);
  else stopRestBadge();
}
function duelRunDone(kind){
  const d=S.duelrun, cur=d.order[d.pos], w=DUEL_WORDS[d.ex];
  pushAttempt({player:cur.player,ex:d.ex,attempt_no:cur.no,shots:1,
    goals:kind==="goal"?1:0,lost:kind==="lost",
    note:kind==="lost"?w.note:""});
  d.readyAt[cur.player]=Date.now()+duelRestFor(d.ex)*1000;
  d.pos++; saveSession(); duelRunAdvance();
}
function duelRunRest(cur){
  const d=S.duelrun, target=d.readyAt[cur.player];
  h(`<h1>Отдых</h1>
    <div class="card center"><div class="sub">следующий</div>
      <div class="name">${RU[cur.player]}</div>
      <div class="note">подход ${cur.no} из ${cur.N} · готов в ${hhmmss(new Date(target))}</div>
      <div class="big" id="rc"></div></div>
    <div class="row"><button class="ghost" onclick="duelRunSkipRest()">Пропустить отдых</button></div>
    ${smallActions()}`);
  countdownTo(target,"rc",()=>duelRunAdvance());
}
function duelRunSkipRest(){ stopCountdown();
  const d=S.duelrun; d.readyAt[d.order[d.pos].player]=Date.now(); duelRunAdvance(); }

/* ---- РЕЖИМ 2: упражнения без замера ---------------------------------
   Три типа работы, у которых нет секундомера и нет записей:
     drills    — список упражнений подряд (лестница, техника бега);
     star      — подходы с отдыхом между ними («Звезда»);
     intervals — таймер работа/шаг, оба брата работают ОДНОВРЕМЕННО.
   Записей они не создают: мерить там нечего, а придумывать оценку «на глаз»
   значит засорять историю числами, которые ни с чем не сравнить. */
function workDrills(st){
  const e=EX[st.ex], list=e.drills();
  // Круги есть только у «Техники бега»: пять упражнений и заново.
  const rounds=e.rounds?Math.max(...blockPlayers(st.ex)
    .map(pl=>plannedReps(st.ex,S.spec,pl))):1;
  const n=e.rounds?list.length:Math.max(...blockPlayers(st.ex)
    .map(pl=>plannedReps(st.ex,S.spec,pl)));
  S.drills={ex:st.ex,pos:0,round:1,rounds,n};
  drillsRender();
}
function drillsRender(){
  const d=S.drills, e=EX[d.ex], list=e.drills();
  if(d.pos>=d.n){
    if(d.round<d.rounds){ d.round++; d.pos=0; }
    else { delete S.drills; saveSession(); return nextStep(); }
  }
  const name=list[d.pos], sec=e.drillSec?e.drillSec():null;
  // Счётчик показывает и круг, и место в круге: «Круг 1 из 2, упражнение
  // 3 из 5». Где кругов нет (лестница) — просто «Вариант 2 из 6».
  const counter=d.rounds>1
    ? `Круг ${d.round} из ${d.rounds}, упражнение ${d.pos+1} из ${d.n}`
    : `${e.itemWord||"Упражнение"} ${d.pos+1} из ${d.n}`;
  const last=(d.pos===d.n-1);
  h(`<h1>${e.name}</h1>
    <div class="card center"><div class="sub">${counter}</div>
      <div class="name" style="font-size:24px">${name}</div>
      <div class="note">${sec?`${sec} секунд, затем ускорение ${E03_ACCEL_M} м`
                            :`${E23_LEG_M} метров, обратно шагом`}</div>
      <div class="note">Оба работают одновременно — по одной дорожке или рядом.
      Чередования нет, замера нет.</div>
      ${(last&&d.round<d.rounds)?`<div class="note">Дальше круг ${d.round+1}:
      отдельного отдыха между кругами нет, возврат шагом после этого
      упражнения и есть пауза (~${E23_WALK_BACK_SEC} секунд).</div>`:""}</div>
    <div class="row"><button class="go" onclick="drillsNext()">Готово</button></div>
    ${smallActions()}`);
}
function drillsNext(){ S.drills.pos++; saveSession(); drillsRender(); }

/* «Звезда»: подход — пять забегов подряд к пронумерованным фишкам, между
   подходами отдых. Порядок номеров тренер называет на ходу, поэтому
   приложение его не подсказывает — оно ведёт счёт подходов и отдых. */
function workStar(st){
  const N={}; blockPlayers(st.ex).forEach(pl=>{N[pl]=plannedReps(st.ex,S.spec,pl);});
  const order=[], mx=Math.max(0,...Object.values(N));
  for(let i=1;i<=mx;i++) for(const pl of PLAYERS) if(N[pl]>=i)order.push({player:pl,no:i,N:N[pl]});
  S.star={ex:st.ex,order,pos:0,readyAt:{DANIIL:0,ADRIAN:0}};
  starAdvance();
}
function starAdvance(){
  const t=S.star;
  while(t.pos<t.order.length&&isSkipped(t.order[t.pos].player))t.pos++;
  if(t.pos>=t.order.length){ delete S.star; saveSession(); return nextStep(); }
  const cur=t.order[t.pos];
  return (t.readyAt[cur.player]-Date.now()>0)?starRest(cur):starRep(cur);
}
function starRep(cur){
  const t=S.star, e=EX[t.ex], other=cur.player==="DANIIL"?"ADRIAN":"DANIIL";
  const done=t.order.slice(0,t.pos).filter(o=>o.player===cur.player).length;
  h(`${countHeader(cur.player,e.name+lightTag(cur.player),cur.N,"подходов",done)}
    <div class="title">${RU[cur.player]} · подход ${cur.no} из ${cur.N}</div>
    <div class="note">${E22_POINTS} забегов подряд, к каждой фишке по одному разу,
    без пауз. Номера называешь на ходу и меняешь каждый подход.
    Отдых ${REST.E22} секунд от своего финиша — приложение следит.</div>
    <div class="row"><button class="go" onclick="starDone()">Подход сделан</button></div>
    ${otherRestHtml()}
    ${smallActions()}`);
  if(t.readyAt[other]>Date.now()) restBadge("rest-other",other,t.readyAt[other]);
  else stopRestBadge();
}
function starDone(){
  const t=S.star, cur=t.order[t.pos];
  t.readyAt[cur.player]=Date.now()+REST.E22*1000;
  t.pos++; saveSession(); starAdvance();
}
function starRest(cur){
  const t=S.star, target=t.readyAt[cur.player];
  h(`<h1>Отдых</h1>
    <div class="card center"><div class="sub">следующий</div>
      <div class="name">${RU[cur.player]}</div>
      <div class="note">подход ${cur.no} из ${cur.N} · готов в ${hhmmss(new Date(target))}</div>
      <div class="big" id="rc"></div></div>
    <div class="row"><button class="ghost" onclick="starSkipRest()">Пропустить отдых</button></div>
    ${smallActions()}`);
  countdownTo(target,"rc",()=>starAdvance());
}
function starSkipRest(){ stopCountdown();
  const t=S.star; t.readyAt[t.order[t.pos].player]=Date.now(); starAdvance(); }

/* Интервалы: оба брата работают ОДНОВРЕМЕННО, поэтому чередования нет —
   приложение ведёт таймер работа/шаг и считает отрезки. Число отрезков
   у братьев разное: у кого они кончились, тот идёт шагом.

   МЕРИТСЯ ДИСТАНЦИЯ, а не время: за фиксированные 30 (или 15) секунд игрок
   пробегает столько, на сколько хватает темпа. Сразу после сигнала конца
   работы приложение показывает экран ввода на каждого игрока — тренер
   успевает записать обоих, пока идёт отдых: отдых отсчитывается от МОМЕНТА
   КОНЦА РАБОТЫ, а не от закрытия экрана ввода.
   Последний отрезок серии в «Интервалах с мячом» кончается рывком к воротам
   и ударом — там вместо дистанции спрашивается гол. */
function workIntervals(st){
  const e=EX[st.ex];
  const series={}; blockPlayers(st.ex).forEach(pl=>{
    series[pl]=e.series?e26Series(pl):[intervalReps(st.ex,pl)];});
  const maxSeries=Math.max(1,...Object.values(series).map(x=>x.length));
  S.iv={ex:st.ex,series,maxSeries,s:0,leg:0,phase:"work",restFrom:0};
  ivRender();
}
// Сколько отрезков в этой серии у самого «длинного» игрока.
function ivLegs(iv,s){
  return Math.max(0,...Object.values(iv.series).map(x=>x[s]||0));
}
// Игроки, у которых этот отрезок ещё есть.
function ivPlayers(iv){
  return PLAYERS.filter(pl=>(iv.series[pl]||[])[iv.s]>iv.leg&&!isSkipped(pl));
}
// Последний отрезок серии — тот, что кончается ударом (у «с мячом»).
function ivIsLast(iv){ return iv.leg===ivLegs(iv,iv.s)-1; }
function ivRender(){
  const iv=S.iv, e=EX[iv.ex];
  const legs=ivLegs(iv,iv.s);
  if(iv.leg>=legs) return ivNextSeries();
  const work=iv.phase==="work";
  const sec=work?e.work():e.restSec();
  // Отдых считается от конца работы: ввод дистанции идёт внутри него.
  const target=(work?Date.now():(iv.restFrom||Date.now()))+sec*1000;
  const who=ivPlayers(iv).map(pl=>RU[pl]).join(" и ");
  const last=ivIsLast(iv);
  h(`<h1>${e.name}</h1>
    <div class="card center">
      <div class="sub">${iv.maxSeries>1?`серия ${iv.s+1} из ${iv.maxSeries} · `:""}отрезок ${iv.leg+1} из ${legs}</div>
      <div class="name" style="font-size:26px">${work?(e.ball?"ВЕДЕНИЕ":"БЕГ"):"ШАГОМ"}</div>
      <div class="big" id="rc"></div>
      <div class="note">${work?(e.ball?`${sec} секунд на высокой скорости`
                                      :`${sec} секунд на ~80% от максимума, не спринт`)
                              :`${sec} секунд ${e.ball?"шагом с мячом":"шагом обратно к старту"}`}</div>
      ${who?`<div class="note">Работают: ${who}</div>`:""}
      ${(work&&last&&e.series)?`<div class="warnbox">Последний отрезок серии — рывок к воротам и удар.</div>`
        :(work?`<div class="note">По сигналу останавливаются там, где добежали.</div>`:"")}
    </div>
    <div class="row"><button class="go" onclick="ivNext()">Дальше</button></div>
    ${smallActions()}`);
  countdownTo(target,"rc",()=>ivNext(),{warnFrom:INTERVAL_WARN_SEC});
}
function ivNext(){ stopCountdown();
  const iv=S.iv;
  if(iv.phase==="work"){
    // Работа кончилась: с этого момента идёт отдых, а тренер вводит метры.
    iv.restFrom=Date.now(); iv.asked={};
    iv.phase="ask"; saveSession(); return ivAsk();
  }
  iv.phase="work"; iv.leg++; saveSession(); ivRender();
}
/* Ввод результата отрезка — по одному игроку за раз. Дистанция по фишкам;
   на финише серии вместо неё гол. */
function ivAsk(){
  const iv=S.iv, e=EX[iv.ex];
  const left=ivPlayers(iv).filter(pl=>!(iv.asked||{})[pl]);
  if(!left.length){ iv.phase="rest"; saveSession(); return ivRender(); }
  // Отрезков у братьев разное число — считаем по СВОЕЙ серии игрока.
  const pl=left[0], legs=(iv.series[pl]||[])[iv.s]||0;
  const last=(iv.leg===legs-1);
  const head=`${countHeader(pl,e.name+lightTag(pl),legs,"отрезков",iv.leg)}
    <div class="title">${RU[pl]} · интервал ${iv.leg+1} из ${legs}</div>`;
  if(last&&e.series){
    return h(`${head}
      <div class="card center"><div class="title">Финиш серии ${iv.s+1}: гол?</div>
        <div class="note">Последний отрезок закончился рывком к воротам и ударом.</div></div>
      <div class="row"><button class="go" onclick="ivGoalSave('${pl}',1)">⚽ ГОЛ</button>
        <button class="warn" onclick="ivGoalSave('${pl}',0)">Мимо</button></div>

  const marks=INTERVAL_MARKS[iv.ex]||[];
  h(`${head}
    <div class="title">До какой фишки добежал?</div>
    <div class="gridN">${marks.map(m=>`<button onclick="ivDistSave('${pl}',${m})">${m}</button>`).join("")}</div>
    <div class="note">Остановился между фишками — округляй до ближайшей.</div>
    ${smallActions()}`);
}
function ivDistSave(pl,m){

// Сквозной номер отрезка через все серии: 6 + 6 → 1..12.
function ivAttemptNo(iv,pl){
  const before=(iv.series[pl]||[]).slice(0,iv.s).reduce((a,b)=>a+b,0);
  return before+iv.leg+1;
}
function ivNextSeries(){

  iv.s++; iv.leg=0; iv.phase="work";

  const target=Date.now()+E26_BREAK_SEC*1000;
