<!DOCTYPE html>
<html lang="ru">
<head>

<title>Тренировка</title>
<style>
/* Высокий контраст: тёмный текст на светлом фоне, читается на солнце. */
:root{
  --bg:#f7f3e8; --fg:#141414; --muted:#555; --line:#c9c2ad;
  --btn:#141414; --btn-fg:#fff; --accent:#0a6b2e; --warn:#a11; --card:#fff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);
  font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;
  font-size:19px;line-height:1.35;-webkit-user-select:none;user-select:none}
#app{max-width:540px;margin:0 auto;padding:14px 14px 24px;min-height:100vh;
  display:flex;flex-direction:column}
h1{font-size:23px;margin:.2em 0}
.title{font-weight:800;font-size:21px}
.sub{color:var(--muted);font-size:16px}

.big{font-size:46px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums}

button.warn{background:var(--warn);border-color:var(--warn)}
button.go{background:var(--accent);border-color:var(--accent)}

button:disabled{opacity:.4}
.row{display:flex;gap:8px;margin-top:10px}

.overlay .card{max-width:480px;width:100%;max-height:90vh;overflow-y:auto}
.note{color:var(--muted);font-size:15px}

.scroll{overflow-y:auto;flex:1}
input[type=text]{font-size:24px;width:100%;padding:10px;border:2px solid var(--btn);

<body>
<div id="app"></div>
<script>
"use strict";
/* Метка сборки: дата, время и хэш содержимого. deploy.sh заменяет всю
   строку целиком (якорь — начало строки «const BUILD = ») тем же значением,
   что попадает в имя кэша sw.js и в адрес его регистрации ./sw.js?v=BUILD.
   Локально остаётся 'dev'. Показывается внизу главного экрана — по ней
   сразу видно, какая версия загружена на телефоне. */
const BUILD = '20260818-1101-ab76711';
function buildLabel(){
  const m=/^(\d{4})(\d{2})(\d{2})-(\d{2})(\d{2})-(.+)$/.exec(BUILD);
  return m?`Сборка ${m[3]}.${m[2]}.${m[1]} ${m[4]}:${m[5]} · ${m[6]}`:`Сборка ${BUILD}`;
}
/* ================================================================
   ТРЕНИРОВКА БРАТЬЕВ — автономное Mini App (v2).
   Приложение ведёт человека, который видит упражнение впервые:
   сколько фишек, на каком расстоянии, где стоит тренер, что делать
   по шагам. Коды упражнений тренеру НЕ показываются — только в данных.

   Перед каждым упражнением — ТРИ экрана: Расстановка → Что делать →
   Работа. Пробных попыток нет. Занятие идёт офлайн, копится в
   localStorage, вечером — [Выгрузить] боту (файлом).

   ГЛАВНОЕ ПРАВИЛО: братья не сравниваются. Один выполняет → тренер
   записал → потом второй. Итоги — отдельными карточками. Имена рядом
   только на экране самочувствия (это ввод, не вывод).
   ================================================================ */
const tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
if (tg) { try { tg.ready(); tg.expand(); } catch(e){} }

const PLAYERS = ["DANIIL","ADRIAN"];
const RU = {DANIIL:"ДАНИИЛ", ADRIAN:"АДРИАН"};
// Упражнения с мячом, где возможна потеря мяча (кнопка на экране замера).
const LOST_EXERCISES = new Set(["E04","E05","E15","E10S"]);
/* ПАРАМЕТРЫ УПРАЖНЕНИЙ — один источник для слотов, текстов и схем.
   Числа повторов, дистанций и отдыха НЕ пишутся в описаниях словами:
   тексты подставляют их отсюда. Иначе правишь одно, а второе остаётся
   старым — так и разъехалось «10 повторов» в «Ведении и ударе». */
// Дистанции (м): по игроку или по варианту.
// Рывок после последней фишки — ОДИН И ТОТ ЖЕ элемент в слаломе и зигзаге:
// выход из тесноты на скорость. Фишка удара во вторник ставится один раз
// и между упражнениями не двигается (dupl. bot/catalog.py RUSH_M).
const RUSH={DANIIL:15,ADRIAN:10};
const DIST={
  E01:{DANIIL:10,ADRIAN:10},
  E02:{"20m":20,"15m":15,"25m_fly":35,"30m_fly":40},
  E04:{DANIIL:RUSH.DANIIL,ADRIAN:RUSH.ADRIAN},
  E05:{DANIIL:5,ADRIAN:4},
  E06:{DANIIL:5,ADRIAN:4},
  E07:{DANIIL:20,ADRIAN:15},
  E10S:{DANIIL:36,ADRIAN:27},
  E12:{DANIIL:20,ADRIAN:20},
  E13:{DANIIL:17,ADRIAN:17},
  E14:{DANIIL:20,ADRIAN:20},
  E15:{DANIIL:36,ADRIAN:27},
  E08_D:{DANIIL:34}, E08_A:{ADRIAN:27},
};
// Замер внутри длинного забега (E02): бежит 35 — меряем средние 25.
const E02_MEASURE={"25m_fly":25,"30m_fly":30};
// Разметка, не совпадающая с дистанцией замера.
const E01_LANE_GAP=3;        // между коридорами братьев
const E04_CONES=8, E04_CONE_GAP=2;
const E05_CONES=5, E05_SIDE={DANIIL:3,ADRIAN:2.5};
const E06_CONES=3;
const E07_PASS={DANIIL:10,ADRIAN:8};   // пасующий перед принимающим
const E13_PASS=12, E13_BACK="16-18";   // пас и позиция принимающего
const E14_GAP=5;                       // ты между игроком и воротами
const E10_RUSH_REST=25;                // отдых между рывками серии 4
const E10_RUSH_START={DANIIL:28,ADRIAN:22};  // откуда стартует на пас
const E15_CALL={DANIIL:25,ADRIAN:18};  // метр, на котором кричишь УДАР/ПАС
const FULL_REST_SEC=90;                // полный отдых перед первой попыткой
/* ПОТОЛОК ОТДЫХА между повторами — 100 секунд, больше в программе нет
   ничего (dupl. bot/catalog.REST_CEILING_SEC). Поднят с 90 ровно под
   «Ведение и удар»: 36 м с мячом на скорости плюс удар. Полный отдых перед
   ПЕРВОЙ попыткой серии — правило отдельное, оно не про паузу между
   повторами. Отдых между повторами (с): число, по варианту или по игроку. */
const REST_CEILING_SEC=100;
const REST={
  E01:45,
  E02:{"20m":90,"15m":80,"25m_fly":90,"30m_fly":90},
  E04:{DANIIL:70,ADRIAN:60},
  E05:{DANIIL:70,ADRIAN:60},
  E06:75,
  E10S:100,
  E08:90,
  E15:{fresh:90,tired:90},
};
function restOf(ex,key){ const r=REST[ex];
  return (r&&typeof r==="object")?r[key]:r; }
// Число повторов по факту плана дня — не по памяти текста.
// Числа в текстах подставляются, поэтому склонение считается, а не пишется.
function plural(n,one,few,many){
  const a=Math.abs(n)%100, b=a%10;
  if(a>10&&a<20)return many;
  if(b>1&&b<5)return few;
  if(b===1)return one;
  return many;
}
function nOf(n,one,few,many){ return `${n} ${plural(n,one,few,many)}`; }
const N_REP=(n)=>nOf(n,"повтор","повтора","повторов");
const N_RUN=(n)=>nOf(n,"забег","забега","забегов");
const N_PASS=(n)=>nOf(n,"проход","прохода","проходов");
const N_TRY=(n)=>nOf(n,"подход","подхода","подходов");
const N_CATCH=(n)=>nOf(n,"приём","приёма","приёмов");
const N_ATT=(n)=>nOf(n,"попытка","попытки","попыток");
// Разбивка стартов по положениям — из самого плана дня, не из памяти текста.
const START_POSE={stance:"стойка",sit_face:"сидя лицом",sit_back:"сидя спиной",lie:"лёжа"};
function startBreakdown(player,spec){
  const by={};
  repsFor("E01",spec)[player].forEach(sl=>{by[sl.variant]=(by[sl.variant]||0)+1;});
  return Object.keys(by).map(v=>`${START_POSE[v]||v}·${by[v]}`).join(", ");
}
// Сколько забегов данного варианта у каждого игрока — из плана дня.
function runCount(ex,variant,spec){
  const plan=repsFor(ex,spec), out={};
  PLAYERS.forEach(pl=>{out[pl]=(plan[pl]||[]).filter(sl=>sl.variant===variant).length;});
  return out;
}
function repsOf(ex,player,spec){
  const plan=(ex==="E15")?e15Slots(E15_FRESH):repsFor(ex,spec);
  return (plan[player]||[]).length;
}
// Каноническое число повторов на игрока (dupl. bot/catalog.py REP_COUNTS).
// E15 — часть 1 (5 обоим) плюс часть 2 (Даниил 3).
const REPS={E01:{DANIIL:6,ADRIAN:5},E02:{DANIIL:6,ADRIAN:5},E04:{DANIIL:6,ADRIAN:6},
  E05:{DANIIL:6,ADRIAN:6},E06:{DANIIL:5,ADRIAN:5},E07:{DANIIL:10,ADRIAN:10},
  E10S:{DANIIL:6,ADRIAN:6},E15:{DANIIL:8,ADRIAN:5},
  E08_D:{DANIIL:5},E08_A:{ADRIAN:5}};

/* ── ОБЛЕГЧЁННЫЙ РЕЖИМ (dupl. bot/catalog.py) ──────────────────────────
   Выбирается ОТДЕЛЬНО на каждого игрока перед занятием. Режется только
   объём: занятие одно, порядок упражнений и чередование прежние. Ноль —
   упражнение у этого игрока убрано целиком.
   В контрольные дни режим недоступен: замер с сокращённого числа попыток
   несравним с базой, а контрольных дней всего три. */
const LIGHT_REPS={E01:3,E02:0,E04:2,E05:2,E06:3,E07:4,E10S:2,E15:3};
const LIGHT_RECEPTIONS=2;    // «Приём под опекой» во все дни
const LIGHT_DUEL_SHOTS=2;    // «Ты догоняешь» и «Обыгрыш лицом»
const LIGHT_SUB_SHOTS=3;     // подсерия «Ударов» вместо пяти
const LIGHT_E10_SERIES=3;    // серии 1-3; серия 4 (рывок на пас) убрана
/* Облегчённый режим этого игрока. В контрольные дни всегда false, даже если
   флаг как-то попал в сохранённую сессию: замер с сокращённого числа
   попыток несравним с базой. */
function isLight(pl){
  return !!(S&&S.light&&S.light[pl]&&!(S.spec&&S.spec.control));
}
// Пометка в заголовке рабочего экрана: тренер видит, чей объём срезан.
function lightTag(pl){ return isLight(pl)?" · облегчённый":""; }
// Единицы объёма упражнения — для строки «Даниил: 2 прохода (облегчённый)».
const EX_UNIT={E01:N_RUN,E02:N_RUN,E04:N_PASS,E05:N_PASS,E06:N_REP,E10S:N_REP,
  E07:N_CATCH,E10:(n)=>nOf(n,"удар","удара","ударов"),E12:N_TRY,E14:N_TRY,
  E13:N_CATCH,E15:N_REP,E08:N_ATT};
// «Отрыв» (E15): два режима подряд. Часть 2 — без стоп-правила.
const E15_FRESH="fresh", E15_TIRED="tired";
// Часть 2 Адриана: 10 ударов С МЕСТА (мяч лежит, ведения нет) с ближней
// дистанции, учёт одним числом из 10 (dupl. bot/catalog.py).
const E15_SHOTS_A={v:"tired_shots",name:"Удары с места",kind:"ближняя",
  shots:10,dist:13,range:"11-14 м"};
// Секундомер «Отрыва»: пуск — СТАРТ ИГРОКА, стоп — удар (dupl. bot/catalog.py).
// В замер входит весь рывок: реакция на пас, догон мяча, приём, ведение, удар.
// Замеры ДО 2026-08-07 мерили другой отрезок (от касания мяча) и с новыми
// НЕСРАВНИМЫ: тот отрезок был непостоянным и давал 2.94 с на 36 м.
const E15_WATCH_RULE="Пуск — когда он стартовал. Стоп — удар.";
// Замеры по эту дату включительно — старого формата (dupl. bot/catalog.py).
const E15_TIMING_CHANGED="2026-08-07";
const E15_OLD_TIMING="старый формат замера";
function oldBreakawayTiming(){ return (S&&S.spec?S.spec.iso:"")<=E15_TIMING_CHANGED; }
// Подсерии «Ударов» (E10): 9 × 5 = 45 ударов на игрока (dupl. bot/catalog.py).
const E10_SUB=[
  {v:"s1_near",series:1,kind:"ближняя",shots:5,timed:false,dist:{DANIIL:15,ADRIAN:13}},
  {v:"s1_far",series:1,kind:"дальняя",shots:5,timed:false,dist:{DANIIL:22,ADRIAN:16}},
  {v:"s2_near",series:2,kind:"ближняя",shots:5,timed:false,dist:{DANIIL:15,ADRIAN:13}},
  {v:"s2_far",series:2,kind:"дальняя",shots:5,timed:false,dist:{DANIIL:22,ADRIAN:16}},
  {v:"s3_right",series:3,kind:"справа",shots:5,timed:false,dist:{DANIIL:10,ADRIAN:8}},
  {v:"s3_left",series:3,kind:"слева",shots:5,timed:false,dist:{DANIIL:10,ADRIAN:8}},
  {v:"s4_left",series:4,kind:"слева",shots:5,timed:true,dist:{DANIIL:17,ADRIAN:13}},
  {v:"s4_center",series:4,kind:"центр",shots:5,timed:true,dist:{DANIIL:17,ADRIAN:13}},
  {v:"s4_right",series:4,kind:"справа",shots:5,timed:true,dist:{DANIIL:17,ADRIAN:13}},
];

/* ---------- Звук и вибрация ---------- */
function soundOn(){ return localStorage.getItem("trening_sound")!=="off"; }
function toggleSound(){ localStorage.setItem("trening_sound", soundOn()?"off":"on"); screenHome(); }
function tone(ms,freq){
  if(!soundOn()) return;
  try{
    const A=window.AudioContext||window.webkitAudioContext; const a=new A();
    const o=a.createOscillator(), g=a.createGain();
    o.connect(g); g.connect(a.destination);
    o.type="sine"; o.frequency.value=freq; g.gain.value=0.25;
    o.start(); setTimeout(()=>{o.stop(); a.close();},ms);
  }catch(e){}
}
function beep(){ tone(180,880); }        // короткий: 3, 2, 1
function beepLong(){ tone(700,660); }    // длинный: ноль, можно давать старт
// Вибрация НЕ зависит от звука: при выключенном звуке остаётся она.
function buzz(ms){ if(navigator.vibrate){ try{navigator.vibrate(ms||200);}catch(e){} } }
function signal(){ beep(); buzz(200); }

/* ---------- Отсчёт последних 10 секунд отдыха ----------
   Один механизм на все экраны отдыха: между повторами, между упражнениями,
   в паузах. Пока секунд больше десяти — обычная строка «N сек»; последние
   десять — цифры на весь экран, бип на 3, 2, 1 и длинный на нуле, вибрация
   на каждой из последних трёх. Тренер не считает в уме. */
let cdTimer=null;
function stopCountdown(){ if(cdTimer){clearInterval(cdTimer);cdTimer=null;} }
function countdownTo(targetMs,elId,onDone){
  stopCountdown();
  let last=null, fired=false;
  const tick=()=>{
    const el=document.getElementById(elId);
    if(!el){ stopCountdown(); return; }
    const remain=targetMs-Date.now();
    const secs=Math.max(0,Math.ceil(remain/1000));
    if(secs<=10){ el.className="cd10"+(secs<=3?" hot":""); el.textContent=secs; }
    else { el.className="big"; el.textContent=secs+" сек"; }
    if(secs!==last){
      if(secs===3||secs===2||secs===1){ beep(); buzz(200); }
      else if(secs===0){ beepLong(); }
      last=secs;
    }
    if(remain<=0&&!fired){ fired=true; stopCountdown(); if(onDone)onDone(); }
  };
  tick(); cdTimer=setInterval(tick,200);
}

/* ---------- Часы и абсолютное время ---------- */
function hhmm(dt){ return String(dt.getHours()).padStart(2,"0")+":"+String(dt.getMinutes()).padStart(2,"0"); }
function hhmmss(dt){ return hhmm(dt)+":"+String(dt.getSeconds()).padStart(2,"0"); }

/* ================================================================
   КАЛЕНДАРЬ (зеркалит bot/schedule.py)
   ================================================================ */
const P1_START="2026-08-03", P1_END="2026-08-19";
const P2_START="2026-08-20", P2_END="2026-09-10";
const CONTROL_DAYS={"2026-08-03":1,"2026-08-14":2,"2026-09-09":3};
const TAPER_SHORT="2026-08-19", TAPER_WEEK_START="2026-08-17";
const WD=["MON","TUE","WED","THU","FRI","SAT","SUN"];
const WD_RU=["понедельник","вторник","среда","четверг","пятница","суббота","воскресенье"];
// Разминка/заминка/пауза (минут) — каркас. Длительность дня вычисляется:
// разминка + Σблоки + паузы(по числу блоков) + заминка.
/* Минимум на блок в облегчённом режиме: расчёт по повторам даёт только
   чистую работу, а блок начинается с расстановки и объяснения — короче
   пяти минут он не бывает (dupl. bot/schedule.LIGHT_BLOCK_MIN). Ноль —
   упражнение в облегчённом не идёт, под правило не попадает. */
const LIGHT_BLOCK_MIN=5;
const WARMUP_MIN={1:15,2:12}, COOLDOWN_MIN={1:5,2:4}, PAUSE_MIN=1;
function sessionMinutes(phase,blocks){
  return WARMUP_MIN[phase]+blocks.reduce((a,b)=>a+b[1],0)+blocks.length*PAUSE_MIN+COOLDOWN_MIN[phase];
}
/* Длительность занятия по фактическим режимам игроков: её задаёт тот, у кого
   объём больше, поэтому облегчённый у ОДНОГО день не укорачивает. Блоки
   с нулём (в облегчённом упражнения нет) выпадают вместе со своей паузой
   (dupl. bot/schedule.light_minutes). */
function sessionMinutesNow(spec){
  if(!PLAYERS.every(pl=>isLight(pl))) return spec.minutes;
  const kept=spec.blocks.filter(b=>b[2]>0).map(b=>[b[0],b[2]]);
  return kept.length?sessionMinutes(spec.phase,kept):0;
}
// Матрица Фазы 1: [цель, [[код, минут-блока]...]] (минуты дня — из sessionMinutes)
// Минуты E13 учитывают отдых 1 мин между приёмами (см. bot/schedule.py).
// Пересчёт от 17.08: «Старты» −3 мин (отдых 45), «Разгон» −2, «Отрыв» −2,
// «Ведение и удар» −2 (отдых 100, но повторов 6 вместо 10 — беговое, см.
// catalog.RUN_REP_MAX). Отдых «Обыгрыша лицом» 0 → 40 (18.08): блок 14 → 15.
// ПН 77, ВТ 79, СР 86, ЧТ 97, ПТ 92
// (dupl. bot/schedule.py).
const P1_MATRIX={
  MON:["Скорость и первый шаг",[["E01",11,8],["E02",13,0],["E13",16,10],["E12",13,7]]],
  TUE:["Дриблинг и быстрые ноги",[["E04",15,9],["E05",15,9],["E14",15,10],["E10S",10,5]]],
  WED:["Смена направления",[["E06",12,9],["E13",19,13],["E14",15,10],["E12",16,10]]],
  THU:["Контроль и завершение",[["E07",19,13],["E10",45,18],["E13",10,7]]],
  FRI:["Отрыв и завершение",[["E15",36,25],["E14",15,10],["E13",18,13]]],
};
// Фаза 2 — два блока, короткое занятие (dupl. bot/schedule.py):
// Скорость 32, Мяч 37, Единоборство 34 минуты.
const P2_TYPES={
  S:["Скорость",[["E01",8,7],["E02",6,0]]],
  B:["Мяч",[["E04",10,7],["E10S",9,5]]],
  D:["Единоборство",[["E13",9,6],["E12",7,5]]],
};
function isoToDate(s){const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);}
function dateToIso(dt){return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");}
function addDays(iso,n){const dt=isoToDate(iso);dt.setDate(dt.getDate()+n);return dateToIso(dt);}
function wdOf(iso){return (isoToDate(iso).getDay()+6)%7;}
function weekOfP1(iso){return Math.floor((isoToDate(iso)-isoToDate(P1_START))/86400000/7)+1;}
function ctx(){const raw=localStorage.getItem("trening_ctx");
  const o=raw?JSON.parse(raw):{club_days:[],match_days:[]};
  return {club:new Set(o.club_days||[]),match:new Set(o.match_days||[])};}
function rule5(iso,c){
  if(c.club.has(iso)||c.match.has(iso))return false;
  if(c.match.has(addDays(iso,1)))return false;
  if(c.match.has(addDays(iso,-1)))return false;
  if(c.club.has(addDays(iso,-1))&&c.club.has(addDays(iso,-2)))return false;
  return true;}
function phase2Type(iso,c){
  let alt=0,cur=P2_START; while(cur<iso){if(rule5(cur,c))alt++;cur=addDays(cur,1);}
  if(c.club.has(iso))return[null,"Сегодня клубная тренировка. Утреннего занятия нет."];
  if(c.match.has(iso))return[null,"Сегодня матч. Занятия нет."];
  if(c.match.has(addDays(iso,1)))return[null,"Завтра матч. Занятия нет."];
  if(c.match.has(addDays(iso,-1)))return["B","Вчера был матч — тип Мяч."];
  if(c.club.has(addDays(iso,-1))&&c.club.has(addDays(iso,-2)))return["B","Два клубных дня подряд — тип Мяч."];
  return[(alt%2===0)?"S":"D","Чередование скорость/единоборство."];
}
function noDay(iso,phase,reason){return {iso,phase,week:null,code:WD[wdOf(iso)],day_code:"",
  goal:"",minutes:0,has:false,control:false,type:null,blocks:[],shortened:false,reason};}
function determineDay(iso){
  const wd=wdOf(iso),code=WD[wd];
  if(CONTROL_DAYS[iso]!==undefined){
    // Контрольный день: облегчённого режима нет, третье число то же.
    const ph=iso<=P1_END?1:2, blocks=[["E01",9,9],["E02",10,10],["E08",13,13]];
    return {iso,phase:ph,week:iso<=P1_END?weekOfP1(iso):null,code,
      day_code:"CTRL_"+CONTROL_DAYS[iso],goal:"Контрольный замер",
      minutes:sessionMinutes(ph,blocks),has:true,
      control:true,type:null,blocks,shortened:false,
      reason:"Контрольный день: тест, не тренировка."};
  }
  if(iso>=P1_START&&iso<=P1_END){
    if(!P1_MATRIX[code])return noDay(iso,1,"Выходной. В Фазе 1 занятия только Пн-Пт.");
    const w=weekOfP1(iso),[goal,blocks]=P1_MATRIX[code];
    if(iso===TAPER_SHORT){const tb=[["E01",7,5],["E10S",6,5]];
      return {iso,phase:1,week:w,code,day_code:"P1_W"+w+"_"+code,
      goal:"Подводка: старты + удары",minutes:sessionMinutes(1,tb),has:true,control:false,type:null,
      blocks:tb,shortened:true,reason:"Подводка перед Фазой 2."};}
    const short=iso>=TAPER_WEEK_START, bl=blocks.map(b=>b.slice());
    return {iso,phase:1,week:w,code,day_code:"P1_W"+w+"_"+code,goal,minutes:sessionMinutes(1,bl),has:true,
      control:false,type:null,blocks:bl,shortened:short,
      reason:short?"Подводка: объём -50%.":""};
  }
  if(iso>=P2_START&&iso<=P2_END){
    const c=ctx(),[t,reason]=phase2Type(iso,c);
    if(!t)return noDay(iso,2,reason);
    const[name,blocks]=P2_TYPES[t], bl=blocks.map(b=>b.slice());
    return {iso,phase:2,week:null,code,day_code:"P2_"+t,goal:name,minutes:sessionMinutes(2,bl),has:true,
      control:false,type:t,blocks:bl,shortened:false,reason};
  }
  return noDay(iso,null,"Дата вне программы лагеря.");
}
// Число приёмов E13 по дню (контроль под опекой).
// Среда 8 → 6 (17.08): правило максимума шести повторов действует на всё,
// кроме чистых ударов (dupl. bot/catalog.E13_RECEPTIONS).
function e13N(code){return {MON:6,WED:6,THU:4,FRI:5}[code]||5;}
// Фаза-зависимые счётчики: в Фазе 2 объём срезан.
// Фаза 2 — вдвое меньший объём при том же отдыхе (dupl. bot/catalog.py).
// Второй аргумент player — облегчённый режим этого игрока; без него
// возвращается обычное число (для текстов, где игрок не назван).
const P2_RECEPTIONS=4, P2_DUEL_SHOTS=3;
function receptionsFor(spec,player){
  if(player&&isLight(player))return LIGHT_RECEPTIONS;
  return spec.phase===2?P2_RECEPTIONS:e13N(spec.code);}
// «Ведение и удар» — 6 повторов в обеих фазах (dupl. bot/catalog.py).
function e10sReps(spec){return REPS.E10S.DANIIL;}
function duelShotsFor(ex,spec,player){
  if(player&&isLight(player))return LIGHT_DUEL_SHOTS;
  return (ex==="E12"&&spec.phase===2)?P2_DUEL_SHOTS:EX[ex].shots;}
// Число ударов подсерии «Ударов» и приёмов подсерии «Разворота» — по игроку.
function e10SubShots(sub,player){return isLight(player)?LIGHT_SUB_SHOTS:sub.shots;}
function e07Shots(player){return isLight(player)?LIGHT_REPS.E07/E07_SUBS.length
                                                :REPS.E07.DANIIL/E07_SUBS.length;}
/* Сколько повторов упражнения приходится на игрока сегодня — одна точка
   истины для экрана расстановки, пропуска пустых блоков и отчёта. */
function plannedReps(ex,spec,pl){
  if(ex==="E13")return receptionsFor(spec,pl);
  if(ex==="E12"||ex==="E14")return duelShotsFor(ex,spec,pl);
  if(ex==="E07")return e07Shots(pl)*E07_SUBS.length;
  if(ex==="E10")return isLight(pl)
    ? LIGHT_SUB_SHOTS*e10subs(1).length*LIGHT_E10_SERIES : e10Total();
  // «Отрыв» — только сами рывки: удары Адриана с места идут отдельным
  // блоком внутри упражнения и в счёт повторов не входят.
  if(ex==="E15")return e15Slots(E15_FRESH)[pl].length
    +e15Slots(E15_TIRED)[pl].length;
  const plan=repsFor(ex,spec);
  return (plan[pl]||[]).length;
}
// Блок целиком пуст, если работы нет ни у одного игрока (только «Разгон»
// в облегчённом у обоих) — такой блок приложение пропускает.
function blockHasWork(ex,spec){return PLAYERS.some(pl=>plannedReps(ex,spec,pl)>0);}
// Объём по игрокам на экране расстановки.
function volumeLines(ex,spec){
  return PLAYERS.map(pl=>{
    const n=plannedReps(ex,spec,pl);
    if(!n)return `${RU[pl]}: не делает (облегчённый)`;
    return `${RU[pl]}: ${(EX_UNIT[ex]||N_REP)(n)}${isLight(pl)?" (облегчённый)":""}`;
  }).join("\n");
}
// Раз в две недели удлинённый третий длинный забег Даниила (E02).
function e02Biweekly(iso){const diff=Math.round((isoToDate(iso)-isoToDate("2026-08-10"))/86400000);
  return diff>=0 && diff%14===0;}

// SVG-схема дня — коридоры для ПН и ПТ Фазы 1 (если есть).
function markupSvg(spec){
  if(spec.phase!==1 || spec.control) return "";
  // ПН — два стартовых коридора рядом, тренер на общем финише.
  if(spec.code==="MON"){
    const k=mScale(DIST.E01.DANIIL,190), x0=30, x1=x0+DIST.E01.DANIIL*k;
    return svg(
      cone(x0,45)+cone(x1,45)+arrow(x0+10,45,x1-12,45)+
      dim(x0,68,x1,`старты ${DIST.E01.DANIIL} м`)+
      cone(x0,120)+cone(x1,120)+arrow(x0+10,120,x1-12,120)+
      dim(x0,143,x1,`старты ${DIST.E01.ADRIAN} м`)+
      dimV(14,45,120,E01_LANE_GAP+" м")+coach(x1+45,82,"ТЫ · финиш"));
  }
  // ПТ — «Отрыв»: обе дорожки одним масштабом, ворота справа поперёк.
  if(spec.code==="FRI"){
    const k=mScale(DIST.E15.DANIIL,215), x0=25, xGoal=x0+DIST.E15.DANIIL*k;
    const call=(pl)=>x0+E15_CALL[pl]*k;
    const xA=x0+(DIST.E15.DANIIL-DIST.E15.ADRIAN)*k;   // Адриан ближе к воротам
    return svg(
      goalV(xGoal,80)+
      player(x0,48,"Даниил")+arrow(x0+10,48,xGoal-10,66)+
      cone(call("DANIIL"),48)+lblC(call("DANIIL"),36,`команда ${E15_CALL.DANIIL} м`)+
      dim(x0,72,xGoal,`удар ~${DIST.E15.DANIIL} м`)+
      player(xA,118,"Адриан")+arrow(xA+10,118,xGoal-8,96)+
      cone(xA+E15_CALL.ADRIAN*k,118)+
      lblC(xA+E15_CALL.ADRIAN*k,140,`команда ${E15_CALL.ADRIAN} м`)+
      dim(xA,148,xGoal,`удар ~${DIST.E15.ADRIAN} м`));
  }
  return "";
}
function dayMarkup(spec){
  const items=spec.blocks.map((b,i)=>{
    const ex=b[0], name=(EX[ex]||{name:ex}).name;
    let snip=txt(MARKUP_SNIPPET[ex]||"по описанию упражнения",spec);
    if(ex==="E13") snip+="\nПриёмов сегодня: "+receptionsFor(spec)+".";
    return `${i+1}. ${name}\n   ${snip.replace(/\n/g,"\n   ")}`;
  });
  return {text:items.join("\n\n"), svg:markupSvg(spec)};
}

function warmupSteps(spec){
  const code=spec.code, phase=spec.phase;
  if(phase===2) // сокращённая разминка Фазы 2, без блока с мячом = 12 мин
    return [WU.leg,WU.joints3,WU.dyn3,WU.acc];       // 3+3+3+3 = 12
  if(code==="MON") return [WU.leg,WU.joints3,WU.dyn3,WU.acc,WU.ball,WU.jump]; // 3+3+3+3+2+1 = 15
  if(code==="TUE") return [WU.leg,WU.joints2,WU.dyn3,WU.acc,WU.ladder];       // 3+2+3+3+4 = 15
  return [WU.leg,WU.joints3,WU.dyn4,WU.acc,WU.ball];                          // 3+3+4+3+2 = 15
}
function cooldownStep(spec){
  const min=spec.phase===2?4:5;
  return {t:"Заминка",min,body:
    (spec.code==="FRI"?"Лёгкий бег 3 минуты.":"Лёгкий бег 2 минуты.")+
    "\nРастяжка по 20 сек: задняя поверхность бедра,\nикры, пах, квадрицепс."};
}

/* ================================================================
   SVG-помощники
   ================================================================ */
/* Схемы рисуются в метрах, а не «на глаз»: у каждой свой масштаб px/м
   (helper mScale), и 10 метров на схеме не могут выглядеть длиннее 35.
   Ворота — прямоугольник ПОПЕРЁК направления атаки, стороны 3:1:
   goalV — атака идёт по горизонтали (створ вытянут по вертикали),
   goalH — атака идёт по вертикали (створ вытянут по горизонтали).
   Игроки и тренер — одинаковые кружки с подписью, тренер подписан «ТЫ». */
const SVG_W=300, SVG_H=170;
const GOAL_LONG=45, GOAL_SHORT=15;      // 3:1
function svg(inner){
  return `<svg class="svg" viewBox="0 0 ${SVG_W} ${SVG_H}">
   <defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
     <path d="M0,0 L7,3 L0,6 Z" fill="#141414"/></marker></defs>${inner}</svg>`;
}
// Масштаб: сколько пикселей в метре, чтобы totalM уложились в px.
function mScale(totalM,px){ return px/totalM; }
function cone(x,y){return `<circle cx="${x}" cy="${y}" r="5" fill="none" stroke="#141414" stroke-width="2"/>`;}
function ball(x,y){return `<circle cx="${x}" cy="${y}" r="4" fill="#141414"/>`;}
function lbl(x,y,t){return `<text x="${x}" y="${y}" font-size="11" fill="#141414">${t}</text>`;}
// Подпись по центру точки — чтобы не наезжала на соседние.
function lblC(x,y,t){return `<text x="${x}" y="${y}" font-size="11" fill="#141414" text-anchor="middle">${t}</text>`;}
// Подпись, растущая ВЛЕВО от точки — чтобы не наезжала на соседний элемент.
function lblR(x,y,t){return `<text x="${x}" y="${y}" font-size="11" fill="#141414" text-anchor="end">${t}</text>`;}
/* Фигура игрока: одинаковый кружок у обоих братьев и у тренера,
   различает только подпись. Тренер всегда подписан «ТЫ». */
function figure(x,y,label,filled){
  return `<circle cx="${x}" cy="${y}" r="7" fill="${filled?"#141414":"#fff"}" stroke="#141414" stroke-width="2"/>`
    +(label?lblC(x,y+21,label):"");
}
function player(x,y,label){ return figure(x,y,label===undefined?"игрок":label,false); }
function coach(x,y,label){ return figure(x,y,label===undefined?"ТЫ":label,true); }
function goalV(x,cy){
  return `<rect x="${x}" y="${cy-GOAL_LONG/2}" width="${GOAL_SHORT}" height="${GOAL_LONG}" fill="none" stroke="#141414" stroke-width="2.5"/>`;
}
function goalH(cx,y){
  return `<rect x="${cx-GOAL_LONG/2}" y="${y}" width="${GOAL_LONG}" height="${GOAL_SHORT}" fill="none" stroke="#141414" stroke-width="2.5"/>`;
}
// Ломаная со стрелкой на конце — для слалома и зигзага: видно, что игрок
// обводит фишки, а не бежит сквозь них.
function pathArrow(pts){
  return `<polyline points="${pts.map(p=>p[0]+","+p[1]).join(" ")}" fill="none" stroke="#141414" stroke-width="2" marker-end="url(#ar)"/>`;
}
function arrow(x1,y1,x2,y2){return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#141414" stroke-width="2" marker-end="url(#ar)"/>`;}
// Размерная линия с засечками и подписью по центру — под элементами.
function dim(x1,y,x2,t){
  return `<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="#888" stroke-width="1"/>`
    +`<line x1="${x1}" y1="${y-4}" x2="${x1}" y2="${y+4}" stroke="#888" stroke-width="1"/>`
    +`<line x1="${x2}" y1="${y-4}" x2="${x2}" y2="${y+4}" stroke="#888" stroke-width="1"/>`
    +lblC((x1+x2)/2,y+14,t);
}
// Вертикальная размерная линия — для схем, где движение снизу вверх.
function dimV(x,y1,y2,t){
  return `<line x1="${x}" y1="${y1}" x2="${x}" y2="${y2}" stroke="#888" stroke-width="1"/>`
    +`<line x1="${x-4}" y1="${y1}" x2="${x+4}" y2="${y1}" stroke="#888" stroke-width="1"/>`
    +`<line x1="${x-4}" y1="${y2}" x2="${x+4}" y2="${y2}" stroke="#888" stroke-width="1"/>`
    +lbl(x+6,(y1+y2)/2+4,t);
}
function mark(x,y,t){return `<text x="${x}" y="${y}" font-size="13" font-weight="700" fill="#141414">${t}</text>`;}

/* ================================================================
   ПОСТРОЕНИЕ ПОВТОРОВ (слоты для измеряемых упражнений)
   ================================================================ */
function slot(player,ex,variant,dist,no,rest,extra){
  return Object.assign({player,ex,variant,dist,attempt_no:no,rest,goal:false,
    firstRest:false},extra||{});
}
/* Облегчённый режим срезает ХВОСТ серии: остаются первые N слотов, номера
   попыток и порядок вариантов не меняются. Ноль слотов — упражнение у этого
   игрока сегодня не идёт. */
function lightTrim(code,R){
  const n=LIGHT_REPS[code];
  if(n===undefined)return R;
  PLAYERS.forEach(pl=>{ if(isLight(pl)) R[pl]=(R[pl]||[]).slice(0,n); });
  return R;
}
function repsFor(code,spec){
  const R={DANIIL:[],ADRIAN:[]}, p2=(spec.phase===2);
  const push=(pl,arr)=>{R[pl]=arr;};
  if(code==="E01"){
    // Фаза 2 режет объём: 4/4 вместо 6/5.
    const dv=p2?[["stance",1],["stance",2],["sit_face",3],["sit_back",4]]
               :[["stance",1],["stance",2],["sit_face",3],["sit_face",4],["lie",5],["sit_back",6]];
    const av=p2?[["stance",1],["stance",2],["sit_back",3],["sit_back",4]]
               :[["stance",1],["stance",2],["sit_back",3],["sit_back",4],["sit_back",5]];
    push("DANIIL",dv.map(([v,n])=>slot("DANIIL","E01",v,DIST.E01.DANIIL,n,REST.E01)));
    push("ADRIAN",av.map(([v,n])=>slot("ADRIAN","E01",v,DIST.E01.ADRIAN,n,REST.E01)));
    R.DANIIL[0].firstRest=true; R.ADRIAN[0].firstRest=true;
  } else if(code==="E02"){
    const bw=e02Biweekly(spec.iso);
    if(p2){ // 4/3, без длинных с ходу
      const e2=(pl,v,n)=>slot(pl,"E02",v,DIST.E02[v],n,REST.E02[v]);
      push("DANIIL",[e2("DANIIL","20m",1),e2("DANIIL","20m",2),
        e2("DANIIL","25m_fly",3),e2("DANIIL","25m_fly",4)]);
      push("ADRIAN",[e2("ADRIAN","15m",1),e2("ADRIAN","15m",2),e2("ADRIAN","20m",3)]);
    } else {
      const e2=(pl,v,n)=>slot(pl,"E02",v,DIST.E02[v],n,REST.E02[v]);
      const long3=bw?"30m_fly":"25m_fly";
      push("DANIIL",[e2("DANIIL","20m",1),e2("DANIIL","20m",2),e2("DANIIL","20m",3),
        e2("DANIIL","25m_fly",4),e2("DANIIL","25m_fly",5),e2("DANIIL",long3,6)]);
      push("ADRIAN",[e2("ADRIAN","15m",1),e2("ADRIAN","15m",2),e2("ADRIAN","15m",3),
        e2("ADRIAN","20m",4),e2("ADRIAN","20m",5)]);
    }
  } else if(code==="E06"){
    push("DANIIL",[1,2,3,4,5].map(n=>slot("DANIIL","E06","",DIST.E06.DANIIL,n,REST.E06)));
    push("ADRIAN",[1,2,3,4,5].map(n=>slot("ADRIAN","E06","",DIST.E06.ADRIAN,n,REST.E06)));
  } else if(code==="E04"){
    const nn=p2?4:6;  // Фаза 2 — 4 прохода
    push("DANIIL",Array.from({length:nn},(_,i)=>slot("DANIIL","E04","",DIST.E04.DANIIL,i+1,REST.E04.DANIIL,{goal:true})));
    push("ADRIAN",Array.from({length:nn},(_,i)=>slot("ADRIAN","E04","",DIST.E04.ADRIAN,i+1,REST.E04.ADRIAN,{goal:true})));
  } else if(code==="E05"){
    push("DANIIL",[1,2,3,4,5,6].map(n=>slot("DANIIL","E05","",DIST.E05.DANIIL,n,REST.E05.DANIIL,{goal:true})));
    push("ADRIAN",[1,2,3,4,5,6].map(n=>slot("ADRIAN","E05","",DIST.E05.ADRIAN,n,REST.E05.ADRIAN,{goal:true})));
  } else if(code==="E10S"){
    const nn=e10sReps(spec);  // 5 повторов, в обеих фазах
    push("DANIIL",Array.from({length:nn},(_,i)=>slot("DANIIL","E10S","",DIST.E10S.DANIIL,i+1,REST.E10S,{goal:true})));
    push("ADRIAN",Array.from({length:nn},(_,i)=>slot("ADRIAN","E10S","",DIST.E10S.ADRIAN,i+1,REST.E10S,{goal:true})));
  } else if(code==="E15"){
    return e15Slots(E15_FRESH);   // часть 2 строится отдельно, после части 1
  } else if(code==="E08"){
    push("DANIIL",[1,2,3,4,5].map(n=>slot("DANIIL","E08_D","",DIST.E08_D.DANIIL,n,REST.E08,{goal:true})));
    push("ADRIAN",[1,2,3,4,5].map(n=>slot("ADRIAN","E08_A","",DIST.E08_A.ADRIAN,n,REST.E08,{goal:true})));
    return R;      // контрольный день: облегчённого режима там нет
  }
  return lightTrim(code,R);
}
// «Отрыв»: часть 1 — оба по 5 через 2 мин; часть 2 — только Даниил,
// 3 повтора через 90 сек и без стоп-правила (noStop). goal:true в обеих
// частях: каждый повтор кончается ударом, гол пишется по каждому.
function e15Slots(part){
  // В облегчённом части 2 нет вовсе: повторный максимальный рывок — это то,
  // ради чего день тяжёлый, и урезать его до одного повтора бессмысленно.
  if(part===E15_TIRED) return {
    DANIIL:isLight("DANIIL")?[]:[1,2,3].map(n=>slot("DANIIL","E15",E15_TIRED,DIST.E15.DANIIL,n,REST.E15.tired,{goal:true,noStop:true})),
    ADRIAN:[]};
  return lightTrim("E15",{
    DANIIL:[1,2,3,4,5].map(n=>slot("DANIIL","E15",E15_FRESH,DIST.E15.DANIIL,n,REST.E15.fresh,{goal:true})),
    ADRIAN:[1,2,3,4,5].map(n=>slot("ADRIAN","E15",E15_FRESH,DIST.E15.ADRIAN,n,REST.E15.fresh,{goal:true}))});
}

/* ================================================================
   ХРАНЕНИЕ
   ================================================================ */
function loadAttempts(){return JSON.parse(localStorage.getItem("trening_attempts")||"[]");}
function saveAttempts(a){localStorage.setItem("trening_attempts",JSON.stringify(a));}
function records(){return JSON.parse(localStorage.getItem("trening_records")||"{}");}
function pctRecords(){return JSON.parse(localStorage.getItem("trening_pct")||"{}");}

/* РЕКОРДЫ. Приложение считает их САМО по своей истории в localStorage:
   слепок «Импорт рекордов» тренер вставляет уже после занятия, и на экране
   итога сравнивать было бы не с чем. Слепок при этом не игнорируется — он
   помнит занятия, проведённые до установки приложения, поэтому берётся
   лучшее из двух источников.

   В рекорд не идут потери мяча и попытки с пометкой «сбой замера»
   (dupl. bot/rules.py counts_for_record). История — строго ДО текущего дня. */
const BROKEN_NOTE="сбой замера";
function countsForRecord(a){
  return !a.is_warmup && !a.lost && a.time_sec!==null && a.time_sec!==undefined
    && String(a.note||"").indexOf(BROKEN_NOTE)<0;
}
/* История для рекордов — строго ДО текущего дня и БЕЗ облегчённых занятий:
   объём там другой, «2 из 2 (100%)» дало бы непобиваемый рекорд процента,
   а три забега вместо шести — лучшее время на свежих ногах
   (dupl. bot/storage.py _RECORD_COND). */
function historyBefore(player,ex,day){
  return loadAttempts().filter(a=>a.player===player&&a.exercise_id===ex
    &&a.date<day&&!a.light);
}
// Лучшее время за всю историю до этого занятия: локальная база плюс слепок.
function timeRecord(player,ex,variant,day){
  const local=historyBefore(player,ex,day)
    .filter(a=>(a.variant||"")===(variant||"")&&countsForRecord(a))
    .map(a=>a.time_sec);
  const snap=(records()[player]||{})[ex+"|"+(variant||"")];
  const all=local.concat((snap===undefined||snap===null)?[]:[snap]);
  return all.length?Math.min(...all):null;
}
// Лучший процент попадания за занятие до этого дня: локальная база и слепок.
function ratioRecord(player,ex,day,variant){
  const byDay={};
  historyBefore(player,ex,day).forEach(a=>{
    if((variant!==undefined&&variant!==null)&&(a.variant||"")!==variant)return;
    if(a.lost&&!LOST_IS_RESULT.has(a.exercise_id))return;
    if(!a.shots)return;
    const d=byDay[a.date]=byDay[a.date]||{g:0,s:0};
    d.g+=a.goals||0; d.s+=a.shots;
  });
  const local=Object.values(byDay).filter(d=>d.s).map(d=>100*d.g/d.s);
  const snap=(variant===undefined||variant===null)?(pctRecords()[player]||{})[ex]:undefined;
  const all=local.concat((snap===undefined||snap===null)?[]:[snap]);
  return all.length?Math.max(...all):null;
}
function unsynced(){return loadAttempts().filter(a=>!a.uploaded).length;}
function uuid(){return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{
  const r=Math.random()*16|0,v=c==='x'?r:(r&0x3|0x8);return v.toString(16);});}
function nowIso(){return new Date().toISOString();}
let S=null, sessionTimer=null, lastDrink=0;
function saveSession(){ if(S) localStorage.setItem("trening_session",JSON.stringify(S)); }
function clearSession(){ localStorage.removeItem("trening_session"); S=null;
  if(sessionTimer){clearInterval(sessionTimer);sessionTimer=null;} }
// Поля записи из «слотовых» полей — один маппер на запись и перезапись.
function attemptFields(o){
  return {player:o.player,day_code:S.spec.day_code,
    exercise_id:o.ex||o.exercise_id,variant:o.variant||"",
    attempt_no:o.attempt_no||0,is_warmup:false, // пробных больше нет
    time_sec:(o.time_sec!==undefined&&o.time_sec!==null)?Number(Number(o.time_sec).toFixed(2)):null,
    distance_m:o.dist||o.distance_m||null,control:o.control??null,goals:o.goals??null,
    shots:o.shots??null,wellbeing:o.wellbeing??null,
    shortened:(S.spec.shortened||S.shortened||false),note:o.note||"",lost:!!o.lost,
    interrupted:!!(S&&S.interrupted),
    // Облегчённый режим — по игроку: у второго брата записи обычные.
    light:isLight(o.player)};
}
function pushAttempt(o){
  const a=loadAttempts();
  const rec=Object.assign({uuid:uuid(),timestamp:nowIso(),date:S.spec.iso},
                          attemptFields(o),{uploaded:false});
  a.push(rec); saveAttempts(a); S.attempts.push(rec); saveSession(); return rec;
}
// Перезапись существующей попытки (кнопка «Назад»): uuid, дата и номер
// остаются прежними, меняется только результат — новая запись не создаётся
// и нумерация не сдвигается.
function rewriteAttempt(id,o){
  const fields=attemptFields(o);
  const all=loadAttempts(), i=all.findIndex(x=>x.uuid===id);
  if(i>=0){ Object.assign(all[i],fields); saveAttempts(all); }
  const j=S.attempts.findIndex(x=>x.uuid===id);
  if(j>=0) Object.assign(S.attempts[j],fields);
  saveSession();
  return j>=0?S.attempts[j]:null;
}
function writeWellbeing(){ for(const pl of PLAYERS){ if(S.wellbeing[pl]!==undefined)
  pushAttempt({player:pl,ex:"E00",wellbeing:S.wellbeing[pl],note:"самочувствие",time_sec:null}); } }
function recordFor(player,ex,variant){const r=records()[player]; if(!r)return null;
  return r[ex+"|"+(variant||"")]??null;}
function prevToday(player,ex,variant){
  const l=S.attempts.filter(a=>a.player===player&&a.exercise_id===ex&&(a.variant||"")===(variant||"")&&a.time_sec!==null&&!a.lost);
  return l.length?l[l.length-1].time_sec:null;}

const app=document.getElementById("app");

function overlay(html){let o=document.getElementById("ovl");
  if(!o){o=document.createElement("div");o.id="ovl";o.className="overlay";document.body.appendChild(o);}

function closeOverlay(){const o=document.getElementById("ovl");if(o)o.remove();}
function toast(msg){overlay(`<div class="card center"><div>${msg}</div>

/* Служебные кнопки экрана работы. «Отмена занятия» вынесена отдельной
   строкой с отступом и закрыта подтверждением: в общем ряду её задевали
   локтем — пять кнопок в ряд слишком тесно. */
function smallActions(){return `<div class="small-actions">
  <button class="ghost small" onclick="showBlockScheme()">Схема</button>
  <button class="ghost small" onclick="showBlockWhat()">Что делать</button>
  <button class="ghost small" onclick="askNote()">Заметка</button>
  <button class="ghost small" onclick="confirmFinishExercise()">Завершить упражнение</button></div>
  <div class="cancel-row"><button class="warn small" onclick="confirmCancel()">Отмена занятия</button></div>`;}
function confirmCancel(){
  overlay(`<div class="card"><div class="title">Отменить занятие?</div>
    <div class="note">Прогресс сохранится: записанные попытки останутся
    и уйдут при выгрузке.</div>
    <div class="warnbox">Критерии остановки: выше 32 °C в тени · озноб ·
    гусиная кожа · прекратилось потоотделение · головная боль.</div>
    <div class="row"><button class="warn" onclick="cancelSession()">Да, отменить</button>
      <button class="go" onclick="closeOverlay();resumeStep()">Продолжить</button></div></div>`);
}
/* Занятие оборвано: жара, отмена, упражнение закрыто на середине. Записи
   сохраняются целиком, но помечаются interrupted — в рекорды и недельные
   проценты они не идут: одна подсерия из девяти дала бы «8 из 8 (100%)». */
function markInterrupted(){
  if(!S)return;
  S.interrupted=true;
  const mine=new Set((S.attempts||[]).map(a=>a.uuid));
  const all=loadAttempts();
  all.forEach(a=>{ if(mine.has(a.uuid)){a.interrupted=true;a.uploaded=false;} });
  saveAttempts(all);
  (S.attempts||[]).forEach(a=>{a.interrupted=true;});
  saveSession();
}
function cancelSession(){ markInterrupted(); closeOverlay(); stopCountdown();
  stopRestBadge(); screenHome(); }
/* Завершить УПРАЖНЕНИЕ — не занятие. Записанное остаётся, занятие идёт
   дальше со следующего блока; заминка и итог никуда не деваются. Раньше
   единственной кнопкой была «Отмена», и остановка упражнения обрывала
   занятие целиком. */
function confirmFinishExercise(){
  const name=(S&&S.block&&EX[S.block.ex])?EX[S.block.ex].name:"упражнение";
  overlay(`<div class="card"><div class="title">Завершить «${name}»?</div>
    <div class="note">Записанное сохранится. Занятие продолжится со следующего
    блока — это НЕ отмена занятия.</div>
    <div class="row"><button class="go" onclick="finishExercise()">Завершить упражнение</button>
      <button class="ghost" onclick="closeOverlay()">Отмена</button></div></div>`);
}
function finishExercise(){
  // Упражнение закрыто, не дойдя до конца серии — занятие считается
  // прерванным: данные неполные, сравнивать их с полными нельзя.
  const left=(S.measure&&S.measure.pos<S.measure.order.length)
    ||(S.ctrl&&S.ctrl.pos<S.ctrl.order.length)
    ||(S.duelrun&&S.duelrun.pos<S.duelrun.order.length)
    ||!!S.four;
  if(left) markInterrupted();
  closeOverlay(); stopCountdown(); stopRestBadge();
  if(S._restTimer){clearInterval(S._restTimer);S._restTimer=null;}
  if(S.watch&&S.watch.running){S.watch.running=false;
    if(S.watch.raf)cancelAnimationFrame(S.watch.raf);}
  ["measure","ctrl","duelrun","four","shots","e15s"].forEach(k=>{delete S[k];});
  saveSession(); nextStep();
}
// «Что делать» текущего упражнения — оверлеем, без потери прогресса.
function showBlockWhat(){
  if(!S||!S.block)return; const e=EX[S.block.ex];
  const diff=(e.diff&&(e.diff.DANIIL||e.diff.ADRIAN))?
    `<div class="blk"><div class="h">Различия</div>${e.diff.DANIIL?`<div><b>Даниил.</b> ${e.diff.DANIIL}</div>`:""}${e.diff.ADRIAN?`<div><b>Адриан.</b> ${e.diff.ADRIAN}</div>`:""}</div>`:"";
  overlay(`<div class="card"><div class="title">${e.name} · что делать</div>
    <ol>${stepsOf(e).map(s=>`<li>${s}</li>`).join("")}</ol>
    <div class="blk look"><div class="h">Смотри</div>${e.smotri}</div>

// Шапка экрана ввода счёта: игрок · упражнение · «Выполнено <word>: N».
/* Шапка блока. done задан — показываем реальный прогресс «выполнено X из N»;
   не задан (агрегатный ввод после серии) — сколько всего в блоке. Раньше
   писалось «Выполнено подходов: 5», когда выполнен был один: из-за этого
   казалось, что серия идёт по второму кругу. */
function countHeader(player,exName,n,word,done){
  const line=(done===undefined||done===null)
    ? `Всего ${word} в блоке: ${n}`
    : `Выполнено ${word}: ${done} из ${n}`;
  return `<div class="card"><div class="name" style="font-size:22px">${RU[player]||player} · ${exName}</div>
    <div class="note">${line}</div></div>`;
}
/* Состояние отдыха второго брата на экране того, кто работает: «Даниил
   отдыхает, готов через 0:34». Тикает раз в секунду, по готовности исчезает. */
let restTimer=null;
function stopRestBadge(){ if(restTimer){clearInterval(restTimer);restTimer=null;} }
function restBadge(elId,player,readyAt){
  stopRestBadge();
  const tick=()=>{
    const el=document.getElementById(elId);
    if(!el){ stopRestBadge(); return; }
    const left=Math.ceil((readyAt-Date.now())/1000);
    if(left<=0){ el.textContent=`${RU[player]} готов`; stopRestBadge(); return; }
    const m=Math.floor(left/60), sec=String(left%60).padStart(2,"0");
    el.textContent=`${RU[player]} отдыхает, готов через ${m}:${sec}`;
  };
  tick(); restTimer=setInterval(tick,1000);
}

/* Ручное обновление: если телефон всё же держит старую сборку. Сносит кэши
   и воркер и перезагружает страницу с сервера. Данные занятий лежат в
   localStorage и не трогаются. Только при сети: без неё это оставило бы
   приложение без офлайн-кэша прямо на поле. */
function confirmUpdate(){
  if(navigator.onLine===false){
    return overlay(`<div class="card"><div class="title">Нет сети</div>
      <div class="note">Обновление возможно только с интернетом: без него
      приложение осталось бы без офлайн-кэша.</div>
      <div class="row"><button class="ghost" onclick="closeOverlay()">Понятно</button></div></div>`);
  }
  overlay(`<div class="card"><div class="title">Обновить приложение?</div>
    <div class="note">Сейчас: ${buildLabel()}.<br>Страница перезагрузится с сервера.
    Записи занятий и рекорды сохранятся.</div>
    <div class="row"><button class="go" onclick="forceUpdate()">Обновить</button>
      <button class="ghost" onclick="closeOverlay()">Отмена</button></div></div>`);
}
function forceUpdate(){
  const reload=()=>location.replace(location.pathname+"?u="+Date.now());
  const jobs=[];
  if(window.caches&&caches.keys)
    jobs.push(caches.keys().then(ks=>Promise.all(ks.map(k=>caches.delete(k)))));
  if(navigator.serviceWorker&&navigator.serviceWorker.getRegistrations)
    jobs.push(navigator.serviceWorker.getRegistrations()
      .then(rs=>Promise.all(rs.map(r=>r.unregister()))));
  Promise.all(jobs).then(reload,reload);
}

   ================================================================ */
function buildSteps(){
  const steps=[];
  for(const w of warmupSteps(S.spec)) steps.push({kind:"timer",title:w.t,mins:w.min,body:w.body});
  // Пауза 1 мин ПЕРЕД каждым упражнением (после разминки и между блоками).
  S.spec.blocks.forEach((b,i)=>{
    // Упражнение, убранное у ОБОИХ (только «Разгон» в облегчённом), в занятие
    // не попадает вовсе — ни расстановки, ни паузы перед ним.
    if(!blockHasWork(b[0],S.spec))return;
    steps.push({kind:"pause"});
    steps.push({kind:"setup",ex:b[0],mins:b[1]});
    steps.push({kind:"what",ex:b[0]});
    steps.push({kind:"work",ex:b[0],mins:b[1]});
  });
  const cd=cooldownStep(S.spec);
  steps.push({kind:"timer",title:cd.t,mins:cd.min,body:cd.body});
  steps.push({kind:"summary"});
  S.steps=steps; S.stepIndex=0; S.startMs=performance.now();
  startSessionClock(); saveSession(); runStep();
}
function nextStep(){S.stepIndex++;runStep();}
function runStep(){
  saveSession();
  if(S.stepIndex>=S.steps.length)return screenSummary();
  const st=S.steps[S.stepIndex];
  S.block = (st.ex?{ex:st.ex}:S.block);
  if(st.kind==="timer")return screenTimer(st);
  if(st.kind==="pause")return screenPause();
  if(st.kind==="setup")return screenSetup(st);
  if(st.kind==="what")return screenWhat(st);
  if(st.kind==="work")return startWork(st);
  if(st.kind==="summary")return screenSummary();
}

function startWork(st){

/* Единоборства с учётом голов (E12, E14) ведутся ПО ПОДХОДАМ: строгое
   чередование, после каждого подхода три кнопки — гол, ушёл (обыграл),
   не ушёл (не обыграл). Общего ввода голов в конце нет: держать счёт
   в голове через десять подходов тренер не обязан.
   Отдых от своего финиша есть в обоих: в «Ты догоняешь» 90 с (рывок
   с сопротивлением на 20 м), в «Обыгрыше лицом» 40 с (18.08). */
const DUEL_WORDS={
  E12:{ok:"УШЁЛ",no:"НЕ УШЁЛ",lost:"Не ушёл",note:"не ушёл от опеки",
       hint:"ГОЛ — ушёл от опеки и забил · УШЁЛ — ушёл от опеки, но не забил · "+
            "НЕ УШЁЛ — не смог уйти, потерял мяч или ты его накрыл."},
  E14:{ok:"ОБЫГРАЛ",no:"НЕ ОБЫГРАЛ",lost:"Не обыграл",note:"не обыграл",
       hint:"ГОЛ — обыграл и забил · ОБЫГРАЛ — обыграл, но не забил · "+
            "НЕ ОБЫГРАЛ — не прошёл защитника."},
};
// Значения читаются в момент вызова: сами константы объявлены ниже.
function duelRestFor(ex){ return {E12:E12_REST_SEC,E14:E14_REST_SEC}[ex]||0; }
function workDuelGoals(st){ return duelRunStart(st); }
function duelRunStart(st){
  // Игроки независимы: у каждого своё число подходов (в облегчённом — два).
  const N={DANIIL:duelShotsFor(st.ex,S.spec,"DANIIL"),
           ADRIAN:duelShotsFor(st.ex,S.spec,"ADRIAN")}, order=[];
  for(let i=1;i<=Math.max(N.DANIIL,N.ADRIAN);i++)
    for(const pl of PLAYERS) if(i<=N[pl]) order.push({player:pl,no:i,N:N[pl]});
  S.duelrun={ex:st.ex,N:Math.max(N.DANIIL,N.ADRIAN),byPlayer:N,pos:0,order,
             readyAt:{DANIIL:0,ADRIAN:0}};
  duelRunAdvance();
}
function duelRunAdvance(){
  const d=S.duelrun;
  if(d.pos>=d.order.length){        // всё записано по ходу — ввода не нужно
    delete S.duelrun; saveSession(); return nextStep();
  }
  const cur=d.order[d.pos];
  return (d.readyAt[cur.player]-Date.now()>0)?duelRunRest(cur):duelRunRep(cur);
}
function duelRunRep(cur){
  const d=S.duelrun, other=cur.player==="DANIIL"?"ADRIAN":"DANIIL";
  const w=DUEL_WORDS[d.ex], rest=duelRestFor(d.ex);
  const done=d.order.slice(0,d.pos).filter(o=>o.player===cur.player).length;
  h(`${countHeader(cur.player,EX[d.ex].name+lightTag(cur.player),cur.N,"подходов",done)}
    <div class="title">${RU[cur.player]} · подход ${cur.no} из ${cur.N}</div>
    <div class="note">Второй в это время отдыхает.${rest?` Отдых ${rest} секунд
    от своего финиша — приложение следит.`:""}</div>
    <div class="row"><button class="go" onclick="duelRunDone('goal')">⚽ ГОЛ</button></div>
    <div class="row"><button onclick="duelRunDone('pass')">✓ ${w.ok}</button>
      <button class="warn" onclick="duelRunDone('lost')">✕ ${w.no}</button></div>
    <div class="note">${w.hint}</div>
    ${otherRestHtml()}
    ${smallActions()}`);
  if(d.readyAt[other]>Date.now()) restBadge("rest-other",other,d.readyAt[other]);
  else stopRestBadge();
}
function duelRunDone(kind){

/* ---- Измеряемые упражнения (time / time_goal / breakaway) ---- */
function startMeasure(st,part){
  const e=EX[st.ex];
  const plan=(st.ex==="E15")?e15Slots(part):repsFor(st.ex,S.spec);
  const order=[]; const mx=Math.max(plan.DANIIL.length,plan.ADRIAN.length);
  for(let i=0;i<mx;i++){ if(plan.DANIIL[i])order.push(plan.DANIIL[i]);
    if(plan.ADRIAN[i])order.push(plan.ADRIAN[i]); }
  // best и stopped — ПО СЕРИЯМ, а серия это игрок+вариант: старт сидя
  // всегда медленнее старта стоя, 20 м медленнее 15 м, и общий лучший
  // результат обрывал бы серию на ровном месте (dupl. bot/rules.py).
  S.measure={ex:st.ex,type:e.type,part:part||"",order,pos:0,
    stopped:{}, best:{},
    readyAt:{DANIIL:0,ADRIAN:0},firstDone:{DANIIL:false,ADRIAN:false}};
  saveSession(); measureAdvance();
}
// Ключ серии: свой вариант у каждого игрока.
function seriesKey(cur){ return cur.player+"|"+(cur.variant||""); }
function measureAdvance(){
  const m=S.measure;
  while(m.pos<m.order.length&&m.stopped[seriesKey(m.order[m.pos])])m.pos++;
  if(m.pos>=m.order.length)return afterMeasure();
  const cur=m.order[m.pos];
  if(cur.firstRest&&!m.firstDone[cur.player]) return screenFullRest(cur);
  const remain=m.readyAt[cur.player]-Date.now();
  if(remain<=10000) return screenStopwatch(cur, remain>0);
  return screenRestWait(cur);
}
function afterMeasure(){
  const m=S.measure;
  /* «Отрыв»: часть 1 → часть 2 Даниила → дельта → удары Адриана.
     В облегчённом у Даниила части 2 нет, а значит нет и дельты 1-3:
     считать её не по чему. В облегчённом у Адриана нет ударов с места. */
  if(m.ex==="E15"){
    if(m.part===E15_FRESH&&!isLight("DANIIL")) return screenBreakawayPart2();
    if(m.part===E15_FRESH){ m.part=E15_TIRED; m.deltaShown=true; }
    if(!m.deltaShown){ m.deltaShown=true; return screenBreakawayDelta(); }
    if(!m.adrianDone){ m.adrianDone=true;
      if(!isLight("ADRIAN")) return e15ShotsPick(); }
  }
  // Упражнение закрыто: снимаем состояние, иначе оно висит в сохранённой
  // сессии и при возврате в приложение мешает продолжить следующее.
  delete S.measure; saveSession();
  nextStep();
}

      Даниил: 3 повтора, отдых ровно 90 секунд. Стоп-правила нет.

function variantLabel(cur){
  const V={stance:"стойка",sit_face:"сидя лицом",sit_back:"сидя спиной",lie:"лёжа",
    spin:"спиной",side:"боком",

    fresh:"часть 1 · свежие",tired:"часть 2 · на усталости"};

function tapWatch(){

      el.textContent=((performance.now()-w.t0)/1000).toFixed(2);w.raf=requestAnimationFrame(loop);};
    w.raf=requestAnimationFrame(loop);

function notMeasured(){recordTime(null,true);}
function manualEntry(){overlay(`<div class="card"><div class="title">Ручной ввод (2.06 / 2,06 / 206)</div>
  <input type="text" id="mv" inputmode="decimal">
  <div class="row"><button class="go" onclick="applyManual()">Ок</button>
   <button class="ghost" onclick="closeOverlay()">Отмена</button></div></div>`);}
function parseTime(s){s=(s||"").trim().replace(",",".");if(!s)return null;
  let v=parseFloat(s); if(s.indexOf(".")<0&&v>=100)v=v/100; return isNaN(v)?null:v;}
function applyManual(){const v=parseTime(document.getElementById("mv").value);closeOverlay();recordTime(v);}
// Запись слота: обычным ходом создаём новую попытку, при возврате «Назад» —
// переписываем ту же самую.
function writeAttempt(cur,fields){
  const m=S.measure;
  const o=Object.assign({player:cur.player,ex:cur.ex,variant:cur.variant,
    attempt_no:cur.attempt_no},fields);
  const rec=(m.redo&&m.pos===m.redo.slot)?rewriteAttempt(m.redo.uuid,o):pushAttempt(o);
  m.writing=rec?rec.uuid:null;
  return rec;
}
// Запись, соответствующая слоту: тот же игрок, упражнение, вариант и номер.
function attemptOf(slot){
  for(let i=S.attempts.length-1;i>=0;i--){ const a=S.attempts[i];
    if(a.player===slot.player&&a.exercise_id===slot.ex
       &&(a.variant||"")===(slot.variant||"")&&a.attempt_no===slot.attempt_no) return a; }
  return null;
}
/* «Назад» — вернуться к предыдущей записанной попытке и ПЕРЕПИСАТЬ её.
   Новой записи не появляется, номера не сдвигаются; после перезаписи цикл
   возвращается туда, где был. Раньше кнопка удаляла последнюю запись и
   сдвигала позицию — из-за этого сбивалась нумерация. */
function measureBack(){
  const m=S.measure;
  if(m.redo) return measureAdvance();            // уже переписываем
  let k=m.pos-1;
  while(k>=0&&!attemptOf(m.order[k])) k--;
  if(k<0) return measureAdvance();               // переписывать нечего
  const rec=attemptOf(m.order[k]);
  m.redo={slot:k,uuid:rec.uuid,prev:rec.time_sec,returnPos:m.pos};
  m.pos=k; saveSession(); measureAdvance();
}
// После записи попытки: при перезаписи возвращаемся туда, где были.
function advanceAfterAttempt(){
  const m=S.measure;
  if(m.redo){ m.pos=m.redo.returnPos; m.redo=null; recomputeBest(); }
  else m.pos++;
  saveSession(); measureAdvance();
}
// Лучшее в каждой серии заново по записям: перезапись могла его изменить.
function recomputeBest(){
  const m=S.measure; m.best={};
  m.order.slice(0,m.pos).forEach(sl=>{
    const a=attemptOf(sl); if(!a||a.time_sec===null||a.lost)return;
    const k=seriesKey(sl);
    m.best[k]=(m.best[k]===undefined)?a.time_sec:Math.min(m.best[k],a.time_sec);
  });
}

function recordTime(t,nm){
  const m=S.measure, cur=m.order[m.pos];
  writeAttempt(cur,{time_sec:t,dist:cur.dist,note:nm?"не засечено":""});
  // Гол за попытку спрашиваем по флагу слота, а не по типу упражнения:
  // «Отрыв» — свой тип (breakaway), но гол в нём тоже пишется.
  if(cur.goal && t!==null){ return screenGoalAsk(cur,t); }
  finalizeTime(cur,t);
}
// Потеря мяча: если секундомер идёт — фиксируем текущее время, иначе без времени.
// Попытка помечается lost=true и не влияет на лучшее/среднее/стоп-правило.
function lostBall(){
  const w=S.watch, m=S.measure, cur=m.order[m.pos];
  let t=null;
  if(w&&w.running){ w.running=false; if(w.raf)cancelAnimationFrame(w.raf);
    t=(performance.now()-w.t0)/1000; }
  writeAttempt(cur,{time_sec:t,dist:cur.dist,lost:true,note:"потеря мяча"});
  // Ни стоп-правила, ни экрана гола: потеря — это отсутствие завершения.
  m.readyAt[cur.player]=Date.now()+(cur.rest||60)*1000;
  advanceAfterAttempt();
}
function screenGoalAsk(cur,t){
  h(`<h1>Гол?</h1>
    <div class="card center">
      <div style="font-size:24px;font-weight:800">${RU[cur.player]} · ${t.toFixed(2)} · Гол?</div></div>
    <div class="row"><button class="go" onclick="setGoal(true)">⚽ ДА</button>
      <button class="warn" onclick="setGoal(false)">✕ НЕТ</button></div>`);
}
function setGoal(g){
  const m=S.measure, cur=m.order[m.pos];
  const a=S.attempts.find(x=>x.uuid===m.writing)||S.attempts[S.attempts.length-1];
  a.goals=g?1:0; a.shots=1;
  const all=loadAttempts(); const ix=all.findIndex(x=>x.uuid===a.uuid);
  if(ix>=0){all[ix].goals=a.goals;all[ix].shots=a.shots;saveAttempts(all);}
  saveSession();
  finalizeTime(cur, a.time_sec);
}
function finalizeTime(cur,t){
  const m=S.measure, key=seriesKey(cur);
  // Стоп-правило: только там, где задан порог, и не в части 2 «Отрыва»
  // (slot с noStop). Лучшее берётся ВНУТРИ своей серии (игрок+вариант).
  // При перезаписи попытки серию не обрываем: тренер правит замер, а не
  // бежит заново.
  const th=(cur.noStop||m.redo)?null:exOf(cur.ex).stopT;
  const b=(m.best[key]===undefined)?null:m.best[key];
  if(t!==null && th && b!==null && Math.round((t-b)*100)/100>=th)
    return screenStopRule(cur,b,t);
  if(t!==null) m.best[key]=(b===null)?t:Math.min(b,t);
  m.readyAt[cur.player]=Date.now()+ (cur.rest||60)*1000;
  advanceAfterAttempt();
}
function screenStopRule(cur,best,t){
  h(`<h1>Стоп-правило</h1>
    <div class="card center"><div class="name">${RU[cur.player]}</div>
      <div class="title">Серия окончена</div>
      <div class="big">Лучшее: ${best.toFixed(2)}</div>
      <div class="note">Последняя ${t.toFixed(2)} — падение ${(t-best).toFixed(2)}.</div></div>
    <div class="row"><button class="go" onclick="stopSeries()">Завершить</button>
      <button class="ghost" onclick="continueSeries()">Ещё один</button></div>`);
}
// Обрывается только эта серия (игрок+вариант) — другие варианты идут дальше.
function stopSeries(){const m=S.measure,cur=m.order[m.pos];
  m.stopped[seriesKey(cur)]=true;m.pos++;saveSession();measureAdvance();}
function continueSeries(){const m=S.measure,cur=m.order[m.pos],k=seriesKey(cur);
  const a=S.attempts.find(x=>x.uuid===m.writing), t=a?a.time_sec:null;
  if(t!==null) m.best[k]=Math.min(m.best[k]??Infinity,t);
  m.readyAt[cur.player]=Date.now()+(cur.rest||60)*1000; advanceAfterAttempt();}

/* ---- shots: «забил из N» — общий экран счёта (сейчас только E07) ---- */
/* «Разворот» идёт ДВУМЯ подсериями: пять приёмов подряд, пока ты стоишь
   справа за спиной, потом пять слева. Раньше сторона менялась каждую
   попытку — счёт по сторонам не разделялся и слабая сторона тонула
   в общем проценте. Учёт голов отдельно по каждой подсерии. */
const E07_SUBS=[{v:"turn_right",side:"справа",label:"ты справа за спиной"},
                {v:"turn_left", side:"слева", label:"ты слева за спиной"}];
function shotsDist(ex){ return ex==="E07"?{DANIIL:20,ADRIAN:15}:{DANIIL:15,ADRIAN:12}; }
function workShots(st){ // подсерия за подсерией, внутри — оба игрока
  const ex=st.ex;
  S.shots={ex,player:"DANIIL",sub:0,dist:shotsDist(ex),
    word:EX[ex].shotsWord||"ударов", verb:EX[ex].shotsVerb||"попал"};
  shotsRender();
}
function shotsRender(){
  const s=S.shots, sub=E07_SUBS[s.sub], N=e07Shots(s.player);
  h(`${countHeader(s.player,EX[s.ex].name+" · "+sub.side+lightTag(s.player),N,s.word)}
    <div class="title">Сколько ${s.verb} из ${N}?</div>
    <div class="note">Подсерия ${s.sub+1} из ${E07_SUBS.length}: ${sub.label},

    <div class="gridN">${Array.from({length:N+1},(_,i)=>`<button onclick="shotsSave(${i})">${i}</button>`).join("")}</div>
    ${smallActions()}`);
}
function shotsSave(g){const s=S.shots, sub=E07_SUBS[s.sub];
  pushAttempt({player:s.player,ex:s.ex,variant:sub.v,attempt_no:s.sub+1,
    goals:g,shots:e07Shots(s.player),dist:s.dist[s.player]});
  if(s.player==="DANIIL"){s.player="ADRIAN";return shotsRender();}
  s.player="DANIIL"; s.sub++;

/* ---- control: контроль 1-5 + голы из N (E13) ---- */
/* Приём под опекой: сначала сами приёмы с отдыхом, потом ввод результата.
   Отдых между СВОИМИ приёмами — минута. Братья чередуются, поэтому часть
   минуты набегает сама, пока принимает второй: ждём только остаток до
   готовности, лишнего экрана на полную минуту не появляется. */
const E13_REST_SEC=60;
// Отдых между своими подходами в «Ты догоняешь» (dupl. bot/catalog.py).
const E12_REST_SEC=90;
/* Отдых между своими подходами в «Обыгрыше лицом»: 0 → 40 с (18.08).
   Обыгрыш идёт на рывке в упор, шесть подходов подряд без паузы шли на
   падающей свежести. Братья чередуются, поэтому подход второго закрывает
   почти всю паузу — ждём только остаток (dupl. bot/catalog.py). */
const E14_REST_SEC=40;
/* Игроки идут НЕЗАВИСИМО: у каждого своё число приёмов (в облегчённом их
   меньше). Кто закончил — выпадает из очереди, второй доделывает своё;
   упражнение не обрывается раньше времени из-за первого. */
function workControl(st){
  const N={DANIIL:receptionsFor(S.spec,"DANIIL"),ADRIAN:receptionsFor(S.spec,"ADRIAN")};
  const order=[];
  for(let i=1;i<=Math.max(N.DANIIL,N.ADRIAN);i++)
    for(const pl of PLAYERS) if(i<=N[pl]) order.push({player:pl,no:i,N:N[pl]});
  S.ctrl={ex:st.ex,player:"DANIIL",N:Math.max(N.DANIIL,N.ADRIAN),byPlayer:N,
          stage:"reps",pos:0,order,readyAt:{DANIIL:0,ADRIAN:0}};
  ctrlAdvance();
}
function ctrlAdvance(){
  const c=S.ctrl;
  if(c.pos>=c.order.length){        // всё записано по ходу — ввода не нужно
    delete S.ctrl; saveSession(); return nextStep();
  }
  const cur=c.order[c.pos];
  return (c.readyAt[cur.player]-Date.now()>0)?ctrlRest(cur):ctrlRep(cur);
}
/* Учёт по КАЖДОМУ приёму, тремя кнопками. Контроль тренер не вводит:
   он считается из доли удержанных мячей (dupl. bot/rules.control_from_losses). */
function ctrlRep(cur){
  const c=S.ctrl, other=cur.player==="DANIIL"?"ADRIAN":"DANIIL";
  const done=c.order.slice(0,c.pos).filter(o=>o.player===cur.player).length;
  h(`${countHeader(cur.player,"Приём под опекой"+lightTag(cur.player),cur.N,"приёмов",done)}
    <div class="title">${RU[cur.player]} · приём ${cur.no} из ${cur.N}</div>
    <div class="note">Вариант объявляешь вслух до паса. Между своими приёмами

    <div class="row"><button class="go" onclick="ctrlRepDone('goal')">⚽ ГОЛ</button></div>
    <div class="row"><button onclick="ctrlRepDone('hold')">✓ УДЕРЖАЛ</button>
      <button class="warn" onclick="ctrlRepDone('lost')">✕ ПОТЕРЯЛ</button></div>
    <div class="note">ГОЛ — удержал и забил · УДЕРЖАЛ — удержал, не забил ·
    ПОТЕРЯЛ — потерял мяч под давлением.</div>
    ${otherRestHtml()}
    ${smallActions()}`);
  if(c.readyAt[other]>Date.now()) restBadge("rest-other",other,c.readyAt[other]);
  else stopRestBadge();
}
function ctrlRepDone(kind){
  const c=S.ctrl, cur=c.order[c.pos];
  pushAttempt({player:cur.player,ex:c.ex,attempt_no:cur.no,shots:1,
    goals:kind==="goal"?1:0,lost:kind==="lost",
    note:kind==="lost"?"потеря мяча":""});

}
function ctrlRest(cur){
  const c=S.ctrl, target=c.readyAt[cur.player];
  h(`<h1>Отдых</h1>
    <div class="card center"><div class="sub">следующий</div>

}

/* ---- Удары (E10): 4 серии по подсериям, 45 ударов на игрока ---- */
const E10_SERIES_NAME={1:"Удары с места",2:"Удары после приёма",3:"Удары с фланга",4:"Рывок на пас"};
function e10subs(series){return E10_SUB.filter(s=>s.series===series);}
function e10Total(){return E10_SUB.reduce((a,s)=>a+s.shots,0);}
// Дистанция удара конкретной подсерии — чтобы тексты не собирали её строкой.
function e10dist(series,kind,player){
  const sub=e10subs(series).find(s=>s.kind===kind)||e10subs(series)[0];
  return sub.dist[player];
}
function e10SeriesShots(series){return e10subs(series).reduce((a,s)=>a+s.shots,0);}
function workFour(st){ S.four={series:1,player:"DANIIL",queue:null,pos:0}; fourEnter(); }
// Серия 4 (рывок на пас) в облегчённом режиме убрана: это беговая работа,
// а не удары. Серии 1-3 остаются, в подсерии три удара вместо пяти.
function fourHasWork(series,player){ return !(series===4&&isLight(player)); }
// Вход в (серия, игрок): экран выбора первой подсерии.
function fourEnter(){
  const f=S.four, subs=e10subs(f.series);
  if(!fourHasWork(f.series,f.player)) return fourNextPlayer();
  h(`<h1>${E10_SERIES_NAME[f.series]} · ${RU[f.player]}${lightTag(f.player)}</h1>
    <div class="reps">Серия ${f.series}/4. Выбери подсерию — дальше приложение ведёт само.</div>
    <div class="row">${subs.map(s=>`<button class="go" onclick="fourPick('${s.v}')">${s.kind} ${s.dist[f.player]} м</button>`).join("")}</div>
    ${smallActions()}`);
}
// Игрок закончил серию: дальше второй, потом следующая серия. Серию, где
// работы нет ни у кого (четвёртая при двух облегчённых), пропускаем молча.
function fourNextPlayer(){
  const f=S.four;
  if(f.player==="DANIIL"){f.player="ADRIAN";f.queue=null;f.pos=0;return fourEnter();}
  while(f.series<4){
    f.series++; f.player="DANIIL"; f.queue=null; f.pos=0;
    if(PLAYERS.some(pl=>fourHasWork(f.series,pl))) return fourSeriesBreak();
  }
  delete S.four; return nextStep();
}
function fourPick(v){
  const f=S.four, subs=e10subs(f.series).map(s=>s.v);
  f.queue=[v,...subs.filter(x=>x!==v)]; f.pos=0; fourRunSub();
}
function fourRunSub(){
  const f=S.four;
  if(f.pos>=f.queue.length) return fourNextPlayer();   // игрок закончил серию
  const sub=E10_SUB.find(s=>s.v===f.queue[f.pos]);
  if(sub.timed){ f.rush={sub,shot:1}; fourRushWatch(); }
  else fourAggShot(sub);
}
function fourSeriesBreak(){
  h(`<h1>Смена постановки</h1>
    <div class="card center"><div class="title">Серия ${S.four.series}/4</div>
      <div style="font-size:20px;margin-top:8px">${E10_SERIES_NAME[S.four.series]}. Переставь фишки.</div></div>
    <div class="row"><button class="go" onclick="fourEnter()">Готово</button></div>`);
}
// Подсерия без замера (серии 1-3): экран удара → учёт голов из 5.
function fourAggShot(sub){

}

function fourAggSave(v,goals){
